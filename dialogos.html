/* Para buscar: sin acentos (ruso y español), ё = е, ñ = n, minúsculas. */
function norm(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[̀́̃̈]/g, "").normalize("NFC");
}

/* ── Voz: la compartida de core.js (azHablarRu / azHablarEs), con la voz
   de cada personaje. Las llaves { } del texto marcan palabras y no se leen. */
function speakRu(text, genero) {
  const t = String(text || "").replace(/[{}]/g, "");
  if (ES) azHablarEs(t, null, genero); else azHablarRu(t, genero);
}
function speakSeq(items, onLine, onEnd) {
  const lista = items.map(it => ({ texto: String(it.text).replace(/[{}]/g, ""), genero: it.genero }));
  if (ES) azHablarSecuenciaEs(lista, onLine, onEnd); else azHablarSecuencia(lista, onLine, onEnd);
}
function stopSpeech() { azCallar(); }

function useLockScroll() {

/* Personaje de una línea, según el registro elegido */
function personajeDe(d, clave, registro) {
  const k = registro === "вы" && d.vy && d.vy[clave] ? d.vy[clave] : clave;

function lineaEn(l, registro) {

}
/* Diálogos que usan una frase / una nota cultural */

  return DIALOGOS_D.filter(d => d.lineas.some(l => (l.f || []).includes(fid) || (l.vy && (l.vy.f || []).includes(fid))));
}
function dialogosConCultura(cid) {
  return DIALOGOS_D.filter(d => d.lineas.some(l => l.cul === cid || (l.vy && l.vy.cul === cid)));

    return h("a", { key: i, className: "w-row", href, onClick: (ev) => azNavigate(ev, href) },
      h("span", null,

            h("div", { className: "translit" }, d.titulo)
          ),
          h("button", { className: "play", onClick: todas, "aria-label": sonando !== null ? TX.detener : TX.escucharTodo }, sonando !== null ? "■" : "▶")
        ),
        h("span", { className: "pos-badge" }, TX.badge(d)),
        h("div", { className: "tags" },
          h("span", { className: "tag" }, SIT[d.situacion] || ""),
          personajes.map(p => h("span", { key: p.clave, className: "tag" }, nombreMeta(p)))
        )
      ),
      h("div", { className: "fbody" },
        h("div", { className: "section-lbl" }, TX.dialogo),
        h("div", { className: "pair-row" },
          d.vy && [chip(reg === "ты", "ты · informal", () => setRegistro("ты"), "ty"), chip(reg === "вы", "вы · formal", () => setRegistro("вы"), "vy")],
          chip(showTr, TX.tr, () => setShowTr(!showTr), "tr"),
          chip(showEs, TX.trad, () => setShowEs(!showEs), "es")
        ),
        h("div", { className: "pair-row" },
          h("span", { className: "pair-lbl" }, TX.practicar),
          chip(practica === null, TX.todo, () => { setPractica(null); setReveladas({}); }, "all"),
          personajes.map(p => chip(practica === p.clave, TX.soy(p), () => { setPractica(p.clave); setReveladas({}); }, p.clave))
        ),
        d.lineas.map((l, i) => h(Linea, {
          key: i, d, l, idx: i, registro: reg, showTr, showEs,
          oculta: practica !== null && personajeDe(d, l.p, reg).clave === practica && !reveladas[i],
          onRevelar: () => setReveladas(Object.assign({}, reveladas, { [i]: true })),
          abierta: abierta === i, onAbrir: () => abrir(i),
          sonando: sonando === i, onCultura
        })),
        h("div", { className: "tnote" }, practica ? TX.notaPractica : TX.notaVer),

        frIds.length > 0 && h("div", null,
          h("div", { className: "section-lbl" }, TX.frasesDe),
          h("div", { className: "list" }, frIds.map(fid => { const f = frasePorId(fid); return f && h(FilaFrase, { key: fid, f, onClick: () => onFrase(fid) }); }))
        ),
        culIds.length > 0 && h("div", null,
          h("div", { className: "section-lbl" }, TX.cultura),
          h("div", { className: "list" }, culIds.map(cid => { const n = culPorId(cid); return n && h(FilaCultura, { key: cid, n, onClick: () => onCultura(cid) }); }))
        )
      )
    ),
    h("div", { className: "nav-row" },
      prev ? navLink(prev, "‹ " + (ES ? prev.tituloEs : prev.titulo)) : h("span"),
      next ? navLink(next, (ES ? next.tituloEs : next.titulo) + " ›") : h("span")
    )
  );
}

/* ── Búsqueda en diálogos, frases y notas ── */
function buscar(q) {
  const k = norm(q.trim());
  if (!k) return [];
  const out = [];
  DIALOGOS_D.forEach(d => {
    const textos = [d.titulo, tituloMeta(d)].concat(d.lineas.flatMap(l => [l.ru, l.es].concat(l.vy ? [l.vy.ru, l.vy.es] : [])));
    if (textos.some(t => norm(t).includes(k))) out.push({ tipo: "dialogo", d });
  });
  FRASES_D.forEach(f => { if (norm(f.ru).includes(k) || norm(f.es).includes(k)) out.push({ tipo: "frase", f }); });
  CULTURA_D.forEach(n => { if (norm(n.titulo).includes(k) || norm(n.resumen).includes(k)) out.push({ tipo: "cultura", n }); });
  return out.slice(0, 40);
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const id = PARAMS.get("id");
  const [view, setView] = useState(() => ["dialogos", "frases", "cultura"].includes(PARAMS.get("v")) ? PARAMS.get("v") : "inicio");
  const [q, setQ] = useState("");
  const [sheet, setSheet] = useState(() => PARAMS.get("frase") ? { t: "frase", id: PARAMS.get("frase") } : PARAMS.get("cul") ? { t: "cul", id: PARAMS.get("cul") } : null);
  const [favs, setFavs] = useState([]);
  const qRef = useRef(null);
  const searchWrapRef = useRef(null);
  const [headerH, setHeaderH] = useState(0);
  const [searchH, setSearchH] = useState(0);

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      await azLoadProgress();
      azModuleTouch('dialogos');
      setFavs((AZ_PROGRESS.favorites || []).filter(k => k.indexOf("frases:") === 0));
    })();
  }, []);

  useLayoutEffect(() => {
    function measure() {
      const header = document.querySelector("header");
      if (header) setHeaderH(header.getBoundingClientRect().height);
      if (searchWrapRef.current) setSearchH(searchWrapRef.current.getBoundingClientRect().height);
    }
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, [darkMode]);

  useEffect(() => { window.scrollTo(0, 0); }, [view]);

  const c = azColors(darkMode);
  const toggleFav = (key) => { azToggleFavorite(key); setFavs((AZ_PROGRESS.favorites || []).filter(k => k.indexOf("frases:") === 0)); };
  const abrirFrase = (fid) => { setQ(""); setSheet({ t: "frase", id: fid }); };
  const abrirCultura = (cid) => { setQ(""); setSheet({ t: "cul", id: cid }); };

  const results = q.trim() ? buscar(q) : [];
  const TIPO_LBL = TX.tipo;
  const TIPO_CUL = Object.fromEntries(TX.tiposCul);
  const resultRows = results.map((r, i) => {
    if (r.tipo === "dialogo") {
      const href = "dialogos.html?id=" + r.d.id;
      return h("a", { key: "d" + r.d.id, className: "res-row", href, onClick: (e) => azNavigate(e, href) },
        h("span", null, h("span", { className: "res-ru" }, tituloMeta(r.d)), h("span", { className: "res-asp" }, TIPO_LBL.dialogo)),
        h("span", { className: "res-es" }, r.d.titulo));
    }
    if (r.tipo === "frase") return h("button", { key: "f" + r.f.id, className: "res-row", onClick: () => abrirFrase(r.f.id) },
      h("span", null, h("span", { className: "res-ru" }, meta(r.f)), h("span", { className: "res-asp" }, TIPO_LBL.frase)),
      h("span", { className: "res-es" }, trad(r.f)));
    return h("button", { key: "c" + r.n.id, className: "res-row", onClick: () => abrirCultura(r.n.id) },
      h("span", null, h("span", { className: "res-ru" }, r.n.titulo), h("span", { className: "res-asp" }, TIPO_LBL.cultura)),
      h("span", { className: "res-es" }, TIPO_CUL[r.n.tipo] || r.n.tipo));
  });
  const noResults = h("div", { style: { padding: "12px 16px", fontSize: "var(--az-fs-chico)", color: c.textMuted } }, TX.sinRes);

  const campo = [
    h("input", {
      ref: qRef, value: q,
      onInput: (e) => setQ(e.target.value),
      placeholder: TX.buscar,
      style: { width: "100%", boxSizing: "border-box", background: c.bg2, border: `1px solid ${c.border}`, borderRadius: "var(--az-r)", padding: "12px 34px 12px 14px", color: c.text, fontSize: "var(--az-fs-chico)" }
    }),
    q && h("button", {
      onClick: () => { setQ(""); if (qRef.current) qRef.current.focus(); },
      "aria-label": TX.limpiar,
      style: { position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", width: 24, height: 24, borderRadius: "50%", background: c.border, border: "none", color: c.text, fontSize: "var(--az-fs-chico)", lineHeight: 1, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }
    }, "✕")
  ];
  const searchBar = id && h("div", {
    ref: searchWrapRef,
    style: { position: "fixed", top: headerH, left: 0, right: 0, zIndex: 90, background: c.bg, backdropFilter: "blur(12px)", borderBottom: `1px solid ${c.border}`, padding: "12px 3vw" }
  },
    h("div", { style: { maxWidth: 960, margin: "0 auto", position: "relative" } },
      ...campo,
      q.trim() && h("div", {
        style: { position: "absolute", top: "calc(100% + 6px)", left: 0, right: 0, zIndex: 50, maxHeight: "50vh", overflowY: "auto", background: c.card, border: `1px solid ${c.border}`, borderRadius: "var(--az-r)", boxShadow: "0 16px 40px rgba(0,0,0,.4)" }
      }, results.length ? resultRows : noResults)
    )
  );

  /* ── Portada ── */
  const modulo = (typeof AZ_MODULES !== "undefined" ? AZ_MODULES : []).find(m => m.id === "dialogos") || {};
  const kicker = TX.kicker(DIALOGOS_D.length, FRASES_D.length, CULTURA_D.length);
  const INTRO_ITEMS = TX.introItems;
  const EJEMPLOS = TX.ejemplos.map(dlgPorId).filter(Boolean);
  const buscando = !!q.trim();
  const portada = h("div", null,
    !buscando && h("div", { className: "intro" },
      h("div", { className: "intro-top" },
        h("div", { className: "intro-icon", style: { background: azModuloColor(modulo).bg, color: azModuloColor(modulo).fg } }, modulo.glyph || ""),
        h("div", null,
          h("div", { className: "intro-title" }, modulo.title || TX.titulo),
          h("div", { className: "intro-kicker" }, kicker)
        )
      ),
      h("div", { className: "intro-desc" }, TX.intro),
      INTRO_ITEMS.map((it, i) => h("div", { key: i, className: "intro-item" },
        h("span", { className: "intro-dot" }),
        h("div", null, h("div", { className: "intro-it" }, it[0]), h("div", { className: "intro-id" }, it[1]))
      ))
    ),
    h("div", { style: { position: "relative" } }, ...campo),
    !buscando && h("div", { className: "search-hint" }, TX.pista),
    !buscando && h("div", { className: "try-row" },
      h("span", { className: "try-lbl" }, TX.prueba),
      EJEMPLOS.map(d => { const href = "dialogos.html?id=" + d.id; return h("a", { key: d.id, className: "try-chip", href, onClick: (ev) => azNavigate(ev, href) }, ES ? d.tituloEs : d.titulo); })
    ),
    buscando && h("div", { className: "list", style: { marginTop: 12, animation: "fadeIn var(--az-t-media) var(--az-curva)" } }, results.length ? resultRows : noResults)
  );

  /* ── Listas ── */
  const vistaDialogos = h("div", { style: { animation: "fadeIn var(--az-t-media) var(--az-curva)" } },
    h("div", { className: "page-title" }, TX.listaD),
    h("div", { className: "page-desc" }, TX.descD),
    SITUACIONES_D.map(s => {
      const lista = DIALOGOS_D.filter(d => d.situacion === s[0]);
      return lista.length > 0 && h("div", { key: s[0] },
        h("div", { className: "section-lbl" }, s[1]),
        h(ListaDialogos, { lista })
      );
    })
  );
  const favFrases = favs.map(k => frasePorId(k.slice(7))).filter(Boolean);
  const vistaFrases = h("div", { style: { animation: "fadeIn var(--az-t-media) var(--az-curva)" } },
    h("div", { className: "page-title" }, TX.listaF),
    h("div", { className: "page-desc" }, TX.descF),
    favFrases.length > 0 && h("div", null,
      h("div", { className: "section-lbl" }, TX.misFrases),
      h("div", { className: "list" }, favFrases.map(f => h(FilaFrase, { key: f.id, f, onClick: () => abrirFrase(f.id) })))
    ),
    FUNCIONES_D.map(fn => {
      const lista = FRASES_D.filter(f => f.funcion === fn[0]);
      return lista.length > 0 && h("div", { key: fn[0] },
        h("div", { className: "section-lbl" }, fn[1]),
        h("div", { className: "list" }, lista.map(f => h(FilaFrase, { key: f.id, f, onClick: () => abrirFrase(f.id) })))
      );
    })
  );
  const vistaCultura = h("div", { style: { animation: "fadeIn var(--az-t-media) var(--az-curva)" } },
    h("div", { className: "page-title" }, TX.listaC),
    h("div", { className: "page-desc" }, TX.descC),
    TX.tiposCul.map(([t, nombre]) => {
      const lista = CULTURA_D.filter(n => n.tipo === t);
      return lista.length > 0 && h("div", { key: t },
        h("div", { className: "section-lbl" }, nombre),
        h("div", { className: "list" }, lista.map(n => h(FilaCultura, { key: n.id, n, onClick: () => abrirCultura(n.id) })))
      );
    })
  );

  /* Bottom nav: en la ficha, las tabs vuelven a las listas */
  const irA = (v) => () => {
    if (id) { stopSpeech(); window.location.href = "dialogos.html" + (v === "inicio" ? "" : "?v=" + v); }
    else setView(v);
  };
  const tabs = [
    { id: "inicio", icon: "⊞", label: TX.tabs[0], action: irA("inicio") },
    { id: "dialogos", icon: "💬", label: TX.tabs[1], action: irA("dialogos") },
    { id: "frases", icon: "🗣️", label: TX.tabs[2], action: irA("frases") },
    { id: "cultura", icon: "🏛️", label: TX.tabs[3], action: irA("cultura") }
  ];

  let contenido;
  if (id) contenido = h(FichaDialogo, { key: id, id, c, onFrase: abrirFrase, onCultura: abrirCultura });
  else if (view === "dialogos") contenido = vistaDialogos;
  else if (view === "frases") contenido = vistaFrases;
  else if (view === "cultura") contenido = vistaCultura;
  else contenido = portada;

  return h(AzShell, { darkMode, setDarkMode, moduleId: "dialogos", tabs, view: id ? "dialogos" : view, setView },
    h(DlgStyles, { c }),
    searchBar,
    h("div", { style: { paddingTop: id ? (searchH ? searchH + 14 + "px" : "18px") : "16px" } }, contenido),
    sheet && sheet.t === "frase" && h(FraseSheet, { key: sheet.id, fid: sheet.id, onClose: () => setSheet(null), onCultura: abrirCultura, favs, toggleFav }),
    sheet && sheet.t === "cul" && h(CulturaSheet, { key: sheet.id, cid: sheet.id, onClose: () => setSheet(null), onFrase: abrirFrase })
  );
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
