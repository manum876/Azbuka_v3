<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<body>
<div id="root"></div>
<script src="assets/preact.js"></script>
<script src="data/data-lexicon.js"></script>

<script src="data/data-verbos.js"></script>

<script>
/* ============================================================
   AZBUKA-7.HTML — Unidad 7: Tiempo, fechas y rutina diaria
   ------------------------------------------------------------
   04/10/2026. Piezas de unidad-ui.js y unidad.js. Propio de esta
   unidad: reloj dibujado para practicar la hora (módulo 1 y
   portada), tablas de horas, días y meses, el día en emoji
   (módulo 6), la agenda de Ana (módulo 9), lecturas (módulo 10) y
   la agenda para completar del proyecto «Моя неде́ля».
   URL: azbuka-7.html · azbuka-7.html?m=u7m1
   ============================================================ */
const { useState, useEffect } = htmPreact;
const h = React.createElement;
const U = UNIDAD_7;
const EJ_U7 = ejerciciosUnidad7();
const EJ_U7_BASE = EJ_U7.filter(e => !e.ampliacion);
const D7 = u7Datos();
const OBJETIVO_U7 = LEXICON_COMER.filter(e => (e.introducedIn || []).indexOf(7) >= 0 || (e.appearsIn || []).indexOf(7) >= 0).map(e => e.id);
const AVISO_ACENTOS = "En Azbuka, los acentos (´) son solo una ayuda para leer: en ruso no se escriben, así que no hace falta que los pongas. La е vale por ё.";
const cap7 = t => t.charAt(0).toUpperCase() + t.slice(1);

function detalleTarjeta(e) {
  const d = D7.dias.find(x => x.id === e.id); if (d) return "¿cuándo? " + d.pr + " " + d.acc;
  const m = D7.meses.find(x => x.id === e.id); if (m) return "¿en qué mes? в " + m.prep;
  const v = D7.verb[D7.sin(e.acento || e.ru)];
  return v ? ["я", "ты", "он / она́", "мы", "вы", "они́"].map((p, i) => p + " " + v.f[i]).join(" · ") : null;
}

/* Reloj dibujado: una hora en punto al azar; se escribe en ruso y se revisa */
function Reloj({ n, c, size }) {
  const S = size || 150, r = S / 2 - 6, cx = S / 2, ang = (n % 12) / 12 * 2 * Math.PI;
  return h("svg", { viewBox: "0 0 " + S + " " + S, width: S, height: S, role: "img", "aria-label": "Reloj" },
    h("circle", { cx, cy: cx, r, fill: c.bg2, stroke: c.gold, "stroke-width": 3 }),
    [...Array(12)].map((_, k) => { const a = k / 12 * 2 * Math.PI; return h("line", { key: k, x1: cx + Math.sin(a) * (r - 4), y1: cx - Math.cos(a) * (r - 4), x2: cx + Math.sin(a) * (r - (k % 3 ? 10 : 16)), y2: cx - Math.cos(a) * (r - (k % 3 ? 10 : 16)), stroke: c.textMuted, "stroke-width": k % 3 ? 2 : 3 }); }),
    h("line", { x1: cx, y1: cx, x2: cx + Math.sin(ang) * r * 0.5, y2: cx - Math.cos(ang) * r * 0.5, stroke: c.text, "stroke-width": 6, "stroke-linecap": "round" }),
    h("line", { x1: cx, y1: cx, x2: cx, y2: cx - r * 0.78, stroke: c.gold, "stroke-width": 4, "stroke-linecap": "round" }),
    h("circle", { cx, cy: cx, r: 5, fill: c.gold }));
}
function ActividadReloj({ c, green }) {
  const [n, setN] = useState(() => 1 + Math.floor(Math.random() * 12));
  const [txt, setTxt] = useState("");
  const [res, setRes] = useState(null);
  const ok = cap7(D7.hora(n)) + ".";
  const norm = t => (t.match(/[А-Яа-яЁё\u0301-]+/g) || []).map(azFormaClave).filter(w => w !== "сейчас").join(" ");
  const revisar = () => setRes(norm(txt) === norm(ok) || (n === 1 && norm(txt) === "один час"));
  const otra = () => { let m; do { m = 1 + Math.floor(Math.random() * 12); } while (m === n); setN(m); setTxt(""); setRes(null); };
  return h("div", { className: "u-card", style: { padding: 16, marginTop: 14 } },
    h("div", { className: "u-kicker", style: { marginBottom: 6 } }, "Кото́рый час?"),
    h("div", { style: { display: "flex", justifyContent: "center", margin: "6px 0 10px" } }, h(Reloj, { n, c })),
    h("input", { className: "pr-input", lang: "ru", value: txt, placeholder: "Escribí la hora en ruso…", onInput: e => { setTxt(e.target.value); setRes(null); },
      autocapitalize: "off", autocorrect: "off", spellcheck: false, autocomplete: "off",
      style: { width: "100%", boxSizing: "border-box", background: c.bg3, border: `1px solid ${c.border}`, borderRadius: 10, padding: "11px 12px", color: c.text, fontSize: 16, fontFamily: "inherit" } }),
    h("button", { className: "ubtn", style: { marginTop: 10 }, disabled: !txt.trim(), onClick: revisar }, "Revisar"),
    res != null && h("div", { style: { marginTop: 10, fontSize: 14.5, lineHeight: 1.5 } },
      h("div", { style: { fontWeight: 700, color: res ? green : "#E2884A" } }, res ? "✓ Bien" : "Casi: revisalo"),
      h("div", { lang: "ru", style: { display: "flex", alignItems: "center", gap: 10, marginTop: 4 } }, h("b", { style: { flex: 1 } }, ok), h("button", { className: "play", onClick: () => azHablarRu(ok), "aria-label": "Escuchar" }, "▶")),
      h("div", { style: { color: c.textMuted, fontSize: 13, marginTop: 4 } }, azFmt(u7ReglaHora(n)))),
    h("button", { className: "ubtn sec", style: { marginTop: 12 }, onClick: otra }, "Otra hora"));
}

/* Agenda de Ana (módulo 9) */
function AgendaAna({ c }) {
  return h("div", { className: "u-card", style: { padding: "6px 16px", marginTop: 14 } }, D7.dias.map((d, j) => {
    const [vk, extra, es] = U7_SEMANA[j], v = D7.verb[D7.sin(vk)], ru = cap7(d.pr) + " " + d.acc + " А́нна " + v.f[2] + (extra ? " " + extra : "") + ".";
    return h("div", { key: d.id, style: { display: "flex", alignItems: "center", gap: 10, padding: "9px 0", borderTop: j ? `1px solid ${c.border}` : "none" } },
      h("div", { lang: "ru", style: { width: 104, flexShrink: 0, fontWeight: 800, color: c.gold, fontSize: 14 } }, d.nom),
      h("div", { style: { flex: 1, minWidth: 0 } }, h("div", { lang: "ru", style: { fontSize: 14.5, fontWeight: 600 } }, ru), h("div", { style: { fontSize: 12, color: c.textMuted } }, es)),
      h("button", { className: "play", onClick: () => azHablarRu(ru), "aria-label": "Escuchar" }, "▶"));
  }));
}

/* Agenda del proyecto: un renglón por día, guardado en el teléfono */
function AgendaPropia({ c }) {
  const [ag, setAg] = useState({});
  useEffect(() => { (async () => setAg(await azGet("az_u7_agenda", {})))(); }, []);
  const cambiar = (id, v) => { const x = Object.assign({}, ag, { [id]: v }); setAg(x); azSet("az_u7_agenda", x); };
  return h("div", { className: "u-card", style: { padding: "8px 16px", marginTop: 14 } },
    h("div", { className: "u-text", style: { fontSize: 13, margin: "6px 0 8px" } }, "Escribí en ruso qué hacés cada día (una palabra o una frase corta)."),
    D7.dias.map((d, j) => h("div", { key: d.id, style: { display: "flex", alignItems: "center", gap: 10, padding: "6px 0", borderTop: j ? `1px solid ${c.border}` : "none" } },
      h("div", { lang: "ru", style: { width: 104, flexShrink: 0, fontWeight: 800, color: c.gold, fontSize: 14 } }, d.nom),
      h("input", { lang: "ru", value: ag[d.id] || "", placeholder: "…", onInput: e => cambiar(d.id, e.target.value), autocapitalize: "off", autocorrect: "off", spellcheck: false, autocomplete: "off",
        style: { flex: 1, minWidth: 0, boxSizing: "border-box", background: c.bg3, border: `1px solid ${c.border}`, borderRadius: 9, padding: "9px 10px", color: c.text, fontSize: 16, fontFamily: "inherit" } }))));
}

/* El día en emoji (módulo 6): una tarjeta por actividad, con la hora */
function DiaEmoji({ c }) {
  return h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 10 } }, Object.keys(U7_ACT).map(k => {
    const a = U7_ACT[k], v = D7.verb[D7.sin(a[0])]; if (!v) return null;
    const ru = v.f[0] + (a[1] ? " " + a[1] : "");
    return h("button", { key: k, onClick: () => azHablarRu("Я " + ru + " " + u7Ru(a[4], a[5])), style: { textAlign: "left", padding: "10px", borderRadius: 12, background: c.bg2, border: `1px solid ${c.border}`, color: c.text, fontFamily: "inherit", cursor: "pointer" } },
      h("div", { style: { fontSize: 22 } }, a[3] + " " + u7Reloj(a[4])),
      h("div", { lang: "ru", style: { fontSize: 14.5, fontWeight: 700, marginTop: 4 } }, ru),
      h("div", { style: { fontSize: 11.5, color: c.textMuted } }, a[2][0]));
  }));
}

function Lectura({ L, c }) {
  const [es, setEs] = useState(false);
  const idx = azIndiceFormas();
  const lexDe = ru => (ru.match(/[А-Яа-яЁё\u0301]+/g) || []).map(w => { const r = idx.get(azFormaClave(w)); return r && r[0] ? r[0][0] : null; });
  return h("div", { className: "u-card", style: { padding: "14px 16px", marginTop: 12 } },
    h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
      h("div", { lang: "ru", style: { flex: 1, fontSize: 18, fontWeight: 800, color: c.gold } }, L.titulo),
      h("button", { className: "play", onClick: () => azHablarSecuencia(L.lineas.map(l => ({ texto: l[0] }))), "aria-label": "Escuchar el texto" }, "▶"),
      h("button", { className: "play", onClick: azCallar, "aria-label": "Detener el audio" }, "■")),
    L.lineas.map((l, k) => h("div", { key: k, style: { marginTop: 8, fontSize: 16.5, lineHeight: 1.5 } },
      h(AzTexto, { ru: l[0], lex: lexDe(l[0]), objetivo: OBJETIVO_U7 }),
      es && h("div", { style: { fontSize: 13, color: c.textMuted } }, l[1]))),
    h("button", { className: "ubtn sec", style: { marginTop: 12 }, onClick: () => setEs(!es) }, es ? "Ocultar la traducción" : "Ver la traducción"));
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [modId, setModId] = useState(() => new URLSearchParams(location.search).get("m"));
  const [tarjetas, setTarjetas] = useState(null);
  const [practica, setPractica] = useState(null);
  const [visto, setVisto] = useState(1);
  const [examen, setExamen] = useState(null);
  const [, refrescar] = useState(0);

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      setVisto(await azGet('az_u7_visto', 1));
      await azLoadProgress();
      azSaveUnitProgress(7, {});
      refrescar(x => x + 1);
    })();
    const pop = () => { setModId(new URLSearchParams(location.search).get("m")); setTarjetas(null); setPractica(null); };
    window.addEventListener("popstate", pop);
    return () => window.removeEventListener("popstate", pop);
  }, []);
  useEffect(() => {
    const m = modId ? unidad7Modulo(modId) : null;
    window.azFuenteActual = () => m ? "Unidad 7 · " + m.titulo : "Unidad 7";
    if (m && m.n > visto) { setVisto(m.n); azSet('az_u7_visto', m.n); }
    if (m) azGuardarUltimo({ unidad: 7, n: m.n, total: U.modulos.length, titulo: "Unidad 7 · " + m.titulo, href: "azbuka-7.html?m=" + m.id });
  }, [modId]);
  useEffect(() => { if (!practica && AZ_PROGRESS.units) setExamen((AZ_PROGRESS.units["7"] || {}).examen || null); }, [practica]);

  const abrirModulo = id => { history.pushState(null, "", id ? "?m=" + id : location.pathname); setModId(id); window.scrollTo(0, 0); };
  const practicarUnidad = () => setPractica({ titulo: "Unidad 7", pool: EJ_U7_BASE.filter(e => e.modulo <= Math.max(visto, 1)) });
  const practicarModulo = m => setPractica({ titulo: m.titulo, n: m.nPractica, pool: EJ_U7_BASE.filter(e => e.modulo === m.n) });
  const practicarAmpliacion = () => setPractica({ titulo: "Ampliación: ра́но y по́здно", pool: EJ_U7.filter(e => e.ampliacion) });
  const rendirExamen = m => setPractica({ titulo: "Evaluación de la Unidad 7", pool: EJ_U7_BASE, examen: { intro: m.intro, partes: m.partes, aprobado: m.aprobado } });
  const reforzar = parte => setPractica({ titulo: "Reforzar: " + parte.nombre, pool: EJ_U7_BASE.filter(e => parte.tipos.indexOf(e.tipo) >= 0) });

  const c = azColors(darkMode);
  const green = darkMode ? "#4CAF82" : "#2E7D55";
  const mod = modId ? unidad7Modulo(modId) : null;
  const idx = mod ? U.modulos.indexOf(mod) : -1;
  const prev = mod && U.modulos[idx - 1], next = mod && U.modulos[idx + 1];
  const palabrasDom = OBJETIVO_U7.filter(id => azItem("lex:" + id).level === 2).length;
  const tabs = mod ? [
    { id: "u", icon: "⊞", aria: "Unidad", action: () => abrirModulo(null) },
    { id: "p", icon: "‹", aria: "Módulo anterior", disabled: !prev, action: () => prev && abrirModulo(prev.id) },
    { id: "m", texto: "Módulo " + mod.n },
    { id: "s", icon: "›", aria: "Módulo siguiente", disabled: !next, action: () => next && abrirModulo(next.id) }
  ] : azTabsUnidad(7);

  const portada = h(AzPortadaUnidad, { u: U, c, green, visto: Math.max(visto, 1), examen, onPracticar: practicarUnidad, onAbrir: abrirModulo,
    progreso: [{ label: "Palabras dominadas", valor: palabrasDom, total: OBJETIVO_U7.length }] });

  let vista = null;
  if (mod) {
    const ampIds = U7_AMPLIACION_RU.split(" ").map(ru => (LEXICON_COMER.find(e => e.acento === ru) || {}).id).filter(Boolean);
    vista = h("div", { key: mod.id, style: { animation: "fadeIn 0.3s ease", paddingTop: 18 } },
      h("div", { className: "u-kicker" }, "Unidad 7 · Módulo " + mod.n),
      h("h1", { className: "u-title" }, mod.titulo),
      h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(mod.intro)),
      mod.tipo === "leccion" && h(React.Fragment, null,
        h(AzSecciones, { secciones: mod.secciones }),
        mod.n === 1 && h(React.Fragment, null,
          h("div", { className: "u-sec" }, "Las horas"),
          h(AzTablaGrupos, { encabezados: ["De 1 a 6", "De 7 a 12"], c, filas: [...Array(6)].map((_, k) => [k + 1, k + 7].map(n => ({ ru: cap7(D7.hora(n)), es: u7Reloj(n) + " " + (n < 10 ? "0" : "") + n + ":00" }))) }),
          h("div", { className: "u-sec" }, "Practicá con el reloj"), h(ActividadReloj, { c, green })),
        mod.n === 3 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Los días"),
          h(AzTablaGrupos, { encabezados: ["Día", "¿Cuándo?"], c, filas: D7.dias.map(d => [{ id: d.id, ru: d.nom, es: d.es }, { id: d.id, ru: d.pr + " " + d.acc, es: "el " + d.es }]) })),
        mod.n === 4 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Los meses"),
          h(AzTablaGrupos, { encabezados: ["Mes", "¿En qué mes?"], c, filas: D7.meses.map(m => [{ id: m.id, ru: m.nom, es: m.es }, { id: m.id, ru: "в " + m.prep, es: "en " + m.es }]) })),
        mod.n === 6 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Un día, de la mañana a la noche"), h(DiaEmoji, { c })),
        mod.n === 9 && h(React.Fragment, null, h("div", { className: "u-sec" }, "La agenda de Ana"), h(AgendaAna, { c })),
        h("button", { className: "ubtn", style: { marginTop: 22 }, onClick: () => practicarModulo(mod) }, "Practicar este módulo"),
        mod.n === 6 && ampIds.length > 0 && h("div", { style: { marginTop: 28, paddingTop: 6, borderTop: `1px solid ${c.border}` } },
          h("div", { className: "u-sec" }, "Ampliación · opcional"),
          h("p", { className: "u-text", style: { fontSize: 14.5 } }, "Dos palabras más para contar tu rutina, para quien quiera sumar vocabulario. Es opcional: no entra en la práctica de la unidad ni en la evaluación."),
          h(AzVocabulario, { ids: ampIds, c }),
          h("button", { className: "ubtn sec", style: { marginTop: 10 }, onClick: practicarAmpliacion }, "Practicar la ampliación"))),
      mod.tipo === "lectura" && h(React.Fragment, null,
        U7_LECTURAS.map(L => h(Lectura, { key: L.id, L, c })),
        h("button", { className: "ubtn", style: { marginTop: 18 }, onClick: () => practicarModulo(mod) }, "Practicar «Un día completo»")),
      mod.tipo === "proyecto" && h(React.Fragment, null,
        h("div", { className: "u-sec" }, "1. Tu agenda"), h(AgendaPropia, { c }),
        h("div", { className: "u-sec" }, "2. Tu semana, en un texto"),
        h(AzProyecto, { mod, c, green, clave: "az_u7_proyecto", fuente: { titulo: "Unidad 7 · Моя неде́ля", href: "azbuka-7.html?m=u7m11" }, aviso: AVISO_ACENTOS })),
      mod.tipo === "examen" && h(React.Fragment, null,
        h("div", { className: "u-card", style: { padding: "6px 16px", marginTop: 16 } }, mod.partes.map((p, k) =>
          h("div", { key: p.nombre, style: { display: "flex", justifyContent: "space-between", padding: "10px 0", borderTop: k ? `1px solid ${c.border}` : "none", fontSize: 14.5 } },
            h("span", { style: { fontWeight: 600 } }, p.nombre), h("span", { style: { color: c.textMuted } }, p.n + " ejercicios")))),
        examen && h("div", { style: { marginTop: 14, fontSize: 14, color: examen.aprobado ? green : "#E2884A", fontWeight: 700 } },
          "Última vez: " + examen.pct + " % (" + examen.fecha.split("-").reverse().join("/") + ")" + (examen.aprobado ? " · aprobada" : "")),
        h("button", { className: "ubtn", onClick: () => rendirExamen(mod) }, examen ? "Rendir de nuevo" : "Empezar la evaluación")),
      next && h("button", { className: "ubtn sec", style: { marginTop: 22 }, onClick: () => abrirModulo(next.id) }, "Siguiente: " + next.titulo));
  }

  return h(React.Fragment, null,
    h(AzEstilosUnidad, { c, green }),
    h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs }, mod ? vista : portada),
    practica && h(AzPractica, { key: practica.titulo + (practica.pool[0] || {}).id, unidad: 7, titulo: practica.titulo, pool: practica.pool, mezcla: U7_MEZCLA,
      n: azNPractica(practica.pool, practica.n), dark: darkMode, aviso: AVISO_ACENTOS, examen: practica.examen, onReforzar: reforzar, objetivo: OBJETIVO_U7,
      onSalir: () => { setPractica(null); refrescar(x => x + 1); } }),
    tarjetas && h(AzTarjetasPalabras, { ids: tarjetas.ids, titulo: tarjetas.titulo, c, green, detalle: detalleTarjeta, onClose: () => { setTarjetas(null); refrescar(x => x + 1); } }),
    h(AzBurbujaHost, { dark: darkMode }));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
