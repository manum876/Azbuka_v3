<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Азбука — Unidad 10: Casos II · genitivo, dativo e instrumental</title>
<meta name="apple-mobile-web-app-title" content="Азбука">
<meta name="theme-color" content="#0F0F14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/core.css">
</head>
<body>
<div id="root"></div>
<script src="assets/preact.js"></script>
<script src="data/data-lexicon.js"></script>
<script src="data/data-casos.js"></script>
<script src="data/data-verbos.js"></script>
<script src="data/data-frases.js"></script>
<script src="data/data-dialogos.js"></script>
<script src="data/data-unidad-10.js"></script>
<script src="js/core.js"></script>
<script src="js/progress.js"></script>
<script src="js/shell.js"></script>
<script src="js/corrector.js"></script>
<script src="js/burbuja.js"></script>
<script src="js/unidad-ui.js"></script>
<script src="js/unidad.js"></script>
<script>
/* ============================================================
   AZBUKA-10.HTML — Unidad 10: Casos II (genitivo, dativo, instrumental)
   ------------------------------------------------------------
   05/10/2026. Piezas de unidad-ui.js y unidad.js. Propio de esta
   unidad: tablas «palabra → caso» en cada módulo (formas de Casos),
   pronombres, tarjetas de verbos con dativo, ampliación (со мной…),
   lecturas (módulo 11) y el proyecto «Моя жизнь».
   URL: azbuka-10.html · azbuka-10.html?m=u10m2
   ============================================================ */
const { useState, useEffect } = htmPreact;
const h = React.createElement;
const U = UNIDAD_10;
const EJ_U10 = ejerciciosUnidad10();
const EJ_U10_BASE = EJ_U10.filter(e => !e.ampliacion);
const D10 = u10Datos();
const OBJETIVO_U10 = LEXICON_COMER.filter(e => (e.introducedIn || []).indexOf(10) >= 0 || (e.appearsIn || []).indexOf(10) >= 0).map(e => e.id);
const AVISO_ACENTOS = "En Azbuka, los acentos (´) son solo una ayuda para leer: en ruso no se escriben, así que no hace falta que los pongas. La е vale por ё.";
const PERS6 = ["я", "ты", "он / она́", "мы", "вы", "они́"];
const cap10 = t => t.charAt(0).toUpperCase() + t.slice(1);

function detalleTarjeta(e) {
  const cz = casosById(e.id);
  if (cz && cz.sg) return "gen. " + cz.sg[1] + " · dat. " + cz.sg[2] + " · instr. " + cz.sg[4];
  const v = verboById(e.id);
  return v && v.presente ? PERS6.map((p, i) => p + " " + v.presente[i]).join(" · ") : null;
}

/* Tarjetas: verbo con seis formas (2 × 3) */
function TablaSeis({ c, lista }) {
  const forma = (pr, f) => h("button", { key: pr, onClick: () => azHablarRu(f), lang: "ru",
    style: { textAlign: "left", padding: "7px 10px", borderRadius: 9, background: c.bg2, border: `1px solid ${c.border}`, color: c.text, fontFamily: "inherit", cursor: "pointer", minWidth: 0 } },
    h("div", { style: { fontSize: 10.5, fontWeight: 700, letterSpacing: .5, color: c.textMuted } }, pr), h("div", { style: { fontSize: 15.5, fontWeight: 700 } }, f));
  return h(React.Fragment, null,
    h("div", { className: "u-text", style: { fontSize: 13, marginTop: 8 } }, "Tocá una forma para escuchar cómo suena."),
    lista.filter(Boolean).map(v => h("div", { key: v.titulo, className: "u-card", style: { padding: "12px 14px", marginTop: 10 } },
      h("div", { style: { display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" } },
        h("span", { lang: "ru", style: { fontSize: 18, fontWeight: 800, color: c.gold } }, v.titulo),
        h("span", { style: { fontSize: 13, color: c.textMuted } }, v.es)),
      h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginTop: 8 } },
        forma("я", v.f[0]), forma("мы", v.f[3]), forma("ты", v.f[1]), forma("вы", v.f[4]), forma("он / она́", v.f[2]), forma("они́", v.f[5])))));
}

function Lectura({ L, c }) {
  const [es, setEs] = useState(false);
  const idx = azIndiceFormas();
  const lexDe = ru => (ru.match(/[А-Яа-яЁё\u0301]+/g) || []).map(w => { const r = idx.get(azFormaClave(w)); return r && r[0] ? r[0][0] : null; });
  return h("div", { className: "u-card", style: { padding: "14px 16px", marginTop: 12 } },
    h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
      h("div", { lang: "ru", style: { flex: 1, fontSize: 18, fontWeight: 800, color: c.gold } }, L.titulo),
      h("button", { className: "play", onClick: () => azHablarSecuencia(L.lineas.map(l => ({ texto: l[0] }))), "aria-label": "Escuchar el texto" }, "▶"),
      h("button", { className: "play", onClick: azCallar, "aria-label": "Detener el audio" }, "■")),
    L.lineas.map((l, k) => h("div", { key: k, style: { marginTop: 8, fontSize: 16.5, lineHeight: 1.5 } },
      h(AzTexto, { ru: l[0], lex: lexDe(l[0]), objetivo: OBJETIVO_U10 }),
      es && h("div", { style: { fontSize: 13, color: c.textMuted } }, l[1]))),
    h("button", { className: "ubtn sec", style: { marginTop: 12 }, onClick: () => setEs(!es) }, es ? "Ocultar la traducción" : "Ver la traducción"));
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [modId, setModId] = useState(() => new URLSearchParams(location.search).get("m"));
  const [tarjetas, setTarjetas] = useState(null);
  const [practica, setPractica] = useState(null);
  const [visto, setVisto] = useState(1);
  const [examen, setExamen] = useState(null);
  const [, refrescar] = useState(0);

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      setVisto(await azGet('az_u10_visto', 1));
      await azLoadProgress();
      azSaveUnitProgress(10, {});
      refrescar(x => x + 1);
    })();
    const pop = () => { setModId(new URLSearchParams(location.search).get("m")); setTarjetas(null); setPractica(null); };
    window.addEventListener("popstate", pop);
    return () => window.removeEventListener("popstate", pop);
  }, []);
  useEffect(() => {
    const m = modId ? unidad10Modulo(modId) : null;
    window.azFuenteActual = () => m ? "Unidad 10 · " + m.titulo : "Unidad 10";
    if (m && m.n > visto) { setVisto(m.n); azSet('az_u10_visto', m.n); }
    if (m) azGuardarUltimo({ unidad: 10, n: m.n, total: U.modulos.length, titulo: "Unidad 10 · " + m.titulo, href: "azbuka-10.html?m=" + m.id });
  }, [modId]);
  useEffect(() => { if (!practica && AZ_PROGRESS.units) setExamen((AZ_PROGRESS.units["10"] || {}).examen || null); }, [practica]);

  const abrirModulo = id => { history.pushState(null, "", id ? "?m=" + id : location.pathname); setModId(id); window.scrollTo(0, 0); };
  const practicarUnidad = () => setPractica({ titulo: "Unidad 10", pool: EJ_U10_BASE.filter(e => e.modulo <= Math.max(visto, 1)) });
  const practicarModulo = m => setPractica({ titulo: m.titulo, n: m.nPractica, pool: EJ_U10_BASE.filter(e => e.modulo === m.n) });
  const practicarAmpliacion = () => setPractica({ titulo: "Ampliación: со мной, с тобо́й…", pool: EJ_U10.filter(e => e.ampliacion) });
  const rendirExamen = m => setPractica({ titulo: "Evaluación de la Unidad 10", pool: EJ_U10_BASE, examen: { intro: m.intro, partes: m.partes, aprobado: m.aprobado } });
  const reforzar = parte => setPractica({ titulo: "Reforzar: " + parte.nombre, pool: EJ_U10_BASE.filter(e => parte.tipos.indexOf(e.tipo) >= 0) });

  const c = azColors(darkMode);
  const green = darkMode ? "#4CAF82" : "#2E7D55";
  const mod = modId ? unidad10Modulo(modId) : null;
  const idx = mod ? U.modulos.indexOf(mod) : -1;
  const prev = mod && U.modulos[idx - 1], next = mod && U.modulos[idx + 1];
  const palabrasDom = OBJETIVO_U10.filter(id => azItem("lex:" + id).level === 2).length;
  const tabs = mod ? [
    { id: "u", icon: "⊞", aria: "Unidad", action: () => abrirModulo(null) },
    { id: "p", icon: "‹", aria: "Módulo anterior", disabled: !prev, action: () => prev && abrirModulo(prev.id) },
    { id: "m", texto: "Módulo " + mod.n },
    { id: "s", icon: "›", aria: "Módulo siguiente", disabled: !next, action: () => next && abrirModulo(next.id) }
  ] : azTabsUnidad(10);

  const portada = h(AzPortadaUnidad, { u: U, c, green, visto: Math.max(visto, 1), examen, onPracticar: practicarUnidad, onAbrir: abrirModulo,
    progreso: [{ label: "Palabras dominadas", valor: palabrasDom, total: OBJETIVO_U10.length }] });

  let vista = null;
  if (mod) {
    const ids = l => l.map(ru => (LEXICON_COMER.find(e => e.acento === ru) || {}).id).filter(Boolean);
    const S = l => l.map(ru => D10.sust(ru)).filter(Boolean);
    /* Tabla «palabra → caso» con las formas de Casos */
    const tablaCaso = (lista, caso, enc, pre) => h(AzTablaGrupos, { encabezados: ["Palabra", enc], c,
      filas: S(lista).map(s => [{ id: s.id, ru: s.nom, es: "" }, { id: s.id, ru: (pre || "") + s[caso], es: "" }]) });
    const tablaPron = (lista, enc) => h(AzTablaGrupos, { encabezados: ["Pronombre", enc], c,
      filas: ["я", "ты", "он", "она́", "мы", "вы", "они́"].map((p, i) => [{ ru: p, es: U10_PRON.es[i] }, { ru: lista[i], es: "" }]) });
    const PERS = ["ма́ма", "па́па", "брат", "сестра́", "А́нна", "Ива́н", "друг", "учи́тель"];
    const anna = D10.sust("А́нна");
    vista = h("div", { key: mod.id, style: { animation: "fadeIn 0.3s ease", paddingTop: 18 } },
      h("div", { className: "u-kicker" }, "Unidad 10 · Módulo " + mod.n),
      h("h1", { className: "u-title" }, mod.titulo),
      h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(mod.intro)),
      mod.tipo === "leccion" && h(React.Fragment, null,
        h(AzSecciones, { secciones: mod.secciones }),
        mod.n === 1 && anna && h(React.Fragment, null, h("div", { className: "u-sec" }, "А́нна en los seis casos"),
          h(AzTablaGrupos, { encabezados: ["Caso", "Forma"], c, filas: [["nom", "Nominativo: hace"], ["acc", "Acusativo: recibe"], ["prep", "Prepositivo: dónde / de qué"], ["gen", "Genitivo: tiene, de quién"], ["dat", "Dativo: a quién"], ["ins", "Instrumental: con quién"]]
            .map(([k, es]) => [{ ru: { nom: "кто?", acc: "кого́?", prep: "о ком?", gen: "у кого́?", dat: "кому́?", ins: "с кем?" }[k], es }, { id: anna.id, ru: anna[k], es: "" }]) })),
        mod.n === 2 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Tener"), tablaPron(U10_PRON.gen.map(x => x + " есть"), "Tiene"),
          h("div", { className: "u-sec" }, "Genitivo"), tablaCaso(PERS.concat(["кни́га", "маши́на", "молоко́"]), "gen", "Genitivo")),
        mod.n === 3 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Lo que no hay"), tablaCaso(["маши́на", "кни́га", "телефо́н", "компью́тер", "соба́ка", "рабо́та", "вре́мя"], "gen", "No hay", "нет ")),
        mod.n === 4 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Cantidad"), tablaCaso(Object.keys(U10_CANT), "gen", "Mucho", "мно́го ")),
        mod.n === 5 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Con preposiciones"),
          h(AzTablaGrupos, { encabezados: ["Preposición", "Ejemplo"], c, filas: U10_PREP.filter((x, k) => k % 2 === 0).map(([pr, ru, es]) => { const s = D10.sust(ru); return [{ ru: pr, es: "" }, { id: s && s.id, ru: pr + " " + (s ? s.gen : ru), es }]; }) })),
        mod.n === 6 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Dativo"), tablaCaso(PERS, "dat", "¿A quién?"),
          h("div", { className: "u-sec" }, "Los verbos"), h(TablaSeis, { c, lista: ["дава́ть", "звони́ть", "помога́ть"].map(ru => { const v = D10.verbo(ru); return v && { titulo: v.ac, es: { "дава́ть": "dar", "звони́ть": "llamar", "помога́ть": "ayudar" }[ru], f: v.presente }; }) })),
        mod.n === 7 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Los pronombres en dativo"), tablaPron(U10_PRON.dat, "A…")),
        mod.n === 8 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Instrumental"), tablaCaso(PERS, "ins", "¿Con quién?", "с ")),
        mod.n === 9 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Con qué"), tablaCaso(["ру́чка", "каранда́ш", "ло́жка", "ви́лка", "нож"], "ins", "Con qué")),
        mod.n === 10 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Profesiones"), tablaCaso(Object.keys(U10_PROFES), "ins", "Trabajo de…", "рабо́таю ")),
        h("button", { className: "ubtn", style: { marginTop: 22 }, onClick: () => practicarModulo(mod) }, "Practicar este módulo"),
        mod.n === 8 && h("div", { style: { marginTop: 28, paddingTop: 6, borderTop: `1px solid ${c.border}` } },
          h("div", { className: "u-sec" }, "Ampliación · opcional"),
          h("p", { className: "u-text", style: { fontSize: 14.5 } }, "Los pronombres en instrumental, para quien quiera sumarlos. Es opcional: no entra en la práctica de la unidad ni en la evaluación."),
          tablaPron(U10_PRON.ins, "Con…"),
          h("button", { className: "ubtn sec", style: { marginTop: 10 }, onClick: practicarAmpliacion }, "Practicar la ampliación"))),
      mod.tipo === "lectura" && h(React.Fragment, null,
        U10_LECTURAS.map(L => h(Lectura, { key: L.id, L, c })),
        h("button", { className: "ubtn", style: { marginTop: 18 }, onClick: () => practicarModulo(mod) }, "Practicar «Los seis casos»")),
      mod.tipo === "proyecto" && h(AzProyecto, { mod, c, green, clave: "az_u10_proyecto", fuente: { titulo: "Unidad 10 · Моя жизнь", href: "azbuka-10.html?m=u10m12" }, aviso: AVISO_ACENTOS }),
      mod.tipo === "examen" && h(React.Fragment, null,
        h("div", { className: "u-card", style: { padding: "6px 16px", marginTop: 16 } }, mod.partes.map((p, k) =>
          h("div", { key: p.nombre, style: { display: "flex", justifyContent: "space-between", padding: "10px 0", borderTop: k ? `1px solid ${c.border}` : "none", fontSize: 14.5 } },
            h("span", { style: { fontWeight: 600 } }, p.nombre), h("span", { style: { color: c.textMuted } }, p.n + " ejercicios")))),
        examen && h("div", { style: { marginTop: 14, fontSize: 14, color: examen.aprobado ? green : "#E2884A", fontWeight: 700 } },
          "Última vez: " + examen.pct + " % (" + examen.fecha.split("-").reverse().join("/") + ")" + (examen.aprobado ? " · aprobada" : "")),
        h("button", { className: "ubtn", onClick: () => rendirExamen(mod) }, examen ? "Rendir de nuevo" : "Empezar la evaluación")),
      next && h("button", { className: "ubtn sec", style: { marginTop: 22 }, onClick: () => abrirModulo(next.id) }, "Siguiente: " + next.titulo));
  }

  return h(React.Fragment, null,
    h(AzEstilosUnidad, { c, green }),
    h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs }, mod ? vista : portada),
    practica && h(AzPractica, { key: practica.titulo + (practica.pool[0] || {}).id, unidad: 10, titulo: practica.titulo, pool: practica.pool, mezcla: U10_MEZCLA,
      n: azNPractica(practica.pool, practica.n), dark: darkMode, aviso: AVISO_ACENTOS, examen: practica.examen, onReforzar: reforzar, objetivo: OBJETIVO_U10,
      onSalir: () => { setPractica(null); refrescar(x => x + 1); } }),
    tarjetas && h(AzTarjetasPalabras, { ids: tarjetas.ids, titulo: tarjetas.titulo, c, green, detalle: detalleTarjeta, onClose: () => { setTarjetas(null); refrescar(x => x + 1); } }),
    h(AzBurbujaHost, { dark: darkMode }));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
