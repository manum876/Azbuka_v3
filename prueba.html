<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Азбука — Prueba de burbujas y corrector</title>
<link rel="stylesheet" href="core.css">
</head>
<body>
<div id="root"></div>
<script src="preact.js"></script>
<script src="data-lexicon.js"></script>
<script src="data-casos.js"></script>
<script src="data-verbos.js"></script>
<script src="data-frases.js"></script>
<script src="core.js"></script>
<script src="progress.js"></script>
<script src="shell.js"></script>
<script src="corrector.js"></script>
<script src="burbuja.js"></script>
<script>
/* ============================================================
   PRUEBA.HTML — Página TEMPORAL para probar en el teléfono la
   burbuja de palabras y frases (burbuja.js) y el corrector
   (corrector.js) antes de que exista el motor de unidades.
   No figura en el catálogo. Se borra cuando esté azbuka-1.html.
   ============================================================ */
const { useState, useEffect } = htmPreact;
const h = React.createElement;

const EJ = [
  { id: "P1", pide: "Traducí: «Leo un libro.»", esp: "(Я) чита́ю кни́гу.", idioma: "ru" },
  { id: "P2", pide: "Traducí: «Ella ama a su mamá.»", esp: ["Она́ лю́бит ма́му.", "Она́ лю́бит свою́ ма́му."], idioma: "ru" },
  { id: "P3", pide: "Traducí: «Estoy en el restaurante.»", esp: "Я в рестора́не.", idioma: "ru" },
  { id: "P4", pide: "Traducí: «Voy al restaurante.»", esp: "Я иду́ в рестора́н.", idioma: "ru" },
  { id: "P5", pide: "Traducí al español: «Я ви́жу бра́та.»", esp: ["Veo a (mi) hermano.", "(Yo) veo a (mi) hermano."], idioma: "es" },
];

function Ejercicio({ ej, c, dark }) {
  const [txt, setTxt] = useState("");
  const [r, setR] = useState(null);
  const comprobar = () => setR(azCorregir(txt, ej.esp, { idioma: ej.idioma }));
  return h("div", { style: { padding: "14px 0", borderTop: `1px solid ${c.border}` } },
    h("div", { style: { fontSize: 15, fontWeight: 700, color: c.text, marginBottom: 8 } }, ej.pide),
    h("div", { style: { display: "flex", gap: 8 } },
      h("input", {
        value: txt, lang: ej.idioma === "ru" ? "ru" : "es",
        autocapitalize: "off", autocorrect: "off", spellcheck: false, autocomplete: "off",
        placeholder: ej.idioma === "ru" ? "Escribí en ruso, sin acentos…" : "Escribí en español…",
        onInput: e => { setTxt(e.target.value); setR(null); },
        onKeyDown: e => { if (e.key === "Enter") comprobar(); },
        style: { flex: 1, minWidth: 0, fontSize: 16, padding: "11px 12px", borderRadius: 9, background: c.bg3, border: `1px solid ${c.border}`, color: c.text }
      }),
      h("button", {
        className: "btn", onClick: comprobar,
        style: { padding: "0 16px", borderRadius: 10, background: c.gold, color: c.bg, fontSize: 13.5, fontWeight: 700 }
      }, "Comprobar")),
    h(AzCorreccion, { r, dark }));
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  useEffect(() => { (async () => { setDarkMode((await azGet('az_theme', 'dark')) !== 'light'); })(); }, []);
  const c = azColors(darkMode);
  const card = { background: c.card, border: `1px solid ${c.border}`, borderRadius: 14, padding: "16px 18px", marginBottom: 16 };
  const lbl = { fontSize: 10.5, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", color: c.gold, marginBottom: 10 };
  const ru = { fontSize: 20, fontWeight: 700, color: c.text, lineHeight: 1.7 };

  return h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs: [] },
    h("div", { style: { animation: "fadeIn 0.3s ease", paddingTop: 18 } },
      h("h1", { style: { fontSize: 24, fontWeight: 800, color: c.text, marginBottom: 6 } }, "Prueba de burbujas y corrector"),
      h("p", { style: { fontSize: 13.5, color: c.textMuted, lineHeight: 1.6, marginBottom: 16 } },
        "Página temporal. Tocá las palabras subrayadas y equivocate a propósito en los ejercicios."),

      h("div", { style: card },
        h("div", { style: lbl }, "Palabras tocables"),
        h("div", { style: ru }, h(AzTexto, { ru: "Ма́ма чита́ет кни́гу.", lex: ["CMR-00309", "CMR-00332", "CMR-00230"] })),
        h("div", { style: ru }, h(AzTexto, { ru: "Я ви́жу бра́та и ма́му.", lex: ["CMR-00005", "CMR-00113", "CMR-00542", "CMR-00001", "CMR-00309"], objetivo: ["CMR-00113", "CMR-00542", "CMR-00309"] })),
        h("div", { style: { fontSize: 13, color: c.textMuted, margin: "6px 0 12px" } }, "En la segunda frase, я e и no se enlazan: son vocabulario incidental."),
        h("div", { style: lbl }, "Frases hechas"),
        h("div", { style: ru }, h(AzFrase, { id: "FRS-006" }), " — ", h(AzFrase, { id: "FRS-015" }))),

      h("div", { style: card },
        h("div", { style: lbl }, "Corrector"),
        h("div", { style: { fontSize: 13, color: c.textMuted, lineHeight: 1.5 } },
          "Los acentos (´) son solo una ayuda para leer: en ruso no se escriben, así que no hace falta que los pongas. Tampoco importa si ponés е en lugar de ё. Probá errores como книга, ресторана o читает."),
        EJ.map(ej => h(Ejercicio, { key: ej.id, ej, c, dark: darkMode })))),
    h(AzBurbujaHost, { dark: darkMode }));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
