/* ============================================================
   AZBUKA-1.HTML — Unidad 1: Alfabeto y pronunciación
   ------------------------------------------------------------
   Pasos 1 y 2 (25/09/2026): portada, introducción, los seis
   grupos de letras con ficha y tarjetas, pronunciación (pares
   mínimos, reducción, ensordecimiento) y primeras lecturas
   (leer en voz alta y cuatro diálogos de data-dialogos.js). Contenido en data-unidad-1.js; letras en
   data-alphabet.js; palabras en el léxico. El dominio de cada
   letra es el mismo que usa Alfabeto (alfabeto:А).
   URL: azbuka-1.html (portada) · azbuka-1.html?m=u1m3 (módulo)
   ============================================================ */
const { useState, useEffect } = htmPreact;
const h = React.createElement;
const U = UNIDAD_1;
const LETRA = Object.fromEntries(ALPHABET.map(l => [l.upper, l]));
const YELLOW = "#C9B369";
/* Vocabulario objetivo de la unidad: lo que en el léxico tiene introducedIn 1.
   Solo esas palabras se enlazan en los diálogos (el resto es incidental). */
const EJ_U1 = ejerciciosUnidad1();
const AVISO_ACENTOS = "En Azbuka, los acentos (´) son solo una ayuda para leer: en ruso no se escriben, así que no hace falta que los pongas.";
const OBJETIVO_U1 = LEXICON_COMER.filter(e => (e.introducedIn || []).indexOf(1) >= 0).map(e => e.id);

function hablar(t) { azHablarRu(t); }
function sonidoLetra(l) { hablar(l.upper === "Ь" || l.upper === "Ъ" ? l.name : l.lower); }

/* Palabra con la letra resaltada; toda la palabra abre su burbuja */
function PalabraLetra({ w, letra, c, size }) {
  const e = lexComerById(w.lexId);
  const acento = e ? (e.acento || e.ru) : w.cyrillic;
  const partes = acento.match(/.\u0301?/gu) || [];
  const abrir = ev => { ev.stopPropagation(); azAbrirBurbuja("palabra", { id: w.lexId, forma: acento }, ev.currentTarget); };
  return h("span", { className: "az-link", role: "button", tabIndex: 0, lang: "ru", onClick: abrir,
    onKeyDown: ev => { if (ev.key === "Enter") abrir(ev); }, style: { fontSize: size || 17, fontWeight: 700 } },
    partes.map((p, i) => (p[0] === letra.upper || p[0] === letra.lower)
      ? h("span", { key: i, style: { color: c.gold, fontWeight: 800 } }, p) : p));
}

/* ── Ficha de una letra (hoja a pantalla completa) ── */
function HojaLetra({ l, c, nivel, setNivel, onClose, green }) {
  const cols = { 0: "#E2884A", 1: YELLOW, 2: green };
  return h("div", { className: "sheet", role: "dialog" },
    h("button", { className: "sheet-x", onClick: onClose, "aria-label": "Cerrar" }, "✕"),
    h("div", { className: "sheet-in" },
      h("div", { className: "u-kicker" }, "Letra"),
      h("div", { style: { display: "flex", gap: 20, alignItems: "center", paddingRight: 48 } },
        h("div", { style: { textAlign: "center" } },
          h("div", { className: "glyph", lang: "ru" }, l.upper + " " + l.lower),
          h("div", { className: "cursiva", lang: "ru" }, l.upper + "\u2009" + l.lower)),
        h("div", { style: { flex: 1, minWidth: 0 } },
          h("div", { style: { fontSize: 20, fontWeight: 800, color: c.text }, lang: "ru" }, l.name),
          h("div", { style: { fontSize: 14, color: c.textSub, marginTop: 4 } }, "Suena: /" + l.translit + "/"),
          h("div", { style: { display: "flex", gap: 8, marginTop: 10, alignItems: "center" } },
            h("button", { className: "play", onClick: () => sonidoLetra(l), "aria-label": "Escuchar" }, "▶"),
            h("a", { href: "alfabeto.html?mano=" + encodeURIComponent(l.upper), onClick: e => azNavigate(e, "alfabeto.html?mano=" + encodeURIComponent(l.upper)),
              style: { fontSize: 13, fontWeight: 700, color: c.gold, textDecoration: "none", padding: "8px 10px", border: `1px solid ${c.gold}66`, borderRadius: 10 } }, "✍️ Escribirla a mano")))),
      h("div", { className: "u-text", style: { marginTop: 14 } }, azFmt(l.pronunciation)),
      h("div", { className: "status-row" },
        [0, 1, 2].map(v => {
          const on = nivel === v;
          return h("button", { key: v, className: "status-btn", onClick: () => setNivel(l, v),
            style: { background: on ? cols[v] + "22" : c.bg3, border: `1px solid ${on ? cols[v] : c.border}`, color: on ? cols[v] : c.textMuted } },
            v === 0 ? "No estudiada" : v === 1 ? "Aprendiendo" : "Dominada");
        })),
      h("div", { className: "u-card info" },
        h("div", { className: "info-t" }, "Cómo suena"),
        h("div", { className: "info-x" }, azFmt(l.details.description + " " + l.details.similar))),
      h("div", { className: "u-card info" },
        h("div", { className: "info-t" }, "Errores comunes"),
        h("div", { className: "info-x" }, azFmt(l.details.mistakes))),
      h("div", { className: "u-card info" },
        h("div", { className: "info-t" }, "Consejo"),
        h("div", { className: "info-x" }, azFmt(l.details.tips + (l.details.similar_letters ? " " + l.details.similar_letters : "")))),
      h("div", { className: "u-sec" }, "Palabras para practicar"),
      h("div", { className: "u-card", style: { padding: "4px 16px" } },
        l.words.map((w, i) => {
          const e = lexComerById(w.lexId);
          return h("div", { key: i, className: "wrow" },
            h("div", { style: { flex: 1, minWidth: 0 } },
              h(PalabraLetra, { w, letra: l, c }),
              h("div", { style: { fontSize: 12.5, color: c.textSub, fontStyle: "italic", marginTop: 2 } }, w.translit),
              h("div", { style: { fontSize: 14, color: c.text, marginTop: 3 } }, w.meaning),
              w.note && h("div", { style: { fontSize: 12, color: c.textMuted, marginTop: 3, lineHeight: 1.4 } }, azFmt(w.note))),
            h("button", { className: "play", onClick: () => hablar(e ? e.ru : w.cyrillic), "aria-label": "Escuchar" }, "▶"));
        }))));
}

/* Palabra de ejemplo sin repetir: cada letra tiene su «bolsa» con sus
   palabras mezcladas; se sacan de a una y, cuando se vacía, se vuelve a
   mezclar sin empezar por la última que se vio. */
const BOLSAS = {};
function palabraSiguiente(l) {
  const b = BOLSAS[l.upper] || (BOLSAS[l.upper] = { resto: [], ult: -1 });
  if (!b.resto.length) {
    b.resto = l.words.map((_, k) => k).sort(() => Math.random() - .5);
    if (b.resto.length > 1 && b.resto[b.resto.length - 1] === b.ult) b.resto.unshift(b.resto.pop());
  }
  b.ult = b.resto.pop();
  return b.ult;
}

/* ── Tarjetas ── */
function Tarjetas({ letras, titulo, c, niveles, setNivel, onClose, green, cursiva }) {
  const [orden, setOrden] = useState(letras);
  const [i, setI] = useState(0);
  const [vuelta, setVuelta] = useState(false);
  const [wi, setWi] = useState(() => palabraSiguiente(LETRA[letras[0]]));
  const l = LETRA[orden[i]];
  const ir = d => { const ni = (i + d + orden.length) % orden.length; setVuelta(false); setI(ni); setWi(palabraSiguiente(LETRA[orden[ni]])); };
  const mezclar = () => { const o = orden.slice().sort(() => Math.random() - .5); setOrden(o); setI(0); setVuelta(false); setWi(palabraSiguiente(LETRA[o[0]])); };
  const marcar = v => { setNivel(l, v); ir(1); };
  useEffect(() => {
    const k = e => { if (e.key === "ArrowRight") ir(1); else if (e.key === "ArrowLeft") ir(-1); else if (e.key === " ") { e.preventDefault(); setVuelta(v => !v); } else if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, [orden, i]);
  const nv = niveles[l.upper] || 0;
  const w = l.words[wi] || l.words[0];   /* una palabra distinta cada vez */
  return h("div", { className: "sheet", role: "dialog" },
    h("button", { className: "sheet-x", onClick: onClose, "aria-label": "Cerrar" }, "✕"),
    h("div", { className: "sheet-in" },
      h("div", { className: "u-kicker" }, "Tarjetas · " + titulo),
      h("div", { style: { fontSize: 14, color: c.textMuted, marginBottom: 14 } },
        (i + 1) + " de " + orden.length + (nv ? " · " + (nv === 2 ? "dominada" : "aprendiendo") : "")),
      h("div", { className: "fc" + (vuelta ? " dorso" : ""), onClick: () => { if (!vuelta && !(niveles[l.upper] > 0)) setNivel(l, 1, true); setVuelta(v => !v); }, role: "button", tabIndex: 0, "aria-label": "Dar vuelta la tarjeta" },
        !vuelta
          ? h(React.Fragment, null,
              h("div", { className: "fc-glyph", lang: "ru" }, l.upper + " " + l.lower),
              h("div", { style: { fontSize: 13, color: c.textMuted, marginTop: 18 } }, "Tocá para ver cómo suena"))
          : h(React.Fragment, null,
              h("div", { className: "fc-top" },
                h("div", { className: "fc-glyph", lang: "ru" }, l.upper + " " + l.lower),
                h("div", { className: "fc-cur", lang: "ru", "aria-label": "Cursiva" }, l.upper + "\u2009" + l.lower)),
              h("div", { className: "fc-nombre" },
                h("span", { style: { fontSize: 24, fontWeight: 800, color: c.text }, lang: "ru" }, l.name),
                h("span", { style: { fontSize: 15, color: c.gold, fontWeight: 700 } }, "/" + l.translit + "/")),
              h("div", { className: "u-text", style: { marginTop: 8, fontSize: 15 } }, azFmt(l.pronunciation)),
              h("div", { className: "fc-word" },
                h("div", { style: { minWidth: 0 } },
                  h(PalabraLetra, { w, letra: l, c, size: 22 }),
                  h("div", { style: { fontSize: 13.5, color: c.textSub, marginTop: 4 } }, w.translit + " · " + w.meaning)),
                h("button", { className: "play", onClick: e => { e.stopPropagation(); sonidoLetra(l); setTimeout(() => hablar(lexComerById(w.lexId).ru), 900); }, "aria-label": "Escuchar" }, "▶")))),
      h("div", { className: "fc-ctl" },
        h("button", { onClick: () => ir(-1) }, "‹ Anterior"),
        h("button", { onClick: mezclar }, "Mezclar"),
        h("button", { onClick: () => ir(1) }, "Siguiente ›")),
      h("div", { className: "status-row" },
        h("button", { className: "status-btn", onClick: () => marcar(1),
          style: { background: nv === 1 ? YELLOW + "22" : c.bg3, border: `1px solid ${nv === 1 ? YELLOW : c.border}`, color: nv === 1 ? YELLOW : c.text } }, "Volver a estudiar"),
        h("button", { className: "status-btn", onClick: () => marcar(2),
          style: { background: nv === 2 ? green + "22" : c.bg3, border: `1px solid ${nv === 2 ? green : c.border}`, color: nv === 2 ? green : c.text } }, "Ya la sé"))));
}

/* ── Pronunciación: par mínimo y ejemplo ── */
function BotonPalabra({ id, c }) {
  const e = lexComerById(id);
  if (!e) return null;
  return h("button", { className: "par-w", onClick: () => hablar(e.ru), lang: "ru" },
    h("span", { className: "par-ru" }, e.acento || e.ru, h("span", { className: "pl" }, " ▶")),
    h("span", { className: "par-es" }, (e.senses[0] || {}).es));
}
function Ejemplo({ id, c }) {
  const e = lexComerById(id);
  if (!e) return null;
  return h("div", { className: "wrow" },
    h("div", { style: { flex: 1, minWidth: 0 } },
      h(AzPalabra, { texto: e.acento || e.ru, id }),
      h("span", { style: { fontSize: 14, color: c.gold, fontStyle: "italic", fontWeight: 600, marginLeft: 10 } }, "«" + e.translit + "»"),
      h("div", { style: { fontSize: 13, color: c.textSub, marginTop: 3 } }, (e.senses[0] || {}).es)),
    h("button", { className: "play", onClick: () => hablar(e.ru), "aria-label": "Escuchar" }, "▶"));
}
function VistaPronunciacion({ mod, c }) {
  return h(React.Fragment, null,
    h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(mod.intro)),
    mod.bloques.map((b, k) => h("div", { key: k },
      h("div", { className: "u-sec" }, b.titulo),
      h("div", { className: "u-text" }, azFmt(b.texto)),
      b.destacado && h("div", { className: "u-dest" }, azFmt(b.destacado)),
      b.comparacion && h("div", { className: "u-text", style: { marginTop: 10, fontSize: 14, fontStyle: "italic" } }, azFmt(b.comparacion)),
      b.truco && h("div", { className: "u-truco" }, h("b", null, "Truco: "), azFmt(b.truco)),
      b.pares && h("div", { className: "u-card", style: { marginTop: 12, padding: "4px 14px" } },
        b.pares.map((p, i) => h("div", { key: i, className: "par" },
          h("div", { className: "par-l", lang: "ru" }, p.letras),
          h(BotonPalabra, { id: p.a, c }), h(BotonPalabra, { id: p.b, c })))),
      b.ejemplos && h("div", { className: "u-card", style: { marginTop: 12, padding: "4px 16px" } },
        b.ejemplos.map(id => h(Ejemplo, { key: id, id, c }))))));
}

/* ── Primeras lecturas ── */
const TODAS = [];
ALPHABET.forEach(l => l.words.forEach(w => { if (!TODAS.some(x => x.lexId === w.lexId)) TODAS.push(w); }));
let BOLSA_LEER = [];
function palabraParaLeer() {
  if (!BOLSA_LEER.length) BOLSA_LEER = TODAS.slice().sort(() => Math.random() - .5);
  return BOLSA_LEER.pop();
}
function LeerEnVoz({ c }) {
  const [w, setW] = useState(palabraParaLeer);
  const [ver, setVer] = useState(false);
  const [n, setN] = useState(0);
  const e = lexComerById(w.lexId);
  const mostrar = () => { setVer(true); hablar(e.ru); };
  const otra = () => { setW(palabraParaLeer()); setVer(false); setN(x => x + 1); };
  return h("div", { className: "u-card", style: { padding: "22px 18px", marginTop: 12, textAlign: "center" } },
    h("div", { lang: "ru", style: { fontSize: 38, fontWeight: 800, color: c.text, lineHeight: 1.2, wordBreak: "break-word" } }, e.acento || e.ru),
    ver
      ? h("div", { style: { marginTop: 10 } },
          h("div", { style: { fontSize: 18, color: c.gold, fontStyle: "italic", fontWeight: 700 } }, "«" + e.translit + "»"),
          h("div", { style: { fontSize: 14, color: c.textSub, marginTop: 4 } }, w.meaning),
          h("button", { className: "play", style: { margin: "12px auto 0" }, onClick: () => hablar(e.ru), "aria-label": "Escuchar" }, "▶"))
      : h("div", { style: { fontSize: 13, color: c.textMuted, marginTop: 10 } }, "Leela en voz alta y después comprobá."),
    h("div", { style: { display: "flex", gap: 8, marginTop: 18 } },
      !ver && h("button", { className: "ubtn", style: { marginTop: 0 }, onClick: mostrar }, "¿Cómo se lee?"),
      h("button", { className: "ubtn" + (ver ? "" : " sec"), style: { marginTop: 0 }, onClick: otra }, "Otra palabra")),
    n > 0 && h("div", { style: { fontSize: 12, color: c.textMuted, marginTop: 10 } }, "Leíste " + n + (n === 1 ? " palabra" : " palabras")));
}
function VistaLectura({ mod, c, abrirDialogo }) {
  return h(React.Fragment, null,
    h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(mod.intro)),
    h("div", { className: "u-sec" }, "Leé en voz alta"),
    h(LeerEnVoz, { c }),
    h("div", { className: "u-sec" }, "Primeros diálogos"),
    mod.dialogos.map(id => {
      const d = DIALOGOS.find(x => x.id === id);
      if (!d) return null;
      return h("div", { key: id, className: "u-card mod", role: "button", tabIndex: 0, onClick: () => abrirDialogo(id), onKeyDown: e => { if (e.key === "Enter") abrirDialogo(id); } },
        h("div", { style: { flex: 1, minWidth: 0 } },
          h("div", { className: "mod-t" }, d.titulo),
          h("div", { className: "mod-d", lang: "ru" }, d.lineas.slice(0, 2).map(l => l.ru).join(" — "))));
    }));
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [modId, setModId] = useState(() => new URLSearchParams(location.search).get("m"));
  const [niveles, setNiveles] = useState({});
  const [hoja, setHoja] = useState(null);       // letra abierta
  const [tarjetas, setTarjetas] = useState(false);
  const [dialogo, setDialogo] = useState(null);
  const [practica, setPractica] = useState(null);   /* { titulo, pool } */
  const [visto, setVisto] = useState(2);            /* último módulo abierto */
  const [verPron, setVerPron] = useState(true);

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      setVerPron((await azGet('az_u1_pron', true)) !== false);
      setVisto(await azGet('az_u1_visto', 2));
      await azLoadProgress();
      refrescarNiveles();
      azSaveUnitProgress(1, {});
    })();
    const pop = () => { setModId(new URLSearchParams(location.search).get("m")); setHoja(null); setTarjetas(false); setDialogo(null); setPractica(null); };
    window.addEventListener("popstate", pop);
    return () => window.removeEventListener("popstate", pop);
  }, []);

  useEffect(() => {
    const m = modId ? unidad1Modulo(modId) : null;
    window.azFuenteActual = () => m ? "Unidad 1 · " + m.titulo : "Unidad 1";
    if (m && m.n > visto) { setVisto(m.n); azSet('az_u1_visto', m.n); }
    if (m) azGuardarUltimo({ unidad: 1, n: m.n, total: U.modulos.length, titulo: "Unidad 1 · " + m.titulo, href: "azbuka-1.html?m=" + m.id });
  }, [modId]);
  const practicarUnidad = () => setPractica({ titulo: "Unidad 1", pool: EJ_U1.filter(e => e.modulo <= Math.max(visto, 2)) });
  const rendirExamen = m => setPractica({ titulo: "Evaluación de la Unidad 1", pool: EJ_U1, examen: Object.assign({ intro: m.intro }, { partes: m.partes, aprobado: m.aprobado }) });
  const reforzar = parte => setPractica({ titulo: "Reforzar: " + parte.nombre, pool: EJ_U1.filter(e => parte.tipos.indexOf(e.tipo) >= 0) });
  const [examenU1, setExamenU1] = useState(null);
  useEffect(() => { if (!practica) setExamenU1((AZ_PROGRESS.units["1"] || {}).examen || null); }, [practica, niveles]);
  const practicarModulo = m => setPractica({ titulo: m.titulo, pool: m.n === 8 ? EJ_U1.filter(e => e.tipo === "pares") : EJ_U1.filter(e => e.modulo === m.n) });
  function refrescarNiveles() {
    const lv = {};
    ALPHABET.forEach(l => { lv[l.upper] = azItem('alfabeto:' + l.upper).level; });
    setNiveles(lv);
  }
  const abrirModulo = id => {
    history.pushState(null, "", id ? "?m=" + id : location.pathname);
    setModId(id); window.scrollTo(0, 0);
  };
  const setNivel = (l, v, auto) => { azSetItemLevel('alfabeto:' + l.upper, v, auto); setNiveles(p => Object.assign({}, p, { [l.upper]: v })); };
  const togglePron = () => { const v = !verPron; setVerPron(v); azSet('az_u1_pron', v); };
  const chip = on => on ? { background: c.gold + "22", border: `1px solid ${c.gold}`, color: c.gold } : { background: c.bg2, border: `1px solid ${c.border}`, color: c.textMuted };

  const c = azColors(darkMode);
  const green = darkMode ? "#4CAF82" : "#2E7D55";
  const mod = modId ? unidad1Modulo(modId) : null;
  const dominadas = ALPHABET.filter(l => niveles[l.upper] === 2).length;
  const palabrasDom = OBJETIVO_U1.filter(id => azItem("lex:" + id).level === 2).length;
  const idx = mod ? U.modulos.indexOf(mod) : -1;
  const vecino = d => { for (let k = idx + d; k >= 0 && k < U.modulos.length; k += d) if (U.modulos[k].tipo !== "pronto") return U.modulos[k]; return null; };
  const prev = mod && vecino(-1), next = mod && vecino(1);

  const tabs = mod ? [
    { id: "u", icon: "⊞", aria: "Unidad", action: () => abrirModulo(null) },
    { id: "p", icon: "‹", aria: "Módulo anterior", disabled: !prev, action: () => prev && abrirModulo(prev.id) },
    { id: "m", texto: "Módulo " + mod.n },
    { id: "s", icon: "›", aria: "Módulo siguiente", disabled: !next, action: () => next && abrirModulo(next.id) }
  ] : azTabsUnidad(1);

  /* ── Portada de la unidad ── */
  const portada = h(AzPortadaUnidad, { u: U, c, green, visto: Math.max(visto, 2), examen: examenU1, onPracticar: practicarUnidad, onAbrir: abrirModulo,
    progreso: [{ label: "Letras dominadas", valor: dominadas, total: ALPHABET.length }, { label: "Palabras dominadas", valor: palabrasDom, total: OBJETIVO_U1.length }],
    extraModulo: m => m.letras ? h("div", { className: "mod-l" }, m.letras.map(x => h("span", { key: x, lang: "ru",
      style: niveles[x] === 2 ? { color: green, borderColor: green + "88" } : niveles[x] === 1 ? { color: YELLOW, borderColor: YELLOW + "88" } : null }, x))) : null });

  /* ── Módulo ── */
  const vistaModulo = mod && h("div", { key: mod.id, style: { animation: "fadeIn 0.3s ease", paddingTop: 18 } },
    h("div", { className: "u-kicker" }, "Unidad 1 · Módulo " + mod.n),
    h("h1", { className: "u-title" }, mod.titulo),
    mod.tipo === "intro" && mod.secciones.map((s, i) => h("div", { key: i },
      h("div", { className: "u-sec" }, s.titulo),
      h("div", { className: "u-text" }, azFmt(s.texto)),
      s.destacado && h("div", { className: "u-dest" }, azFmt(s.destacado)))),
    mod.tipo === "intro" && next && h("button", { className: "ubtn", onClick: () => abrirModulo(next.id) }, "Empezar con las letras"),
    (mod.tipo === "pronunciacion" || mod.tipo === "reglas") && h(VistaPronunciacion, { mod, c }),
    mod.tipo === "lectura" && h(VistaLectura, { mod, c, abrirDialogo: setDialogo }),
    mod.tipo === "examen" && h(React.Fragment, null,
      h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(mod.intro)),
      h("div", { className: "u-card", style: { padding: "6px 16px", marginTop: 16 } }, mod.partes.map((p, k) =>
        h("div", { key: p.nombre, style: { display: "flex", justifyContent: "space-between", padding: "10px 0", borderTop: k ? `1px solid ${c.border}` : "none", fontSize: 14.5 } },
          h("span", { style: { fontWeight: 600 } }, p.nombre), h("span", { style: { color: c.textMuted } }, p.n + " ejercicios")))),
      examenU1 && h("div", { style: { marginTop: 14, fontSize: 14, color: examenU1.aprobado ? green : "#E2884A", fontWeight: 700 } },
        "Última vez: " + examenU1.pct + " % (" + examenU1.fecha.split("-").reverse().join("/") + ")" + (examenU1.aprobado ? " · aprobada" : "")),
      h("button", { className: "ubtn", onClick: () => rendirExamen(mod) }, examenU1 ? "Rendir de nuevo" : "Empezar la evaluación")),
    mod.tipo === "pronunciacion" && h("button", { className: "ubtn", style: { marginTop: 22 }, onClick: () => practicarModulo(mod) }, "Practicar los pares mínimos"),
    mod.tipo === "reglas" && h("button", { className: "ubtn", style: { marginTop: 22 }, onClick: () => practicarModulo(mod) }, "Practicar las reglas"),
    (mod.tipo === "pronunciacion" || mod.tipo === "reglas" || mod.tipo === "lectura") && next && h("button", { className: "ubtn sec", style: { marginTop: 22 }, onClick: () => abrirModulo(next.id) }, "Siguiente: " + next.titulo),
    mod.tipo === "letras" && h(React.Fragment, null,
      h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(mod.intro)),
      mod.pares && h("table", { className: "ctable" },
        h("tbody", null,
          h("tr", null, h("th", null, "Dura"), h("th", null, "Blanda"), h("th", null, "Con н")),
          mod.pares.map(p => h("tr", { key: p[0] },
            h("td", null, h("button", { className: "f-ru", lang: "ru", onClick: () => hablar(p[0].toLowerCase()) }, p[0] + " " + p[0].toLowerCase(), h("span", { className: "pl" }, "▶"))),
            h("td", null, h("button", { className: "f-ru blanda", lang: "ru", onClick: () => hablar(p[1].toLowerCase()) }, p[1] + " " + p[1].toLowerCase(), h("span", { className: "pl" }, "▶"))),
            h("td", null, h("button", { className: "f-ru", lang: "ru", onClick: () => { hablar(p[2]); setTimeout(() => hablar(p[3]), 700); } }, p[2] + " · " + p[3], h("span", { className: "pl" }, "▶"))))))),
      (mod.secciones || []).map((x, k) => h("div", { key: k },
        h("div", { className: "u-sec" }, x.titulo),
        h("div", { className: "u-text" }, azFmt(x.texto)),
        x.destacado && h("div", { className: "u-dest" }, azFmt(x.destacado)),
        x.truco && h("div", { className: "u-truco" }, h("b", null, "Truco: "), azFmt(x.truco)),
        x.ejemplos && h("div", { className: "u-card", style: { marginTop: 12, padding: "4px 16px" } },
          x.ejemplos.map(id => h(Ejemplo, { key: id, id, c }))))),
      mod.secciones && h("div", { className: "u-sec" }, "Las letras"),
      h("div", { className: "toggle-row" },
        h("button", { className: "pair-btn", onClick: togglePron, style: chip(verPron) }, "Pronunciación en español"),
        null),
      h("div", { className: "lgrid" }, mod.letras.map(x => {
        const l = LETRA[x], nv = niveles[x] || 0, col = nv === 2 ? green : nv === 1 ? YELLOW : null;
        return h("div", { key: x, className: "lcard", role: "button", tabIndex: 0, onClick: () => setHoja(x),
          onKeyDown: e => { if (e.key === "Enter") setHoja(x); },
          style: { border: `1px solid ${col ? col + "55" : c.border}` } },
          col && h("span", { style: { position: "absolute", top: 6, right: 8, fontSize: 10, color: col } }, nv === 2 ? "●" : "◑"),
          /* Igual que la grilla de Alfabeto: letra, cursiva, nombre y sonido */
          h("div", { lang: "ru", style: { display: "flex", alignItems: "baseline", justifyContent: "center", gap: 8, lineHeight: 1 } },
            h("span", { style: { fontSize: 28, fontWeight: 800, color: c.gold } }, l.upper),
            h("span", { style: { fontSize: 28, fontWeight: 500, color: c.textSub } }, l.lower)),
          h("div", { className: "cursiva", lang: "ru", style: { fontSize: 28, marginTop: 6, opacity: .7 } }, l.upper + " " + l.lower),
          h("div", { lang: "ru", style: { fontSize: 10, color: c.textMuted, marginTop: 6, fontStyle: "italic" } }, l.name),
          verPron && h("div", { style: { fontSize: 10, color: c.textSub, marginTop: 3 } }, "/" + l.translit + "/"));
      })),
      h("button", { className: "ubtn", onClick: () => setTarjetas(true) }, "Tarjetas (" + mod.letras.length + ")"),
      h("button", { className: "ubtn", style: { marginTop: 10 }, onClick: () => practicarModulo(mod) }, "Practicar este grupo"),
      next && h("button", { className: "ubtn sec", style: { marginTop: 10 }, onClick: () => abrirModulo(next.id) }, "Siguiente: " + next.titulo)));

  return h(React.Fragment, null,
    h(AzEstilosUnidad, { c, green }),
    h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs }, mod ? vistaModulo : portada),
    hoja && h(HojaLetra, { l: LETRA[hoja], c, green, nivel: niveles[hoja] || 0, setNivel, onClose: () => setHoja(null) }),
    practica && h(AzPractica, { key: practica.titulo, unidad: 1, titulo: practica.titulo, pool: practica.pool, mezcla: U1_MEZCLA, n: Math.min(12, practica.pool.length), dark: darkMode, aviso: AVISO_ACENTOS,
      examen: practica.examen, onReforzar: reforzar, onSalir: () => { setPractica(null); refrescarNiveles(); } }),
    dialogo && h(AzHojaDialogo, { d: DIALOGOS.find(x => x.id === dialogo), c, objetivo: OBJETIVO_U1, onClose: () => setDialogo(null) }),
    tarjetas && mod && h(Tarjetas, { letras: mod.letras, titulo: mod.titulo, c, green, niveles, setNivel, onClose: () => setTarjetas(false) }),
    h(AzBurbujaHost, { dark: darkMode }));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
