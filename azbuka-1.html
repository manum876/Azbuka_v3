/* Palabra con la letra resaltada; toda la palabra abre su burbuja */
function PalabraLetra({ w, letra, c, size }) {
  const e = lexComerById(w.lexId);
  const acento = e ? (e.acento || e.ru) : w.cyrillic;
  const partes = acento.match(/.\u0301?/gu) || [];
  const abrir = ev => { ev.stopPropagation(); azAbrirBurbuja("palabra", { id: w.lexId, forma: acento }, ev.currentTarget); };
  return h("span", { className: "az-link", role: "button", tabIndex: 0, lang: "ru", onClick: abrir,
    onKeyDown: ev => { if (ev.key === "Enter") abrir(ev); }, style: { fontSize: size || 17, fontWeight: 700 } },
    partes.map((p, i) => (p[0] === letra.upper || p[0] === letra.lower)
      ? h("span", { key: i, style: { color: c.gold, fontWeight: 800 } }, p) : p));
}

/* ── Ficha de una letra (hoja a pantalla completa) ── */
function HojaLetra({ l, c, nivel, setNivel, onClose, green }) {
  const cols = { 0: "#E2884A", 1: YELLOW, 2: green };
  return h("div", { className: "sheet", role: "dialog" },
    h("button", { className: "sheet-x", onClick: onClose, "aria-label": "Cerrar" }, "✕"),
    h("div", { className: "sheet-in" },
      h("div", { className: "u-kicker" }, "Letra"),
      h("div", { style: { display: "flex", gap: 20, alignItems: "center", paddingRight: 48 } },
        h("div", { style: { textAlign: "center" } },
          h("div", { className: "glyph", lang: "ru" }, l.upper + " " + l.lower),
          h("div", { className: "cursiva", lang: "ru" }, l.upper + "\u2009" + l.lower)),
        h("div", { style: { flex: 1, minWidth: 0 } },
          h("div", { style: { fontSize: 20, fontWeight: 800, color: c.text }, lang: "ru" }, l.name),
          h("div", { style: { fontSize: 14, color: c.textSub, marginTop: 4 } }, "Suena: /" + l.translit + "/"),
          h("button", { className: "play", style: { marginTop: 10 }, onClick: () => sonidoLetra(l), "aria-label": "Escuchar" }, "▶"))),
      h("div", { className: "u-text", style: { marginTop: 14 } }, l.pronunciation),
      h("div", { className: "status-row" },
        [0, 1, 2].map(v => {
          const on = nivel === v;
          return h("button", { key: v, className: "status-btn", onClick: () => setNivel(l, v),
            style: { background: on ? cols[v] + "22" : c.bg3, border: `1px solid ${on ? cols[v] : c.border}`, color: on ? cols[v] : c.textMuted } },
            v === 0 ? "No estudiada" : v === 1 ? "Aprendiendo" : "Dominada");
        })),
      h("div", { className: "u-card info" },
        h("div", { className: "info-t" }, "Cómo suena"),
        h("div", { className: "info-x" }, l.details.description + " " + l.details.similar)),
      h("div", { className: "u-card info" },
        h("div", { className: "info-t" }, "Errores comunes"),
        h("div", { className: "info-x" }, l.details.mistakes)),
      h("div", { className: "u-card info" },
        h("div", { className: "info-t" }, "Consejo"),
        h("div", { className: "info-x" }, l.details.tips + (l.details.similar_letters ? " " + l.details.similar_letters : ""))),
      h("div", { className: "u-sec" }, "Palabras para practicar"),
      h("div", { className: "u-card", style: { padding: "4px 16px" } },
        l.words.map((w, i) => {
          const e = lexComerById(w.lexId);
          return h("div", { key: i, className: "wrow" },
            h("div", { style: { flex: 1, minWidth: 0 } },
              h(PalabraLetra, { w, letra: l, c }),
              h("div", { style: { fontSize: 12.5, color: c.textSub, fontStyle: "italic", marginTop: 2 } }, w.translit),
              h("div", { style: { fontSize: 14, color: c.text, marginTop: 3 } }, w.meaning),
              w.note && h("div", { style: { fontSize: 12, color: c.textMuted, marginTop: 3, lineHeight: 1.4 } }, w.note)),
            h("button", { className: "play", onClick: () => hablar(e ? e.ru : w.cyrillic), "aria-label": "Escuchar" }, "▶"));
        }))));
}

/* Palabra de ejemplo sin repetir: cada letra tiene su «bolsa» con sus
   palabras mezcladas; se sacan de a una y, cuando se vacía, se vuelve a
   mezclar sin empezar por la última que se vio. */
const BOLSAS = {};
function palabraSiguiente(l) {
  const b = BOLSAS[l.upper] || (BOLSAS[l.upper] = { resto: [], ult: -1 });
  if (!b.resto.length) {
    b.resto = l.words.map((_, k) => k).sort(() => Math.random() - .5);
    if (b.resto.length > 1 && b.resto[b.resto.length - 1] === b.ult) b.resto.unshift(b.resto.pop());
  }
  b.ult = b.resto.pop();
  return b.ult;
}

/* ── Tarjetas ── */
function Tarjetas({ letras, titulo, c, niveles, setNivel, onClose, green, cursiva }) {
  const [orden, setOrden] = useState(letras);
  const [i, setI] = useState(0);
  const [vuelta, setVuelta] = useState(false);
  const [wi, setWi] = useState(() => palabraSiguiente(LETRA[letras[0]]));
  const l = LETRA[orden[i]];
  const ir = d => { const ni = (i + d + orden.length) % orden.length; setVuelta(false); setI(ni); setWi(palabraSiguiente(LETRA[orden[ni]])); };
  const mezclar = () => { const o = orden.slice().sort(() => Math.random() - .5); setOrden(o); setI(0); setVuelta(false); setWi(palabraSiguiente(LETRA[o[0]])); };
  const marcar = v => { setNivel(l, v); ir(1); };
  useEffect(() => {
    const k = e => { if (e.key === "ArrowRight") ir(1); else if (e.key === "ArrowLeft") ir(-1); else if (e.key === " ") { e.preventDefault(); setVuelta(v => !v); } else if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, [orden, i]);
  const nv = niveles[l.upper] || 0;
  const w = l.words[wi] || l.words[0];   /* una palabra distinta cada vez */
  return h("div", { className: "sheet", role: "dialog" },
    h("button", { className: "sheet-x", onClick: onClose, "aria-label": "Cerrar" }, "✕"),
    h("div", { className: "sheet-in" },
      h("div", { className: "u-kicker" }, "Tarjetas · " + titulo),
      h("div", { style: { fontSize: 14, color: c.textMuted, marginBottom: 14 } },
        (i + 1) + " de " + orden.length + (nv ? " · " + (nv === 2 ? "dominada" : "aprendiendo") : "")),
      h("div", { className: "fc" + (vuelta ? " dorso" : ""), onClick: () => setVuelta(v => !v), role: "button", tabIndex: 0, "aria-label": "Dar vuelta la tarjeta" },
        !vuelta
          ? h(React.Fragment, null,
              h("div", { className: "fc-glyph", lang: "ru" }, l.upper + " " + l.lower),
              h("div", { style: { fontSize: 13, color: c.textMuted, marginTop: 18 } }, "Tocá para ver cómo suena"))
          : h(React.Fragment, null,
              h("div", { className: "fc-top" },
                h("div", { className: "fc-glyph", lang: "ru" }, l.upper + " " + l.lower),
                h("div", { className: "fc-cur", lang: "ru", "aria-label": "Cursiva" }, l.upper + "\u2009" + l.lower)),
              h("div", { className: "fc-nombre" },
                h("span", { style: { fontSize: 24, fontWeight: 800, color: c.text }, lang: "ru" }, l.name),
                h("span", { style: { fontSize: 15, color: c.gold, fontWeight: 700 } }, "/" + l.translit + "/")),
              h("div", { className: "u-text", style: { marginTop: 8, fontSize: 15 } }, l.pronunciation),
              h("div", { className: "fc-word" },
                h("div", { style: { minWidth: 0 } },
                  h(PalabraLetra, { w, letra: l, c, size: 22 }),
                  h("div", { style: { fontSize: 13.5, color: c.textSub, marginTop: 4 } }, w.translit + " · " + w.meaning)),
                h("button", { className: "play", onClick: e => { e.stopPropagation(); sonidoLetra(l); setTimeout(() => hablar(lexComerById(w.lexId).ru), 900); }, "aria-label": "Escuchar" }, "▶")))),
      h("div", { className: "fc-ctl" },
        h("button", { onClick: () => ir(-1) }, "‹ Anterior"),
        h("button", { onClick: mezclar }, "Mezclar"),
        h("button", { onClick: () => ir(1) }, "Siguiente ›")),
      h("div", { className: "status-row" },
        h("button", { className: "status-btn", onClick: () => marcar(1),
          style: { background: nv === 1 ? YELLOW + "22" : c.bg3, border: `1px solid ${nv === 1 ? YELLOW : c.border}`, color: nv === 1 ? YELLOW : c.text } }, "Volver a estudiar"),
        h("button", { className: "status-btn", onClick: () => marcar(2),
          style: { background: nv === 2 ? green + "22" : c.bg3, border: `1px solid ${nv === 2 ? green : c.border}`, color: nv === 2 ? green : c.text } }, "Ya la sé"))));
}

/* ── Pronunciación: par mínimo y ejemplo ── */
function BotonPalabra({ id, c }) {
  const e = lexComerById(id);
  if (!e) return null;
  return h("button", { className: "par-w", onClick: () => hablar(e.ru), lang: "ru" },
    h("span", { className: "par-ru" }, e.acento || e.ru, h("span", { className: "pl" }, " ▶")),
    h("span", { className: "par-es" }, (e.senses[0] || {}).es));
}
function Ejemplo({ id, c }) {
  const e = lexComerById(id);
  if (!e) return null;
  return h("div", { className: "wrow" },
    h("div", { style: { flex: 1, minWidth: 0 } },
      h(AzPalabra, { texto: e.acento || e.ru, id }),
      h("span", { style: { fontSize: 14, color: c.gold, fontStyle: "italic", fontWeight: 600, marginLeft: 10 } }, "«" + e.translit + "»"),
      h("div", { style: { fontSize: 13, color: c.textSub, marginTop: 3 } }, (e.senses[0] || {}).es)),
    h("button", { className: "play", onClick: () => hablar(e.ru), "aria-label": "Escuchar" }, "▶"));
}
function VistaPronunciacion({ mod, c }) {

}

/* ── Primeras lecturas ── */
const TODAS = [];
ALPHABET.forEach(l => l.words.forEach(w => { if (!TODAS.some(x => x.lexId === w.lexId)) TODAS.push(w); }));
let BOLSA_LEER = [];
function palabraParaLeer() {
  if (!BOLSA_LEER.length) BOLSA_LEER = TODAS.slice().sort(() => Math.random() - .5);
  return BOLSA_LEER.pop();
}
function LeerEnVoz({ c }) {
  const [w, setW] = useState(palabraParaLeer);
  const [ver, setVer] = useState(false);
  const [n, setN] = useState(0);
  const e = lexComerById(w.lexId);
  const mostrar = () => { setVer(true); hablar(e.ru); };
  const otra = () => { setW(palabraParaLeer()); setVer(false); setN(x => x + 1); };
  return h("div", { className: "u-card", style: { padding: "22px 18px", marginTop: 12, textAlign: "center" } },
    h("div", { lang: "ru", style: { fontSize: 38, fontWeight: 800, color: c.text, lineHeight: 1.2, wordBreak: "break-word" } }, e.acento || e.ru),
    ver
      ? h("div", { style: { marginTop: 10 } },
          h("div", { style: { fontSize: 18, color: c.gold, fontStyle: "italic", fontWeight: 700 } }, "«" + e.translit + "»"),
          h("div", { style: { fontSize: 14, color: c.textSub, marginTop: 4 } }, w.meaning),
          h("button", { className: "play", style: { margin: "12px auto 0" }, onClick: () => hablar(e.ru), "aria-label": "Escuchar" }, "▶"))
      : h("div", { style: { fontSize: 13, color: c.textMuted, marginTop: 10 } }, "Leela en voz alta y después comprobá."),
