              r.email && h("a", { href: "mailto:" + r.email + "?subject=" + encodeURIComponent("Azbuka: tu reporte"), style: { background: c.bg3, border: `1px solid ${c.border}`, color: c.text, fontSize: 12.5, fontWeight: 600, padding: "8px 12px", borderRadius: 10, textDecoration: "none" } }, "Responder"),
              borrando !== r.id && btnChico("Borrar", () => setBorrando(r.id), ROJO_TXT)),
            borrando === r.id && h("div", { style: { fontSize: 13.5, lineHeight: 1.5, color: c.text, background: ROJO + "22", border: `1px solid ${ROJO}`, borderRadius: 10, padding: 12, marginTop: 10 } },
              "Se borra este reporte para siempre.",
              boton(c, "Sí, borrar", () => borrar(r), "peligro"), boton(c, "Cancelar", () => setBorrando(null), "sec")));
        })));
}
function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [translit, setTranslit] = useState(azTranslitModo());
  useEffect(() => { (async () => setDarkMode((await azGet('az_theme', 'dark')) !== 'light'))(); }, []);
  const [rol, setRol] = useState("");
  useEffect(() => { if (window.AzCuenta && AzCuenta.activa) AzCuenta.comprobarRol().then(r => setRol(r || "")); }, []);
  const esAdmin = rol === "admin", esRevisor = rol === "revisor";
  const c = azColors(darkMode);
  const elegir = async v => { setTranslit(v); await azSet("az_translit", v); azAplicarTranslit(); };
  const lbl = t => h("div", { style: { fontSize: 10.5, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", color: c.gold, margin: "24px 0 10px" } }, t);
  const caja = (...hijos) => h("div", { style: { background: c.card, border: `1px solid ${c.border}`, borderRadius: 16, padding: 16 } }, ...hijos);
  const chip = (v, texto) => h("button", {
    className: "btn", onClick: () => elegir(v),
    style: Object.assign({ padding: "7px 11px", borderRadius: 10, fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" },
      translit === v ? { background: c.gold + "22", border: `1px solid ${c.gold}`, color: c.gold } : { background: c.bg2, border: `1px solid ${c.border}`, color: c.textMuted })
  }, texto);
  return h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs: [] },
    h("div", { style: { animation: "fadeIn 0.3s ease", paddingTop: 18 } },
      h("h1", { style: { fontSize: 26, fontWeight: 800, color: c.text } }, TX.titulo),
      lbl(TX.cuenta),
      caja(h(SeccionCuenta, { c })),
      (esAdmin || esRevisor) && lbl("Abecé en construcción"),
      (esAdmin || esRevisor) && caja(h(SeccionAbece, { c })),
      esAdmin && lbl("Accesos"),
      esAdmin && caja(h(SeccionAccesos, { c })),
      esRevisor && lbl("Alumnos"),
      esRevisor && caja(h(SeccionAccesos, { c, modo: "revisor" })),
      esAdmin && lbl("Reportes"),
      esAdmin && caja(h(SeccionReportes, { c })),
      lbl(TX.translit),
      caja(
        RU ? h("div", { style: { fontSize: 13.5, color: c.textMuted, lineHeight: 1.6 } },
          "Произношение кириллицей (", h("i", null, "о́ла"), ") помогает читать в начале. Когда ты уже читаешь по-испански, лучше его скрыть: так ты читаешь сам. ",
          h("b", { style: { color: c.text } }, "Автоматически:"), " видно в уроках 1–3 и скрыто с 4-го (в словаре и других разделах — по уроку, на котором ты сейчас). В «Алфавите» и в уроке 1 оно видно всегда: там произношение и есть то, что ты учишь.")
        : h("div", { style: { fontSize: 13.5, color: c.textMuted, lineHeight: 1.6 } },
          "La transliteración (", h("i", null, "jarashó"), ") ayuda a leer al principio. Cuando ya lees el cirílico, ocultarla te obliga a leer en ruso. ",
          h("b", { style: { color: c.text } }, "Automática:"), " se ve en las Unidades 1 a 3 y se oculta desde la 4 (en el Diccionario, Verbos, Casos y Diálogos, según la unidad en la que estás). Siempre se ve en Alfabeto y en la Unidad 1, donde la pronunciación es lo que se aprende, y en los diálogos la puedes volver a prender cuando quieras."),
        h("div", { style: { display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" } }, chip("auto", TX.auto), chip("si", TX.mostrar), chip("no", TX.ocultar))),
      lbl(TX.copia),
      caja(h(AzCopiaSeguridad, { c }))));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
