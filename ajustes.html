<!DOCTYPE html>

/* ============================================================

const h = React.createElement;
/* ── Cuenta (14/10/2026) ── */

}

function SeccionAccesos({ c }) {

    h("div", { style: { fontSize: 13.5, color: c.textMuted, lineHeight: 1.6 } }, "Solo entran los mails de esta lista. Para que alguien entre, agrega su mail y avísale: entra con el código que le llega por mail."),

    h("input", { type: "text", placeholder: "Nota (opcional): quién es", value: nota, onInput: e => setNota(e.target.value), style: inp }),

    h("div", { style: { marginTop: 14 } },

          h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
            h("div", { style: { flex: 1, minWidth: 0 } },

              h("div", { style: { fontSize: 12.5, color: c.textMuted, marginTop: 2 } }, (p.nota ? p.nota + " · " : "") + (p.tiene_cuenta ? (p.ultimo ? "Última actividad: " + fechaCorta(p.ultimo) : "Entró, sin progreso todavía") : "Todavía no entró"))),
            !p.admin && quitando !== p.email && h("button", { className: "btn", onClick: () => setQuitando(p.email), style: { background: c.bg3, border: `1px solid ${c.border}`, color: ROJO_TXT, fontSize: 12.5, fontWeight: 600, padding: "8px 12px", borderRadius: 10, cursor: "pointer", fontFamily: "inherit", flexShrink: 0 } }, "Quitar")),
          quitando === p.email && h("div", { style: { fontSize: 13.5, lineHeight: 1.5, color: c.text, background: ROJO + "22", border: `1px solid ${ROJO}`, borderRadius: 10, padding: 12, marginTop: 10 } },

}
/* ── Reportes de errores (21/10/2026, solo admin) ── */
function SeccionReportes({ c }) {
  const A = window.AzCuenta;
  const [lista, setLista] = useState(null), [error, setError] = useState("");
  const [ver, setVer] = useState("pend");             /* "pend" | "res" */
  const [abierto, setAbierto] = useState(null), [borrando, setBorrando] = useState(null);
  const cargar = async () => { setError(""); try { setLista(await A.reportes()); } catch (e) { setError("No se pudo cargar la lista. Revisa la conexión."); } };
  useEffect(() => { cargar(); }, []);

    style: { background: c.bg3, border: `1px solid ${c.border}`, color: col || c.text, fontSize: 12.5, fontWeight: 600, padding: "8px 12px", borderRadius: 10, cursor: "pointer", fontFamily: "inherit" } }, t);
  return h(React.Fragment, null,
    h("div", { style: { fontSize: 13.5, color: c.textMuted, lineHeight: 1.6 } }, "Los errores que mandan los alumnos con el botón 🐞 del menú. También te llega un mail por cada uno."),

    error && h("div", { style: { fontSize: 13.5, lineHeight: 1.5, borderRadius: 10, padding: "10px 12px", marginTop: 12, color: ROJO_TXT, background: ROJO + "22" } }, error),
    h("div", { style: { marginTop: 10 } },
      lista == null ? !error && peq("Cargando…")

            h("div", { onClick: () => setAbierto(ab ? null : r.id), style: { cursor: "pointer" } },
              peq(fechaCorta(r.creado) + " · " + (r.email || "?")),

                ab || r.texto.length <= 140 ? r.texto : r.texto.slice(0, 140) + "…"),
              peq((r.pantalla || "?") + (ab ? "" : "  ·  ver más"), { marginTop: 3, color: ab ? c.textMuted : c.gold })),
            ab && h("div", { style: { fontSize: 13, lineHeight: 1.55, color: c.textSub, background: c.bg2, border: `1px solid ${c.border}`, borderRadius: 10, padding: "10px 12px", marginTop: 8, wordBreak: "break-word" } },
              r.esperado && h("div", { style: { marginBottom: 8 } }, h("b", { style: { color: c.text } }, "Qué esperaba: "), r.esperado),
              r.url && h("div", null, h("b", { style: { color: c.text } }, "Dirección: "), h("a", { href: r.url, style: { color: c.gold } }, r.url)),
              ctx.dispositivo && h("div", null, h("b", { style: { color: c.text } }, "Teléfono: "), ctx.dispositivo),

function App() {

        h("div", { style: { display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" } }, chip("auto", "Automática"), chip("si", "Mostrar"), chip("no", "Ocultar"))),

htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
