<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Азбука — Módulo B</title>
<link rel="stylesheet" href="core.css">
</head>
<body>
<div id="root"></div>
<script src="preact.js"></script>
<script src="core.js"></script>
<script src="shell.js"></script>
<script>
const { useState, useEffect } = htmPreact;

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [view, setView] = useState("inicio");

  useEffect(() => {
    (async () => { setDarkMode((await azGet('az_theme', 'dark')) !== 'light'); })();
  }, []);

  return React.createElement(AzShell, {
    darkMode, setDarkMode,
    moduleId: "modulo-b",
    title: "Азбука",
    subtitle: "Módulo B",
    tabs: [{ id: "inicio", icon: "⊞", label: "Inicio" }],
    view, setView
  },
    React.createElement("div", { style: { animation: "fadeIn 0.3s ease", textAlign: "center", padding: "10vh 0" } },
      React.createElement("h1", { style: { fontSize: 20, marginBottom: 8 } }, "Módulo B"),
      React.createElement("p", { style: { fontSize: 13.5, color: "#8A847A" } }, "Misma barra lateral, mismo header, mismo bottom nav — cero código de shell copiado en este archivo.")
    )
  );
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
