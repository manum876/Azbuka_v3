# Genera los audios de la prueba de voces (voces-prueba.html) y los guarda en el repo.
# Se corre a mano: GitHub → Actions → «Voces de prueba» → Run workflow.
name: Voces de prueba
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Instalar lo necesario
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy omegaconf
      - name: Generar los audios (se borran los anteriores y se hacen de nuevo)
        run: |
          rm -rf audio/prueba
          python herramientas/voces/generar.py
      - name: Guardar los audios en el repo
        run: |
          git config user.name "Azbuka (voces)"
          git config user.email "azbuka.aprenderuso@gmail.com"
          git add -A audio/prueba
          git diff --cached --quiet && echo "No hay audios nuevos" || git commit -m "Voces de prueba (Silero)"
          git push
