<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Азбука — Unidad 6: Ubicación, movimiento y prepositivo</title>
<meta name="apple-mobile-web-app-title" content="Азбука">
<meta name="theme-color" content="#0F0F14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/core.css">
</head>
<body>
<div id="root"></div>
<script src="assets/preact.js"></script>
<script src="data/data-lexicon.js"></script>
<script src="data/data-casos.js"></script>
<script src="data/data-verbos.js"></script>
<script src="data/data-frases.js"></script>
<script src="data/data-dialogos.js"></script>
<script src="data/data-mapa.js"></script>
<script src="data/data-unidad-6.js"></script>
<script src="js/core.js"></script>
<script src="js/progress.js"></script>
<script src="js/shell.js"></script>
<script src="js/corrector.js"></script>
<script src="js/burbuja.js"></script>
<script src="js/unidad-ui.js"></script>
<script src="js/unidad.js"></script>
<script>
/* ============================================================
   AZBUKA-6.HTML — Unidad 6: Ubicación, movimiento y prepositivo
   ------------------------------------------------------------
   04/10/2026. Piezas de unidad-ui.js y unidad.js. Propio de esta
   unidad: tablas «nominativo → dónde» (módulos 3, 5 y 6), mapa de
   ciudades con la actividad «¿Dónde vive?» (módulo 4), ampliación
   con las excepciones (módulos 5 y 6), lecturas (módulo 10) y el
   desafío del día, que pasó al inicio (js/hoy.js).
   URL: azbuka-6.html · azbuka-6.html?m=u6m4
   ============================================================ */
const { useState, useEffect } = htmPreact;
const h = React.createElement;
const U = UNIDAD_6;
const EJ_U6 = ejerciciosUnidad6();
const EJ_U6_BASE = EJ_U6.filter(e => !e.ampliacion);
const D6 = u6Datos();
const OBJETIVO_U6 = LEXICON_COMER.filter(e => (e.introducedIn || []).indexOf(6) >= 0 || (e.appearsIn || []).indexOf(6) >= 0).map(e => e.id);
const AVISO_ACENTOS = "En Azbuka, los acentos (´) son solo una ayuda para leer: en ruso no se escriben, así que no hace falta que los pongas. La е vale por ё.";
const CASA6 = ["кварти́ра", "ко́мната", "ку́хня", "спа́льня", "балко́н"];
const lugar = ru => D6.lug[D6.sin(ru)];

function detalleTarjeta(e) {
  const s = D6.lug[D6.sin(e.acento || e.ru)] || D6.geo[D6.sin(e.acento || e.ru)];
  if (s) return "¿dónde? " + s.pr + " " + s.prep + " · ¿adónde? " + s.pr + " " + s.acc;
  const v = D6.verb[D6.sin(e.acento || e.ru)];
  return v ? ["я", "ты", "он / она́", "мы", "вы", "они́"].map((p, i) => p + " " + v.f[i]).join(" · ") : null;
}

/* Tabla «nominativo → dónde» */
function TablaDonde({ c, lista }) {
  return h(AzTablaGrupos, { encabezados: ["Palabra", "¿Dónde?"], c,
    filas: lista.filter(Boolean).map(s => [{ id: s.id, ru: s.nom, es: s.es }, { id: s.id, ru: s.pr + " " + s.prep, es: s.en }]) });
}

/* Módulo 4: «¿Dónde vive?» en el mapa. Se toca la ciudad y se escribe la respuesta. */
const PERS6 = [["А́нна", "Ana", "Она́"], ["Ива́н", "Iván", "Он"], ["Ма́ша", "Masha", "Она́"], ["Ди́ма", "Dima", "Он"], ["Лу́кас", "Lucas", "Он"], ["О́льга", "Olga", "Она́"]];
function ActividadMapa({ c, green }) {
  const claves = Object.keys(MAPA.ciudades);
  const nueva = () => ({ p: PERS6[Math.floor(Math.random() * PERS6.length)], k: claves[Math.floor(Math.random() * claves.length)] });
  const [q, setQ] = useState(nueva);
  const [tocada, setTocada] = useState(null);
  const [txt, setTxt] = useState("");
  const [res, setRes] = useState(null);
  const e = lexComerById(MAPA.ciudades[q.k].lex), s = D6.geo[D6.sin(e.acento)];
  const esperadas = [q.p[2] + " живёт в " + s.prep + ".", q.p[0] + " живёт в " + s.prep + ".", "В " + s.prep + "."];
  const norm = t => (t.match(/[А-Яа-яЁё\u0301-]+/g) || []).map(azFormaClave).join(" ");
  const revisar = () => setRes(esperadas.some(x => norm(x) === norm(txt)));
  const otra = () => { setQ(nueva()); setTocada(null); setTxt(""); setRes(null); };
  return h("div", { className: "u-card", style: { padding: 16, marginTop: 14 } },
    /* Orden (Manu, 05/10/2026): título, vistas, mapa, la ciudad tocada, la consigna y después la respuesta */
    h("div", { className: "u-kicker", style: { marginBottom: 6 } }, "¿Dónde vive?"),
    h(AzMapaExplorar, { c, modo: "ciudades", onTocar: k => setTocada(k) }),
    h("div", { style: { fontSize: 15, lineHeight: 1.5, marginTop: 12, fontWeight: 600 } }, q.p[1] + " vive en " + U6_CIUDADES[e.acento] + ". Tocá esa ciudad en el mapa."),
    tocada && h("div", { style: { marginTop: 10, fontWeight: 700, color: tocada === q.k ? green : "#E2884A" } }, tocada === q.k ? "✓ ¡Esa es!" : "Esa no es. Buscá " + U6_CIUDADES[e.acento] + "."),
    tocada === q.k && h(React.Fragment, null,
      h("div", { lang: "ru", style: { marginTop: 10, fontSize: 16, fontWeight: 700 } }, "Где живёт " + q.p[0] + "?"),
      h("input", { className: "pr-input", lang: "ru", value: txt, placeholder: "Contestá en ruso…", onInput: ev => { setTxt(ev.target.value); setRes(null); },
        autocapitalize: "off", autocorrect: "off", spellcheck: false, autocomplete: "off",
        style: { width: "100%", boxSizing: "border-box", marginTop: 8, background: c.bg3, border: `1px solid ${c.border}`, borderRadius: 10, padding: "11px 12px", color: c.text, fontSize: 16, fontFamily: "inherit" } }),
      h("button", { className: "ubtn", style: { marginTop: 10 }, disabled: !txt.trim(), onClick: revisar }, "Revisar"),
      res != null && h("div", { style: { marginTop: 10, fontSize: 14.5, lineHeight: 1.5 } },
        h("div", { style: { fontWeight: 700, color: res ? green : "#E2884A" } }, res ? "✓ Bien" : "Casi: revisalo"),
        h("div", { lang: "ru", style: { display: "flex", alignItems: "center", gap: 10, marginTop: 4 } }, h("b", { style: { flex: 1 } }, esperadas[0]), h("button", { className: "play", onClick: () => azHablarRu(esperadas[0]), "aria-label": "Escuchar" }, "▶")),
        h("div", { style: { color: c.textMuted, fontSize: 13, marginTop: 4 } }, azFmt(u6Regla(s))))),
    h("button", { className: "ubtn sec", style: { marginTop: 12 }, onClick: otra }, "Otra persona"));
}

function Lectura({ L, c }) {
  const [es, setEs] = useState(false);
  const idx = azIndiceFormas();
  const lexDe = ru => (ru.match(/[А-Яа-яЁё\u0301]+/g) || []).map(w => { const r = idx.get(azFormaClave(w)); return r && r[0] ? r[0][0] : null; });
  return h("div", { className: "u-card", style: { padding: "14px 16px", marginTop: 12 } },
    h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
      h("div", { lang: "ru", style: { flex: 1, fontSize: 18, fontWeight: 800, color: c.gold } }, L.titulo),
      h("button", { className: "play", onClick: () => azHablarSecuencia(L.lineas.map(l => ({ texto: l[0] }))), "aria-label": "Escuchar el texto" }, "▶"),
      h("button", { className: "play", onClick: azCallar, "aria-label": "Detener el audio" }, "■")),
    L.lineas.map((l, k) => h("div", { key: k, style: { marginTop: 8, fontSize: 16.5, lineHeight: 1.5 } },
      h(AzTexto, { ru: l[0], lex: lexDe(l[0]), objetivo: OBJETIVO_U6 }),
      es && h("div", { style: { fontSize: 13, color: c.textMuted } }, l[1]))),
    h("button", { className: "ubtn sec", style: { marginTop: 12 }, onClick: () => setEs(!es) }, es ? "Ocultar la traducción" : "Ver la traducción"));
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [modId, setModId] = useState(() => new URLSearchParams(location.search).get("m"));
  const [tarjetas, setTarjetas] = useState(null);
  const [practica, setPractica] = useState(null);
  const [visto, setVisto] = useState(1);
  const [examen, setExamen] = useState(null);
  const [, refrescar] = useState(0);

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      setVisto(await azGet('az_u6_visto', 1));
      await azLoadProgress();
      azSaveUnitProgress(6, {});
      refrescar(x => x + 1);
    })();
    const pop = () => { setModId(new URLSearchParams(location.search).get("m")); setTarjetas(null); setPractica(null); };
    window.addEventListener("popstate", pop);
    return () => window.removeEventListener("popstate", pop);
  }, []);
  useEffect(() => {
    const m = modId ? unidad6Modulo(modId) : null;
    window.azFuenteActual = () => m ? "Unidad 6 · " + m.titulo : "Unidad 6";
    if (m && m.n > visto) { setVisto(m.n); azSet('az_u6_visto', m.n); }
    if (m) azGuardarUltimo({ unidad: 6, n: m.n, total: U.modulos.length, titulo: "Unidad 6 · " + m.titulo, href: "azbuka-6.html?m=" + m.id });
  }, [modId]);
  useEffect(() => { if (!practica && AZ_PROGRESS.units) setExamen((AZ_PROGRESS.units["6"] || {}).examen || null); }, [practica]);

  const abrirModulo = id => { history.pushState(null, "", id ? "?m=" + id : location.pathname); setModId(id); window.scrollTo(0, 0); };
  const practicarUnidad = () => setPractica({ titulo: "Unidad 6", pool: EJ_U6_BASE.filter(e => e.modulo <= Math.max(visto, 1)) });
  const practicarModulo = m => setPractica({ titulo: m.titulo, n: m.nPractica, pool: EJ_U6_BASE.filter(e => e.modulo === m.n) });
  const practicarAmpliacion = m => setPractica({ titulo: "Ampliación: " + m.titulo.toLowerCase(), pool: EJ_U6.filter(e => e.ampliacion && e.modulo === m.n) });
  const rendirExamen = m => setPractica({ titulo: "Evaluación de la Unidad 6", pool: EJ_U6_BASE, examen: { intro: m.intro, partes: m.partes, aprobado: m.aprobado } });
  const reforzar = parte => setPractica({ titulo: "Reforzar: " + parte.nombre, pool: EJ_U6_BASE.filter(e => parte.tipos.indexOf(e.tipo) >= 0) });

  const c = azColors(darkMode);
  const green = darkMode ? "#4CAF82" : "#2E7D55";
  const mod = modId ? unidad6Modulo(modId) : null;
  const idx = mod ? U.modulos.indexOf(mod) : -1;
  const prev = mod && U.modulos[idx - 1], next = mod && U.modulos[idx + 1];
  const palabrasDom = OBJETIVO_U6.filter(id => azItem("lex:" + id).level === 2).length;
  const tabs = mod ? [
    { id: "u", icon: "⊞", aria: "Unidad", action: () => abrirModulo(null) },
    { id: "p", icon: "‹", aria: "Módulo anterior", disabled: !prev, action: () => prev && abrirModulo(prev.id) },
    { id: "m", texto: "Módulo " + mod.n },
    { id: "s", icon: "›", aria: "Módulo siguiente", disabled: !next, action: () => next && abrirModulo(next.id) }
  ] : azTabsUnidad(6);

  const portada = h(AzPortadaUnidad, { u: U, c, green, visto: Math.max(visto, 1), examen, onPracticar: practicarUnidad, onAbrir: abrirModulo,
    progreso: [{ label: "Palabras dominadas", valor: palabrasDom, total: OBJETIVO_U6.length }] });

  let vista = null;
  if (mod) {
    const base = Object.values(D6.lug).filter(s => !s.amp && s.tipo === "lugar");
    const casa = CASA6.map(lugar);
    const afuera = base.filter(s => CASA6.indexOf(s.ac) < 0);
    const amp = n => (U6_AMPLIACION_RU[n] || "").split(" ").map(lugar).filter(Boolean);
    const bloqueAmp = n => amp(n).length > 0 && h("div", { style: { marginTop: 28, paddingTop: 6, borderTop: `1px solid ${c.border}` } },
      h("div", { className: "u-sec" }, "Ampliación · opcional"),
      h("p", { className: "u-text", style: { fontSize: 14.5 } }, "Más lugares para quien quiera sumar vocabulario. Es opcional: no entra en la práctica de la unidad ni en la evaluación."),
      n === 5 && h("div", { className: "u-truco", style: { marginTop: 10 } }, azFmt("**Excepción:** ва́нная (baño) y гости́ная (living) se declinan como adjetivos: в ва́нной, в гости́ной. Se aprenden así, de memoria.")),
      n === 6 && h("div", { className: "u-truco", style: { marginTop: 10 } }, azFmt("**Con на, de memoria:** на вокза́ле (en la estación de tren), на по́чте (en el correo), на пля́же (en la playa).")),
      h(TablaDonde, { c, lista: amp(n) }),
      h("button", { className: "ubtn", onClick: () => setTarjetas({ ids: amp(n).map(s => s.id), titulo: "Ampliación: " + mod.titulo.toLowerCase() }) }, "Tarjetas (" + amp(n).length + ")"),
      h("button", { className: "ubtn sec", style: { marginTop: 10 }, onClick: () => practicarAmpliacion(mod) }, "Practicar la ampliación"));
    vista = h("div", { key: mod.id, style: { animation: "fadeIn 0.3s ease", paddingTop: 18 } },
      h("div", { className: "u-kicker" }, "Unidad 6 · Módulo " + mod.n),
      h("h1", { className: "u-title" }, mod.titulo),
      h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(mod.intro)),
      mod.tipo === "leccion" && h(React.Fragment, null,
        h(AzSecciones, { secciones: mod.secciones }),
        mod.n === 3 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Los lugares de la unidad"), h(TablaDonde, { c, lista: base })),
        mod.n === 4 && h(React.Fragment, null,
          h("div", { className: "u-sec" }, "Países"), h(TablaDonde, { c, lista: Object.values(D6.geo).filter(s => s.tipo === "pais") }),
          h("div", { className: "u-sec" }, "El mapa"), h(ActividadMapa, { c, green })),
        mod.n === 5 && h(React.Fragment, null, h("div", { className: "u-sec" }, "La casa"), h(TablaDonde, { c, lista: casa.concat([lugar("стол")]) })),
        mod.n === 6 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Lugares"), h(TablaDonde, { c, lista: afuera })),
        h("button", { className: "ubtn", style: { marginTop: 22 }, onClick: () => practicarModulo(mod) }, "Practicar este módulo"),
        (mod.n === 5 || mod.n === 6) && bloqueAmp(mod.n)),
      mod.tipo === "lectura" && h(React.Fragment, null,
        U6_LECTURAS.map(L => h(Lectura, { key: L.id, L, c })),
        h("button", { className: "ubtn", style: { marginTop: 18 }, onClick: () => practicarModulo(mod) }, "Practicar «Mi ciudad»")),
      mod.tipo === "proyecto" && h(AzProyecto, { mod, c, green, clave: "az_u6_proyecto", fuente: { titulo: "Unidad 6 · Мой го́род", href: "azbuka-6.html?m=u6m11" }, aviso: AVISO_ACENTOS }),
      mod.tipo === "examen" && h(React.Fragment, null,
        h("div", { className: "u-card", style: { padding: "6px 16px", marginTop: 16 } }, mod.partes.map((p, k) =>
          h("div", { key: p.nombre, style: { display: "flex", justifyContent: "space-between", padding: "10px 0", borderTop: k ? `1px solid ${c.border}` : "none", fontSize: 14.5 } },
            h("span", { style: { fontWeight: 600 } }, p.nombre), h("span", { style: { color: c.textMuted } }, p.n + " ejercicios")))),
        examen && h("div", { style: { marginTop: 14, fontSize: 14, color: examen.aprobado ? green : "#E2884A", fontWeight: 700 } },
          "Última vez: " + examen.pct + " % (" + examen.fecha.split("-").reverse().join("/") + ")" + (examen.aprobado ? " · aprobada" : "")),
        h("button", { className: "ubtn", onClick: () => rendirExamen(mod) }, examen ? "Rendir de nuevo" : "Empezar la evaluación")),
      next && h("button", { className: "ubtn sec", style: { marginTop: 22 }, onClick: () => abrirModulo(next.id) }, "Siguiente: " + next.titulo));
  }

  return h(React.Fragment, null,
    h(AzEstilosUnidad, { c, green }),
    h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs }, mod ? vista : portada),
    practica && h(AzPractica, { key: practica.titulo + (practica.pool[0] || {}).id, unidad: 6, titulo: practica.titulo, pool: practica.pool, mezcla: U6_MEZCLA,
      n: azNPractica(practica.pool, practica.n), dark: darkMode, aviso: AVISO_ACENTOS, examen: practica.examen, onReforzar: reforzar, objetivo: OBJETIVO_U6,
      onSalir: () => { setPractica(null); refrescar(x => x + 1); } }),
    tarjetas && h(AzTarjetasPalabras, { ids: tarjetas.ids, titulo: tarjetas.titulo, c, green, detalle: detalleTarjeta, onClose: () => { setTarjetas(null); refrescar(x => x + 1); } }),
    h(AzBurbujaHost, { dark: darkMode }));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
