<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Азбука — Unidad 3: Sustantivos, género y número</title>
<meta name="apple-mobile-web-app-title" content="Азбука">
<meta name="theme-color" content="#0F0F14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/core.css">
</head>
<body>
<div id="root"></div>
<script src="assets/preact.js"></script>
<script src="data/data-lexicon.js"></script>
<script src="data/data-casos.js"></script>
<script src="data/data-verbos.js"></script>
<script src="data/data-frases.js"></script>
<script src="data/data-dialogos.js"></script>
<script src="data/data-unidad-3.js"></script>
<script src="js/core.js"></script>
<script src="js/progress.js"></script>
<script src="js/shell.js"></script>
<script src="js/corrector.js"></script>
<script src="js/burbuja.js"></script>
<script src="js/unidad-ui.js"></script>
<script src="js/unidad.js"></script>
<script>
/* ============================================================
   AZBUKA-3.HTML — Unidad 3: Sustantivos, género y número
   ------------------------------------------------------------
   27/09/2026. Piezas de pantalla de unidad-ui.js, práctica y
   evaluación de unidad.js. Propio de esta unidad: ejemplos por
   género (módulos 2 a 5), tabla de adjetivos (módulo 7), vocabulario
   por tema (módulo 8) y la desafío del día, que pasó al inicio (js/hoy.js).
   URL: azbuka-3.html · azbuka-3.html?m=u3m6
   ============================================================ */
const { useState, useEffect } = htmPreact;
const h = React.createElement;
const U = UNIDAD_3;
const EJ_U3 = ejerciciosUnidad3();
const D3 = u3Datos();
const OBJETIVO_U3 = LEXICON_COMER.filter(e => (e.introducedIn || []).indexOf(3) >= 0 || (e.appearsIn || []).indexOf(3) >= 0).map(e => e.id);
const AVISO_ACENTOS = "En Azbuka, los acentos (´) son solo una ayuda para leer: en ruso no se escriben, así que no hace falta que los pongas.";
const EXCEP = ["папа", "дядя", "мужчина", "дедушка", "кофе"];
/* Dorso de las tarjetas: el género y, en las terminadas en -ь, con un adjetivo */
const BOLSHOI = { m: "большо́й", f: "больша́я", n: "большо́е" };
function detalleTarjeta(e) {
  if (e.posNormalized !== "sustantivo" || !e.gender) return null;
  const g = { m: "masculino", f: "femenino", n: "neutro" }[e.gender];
  return /ь$/.test(e.ru) ? g + " · " + BOLSHOI[e.gender] + " " + (e.acento || e.ru) : g;
}

/* Ejemplos de un género: chips con emoji, se tocan para escuchar */
function Ejemplos({ lista, c }) {
  return h(React.Fragment, null,
    h("div", { className: "u-text", style: { fontSize: 13, marginTop: 8 } }, "Tocá una palabra para escuchar cómo suena."),
    h("div", { style: { display: "flex", flexWrap: "wrap", gap: 8, marginTop: 10 } }, lista.map(s =>
      h("button", { key: s.id, onClick: () => azHablarRu(s.ru), lang: "ru",
        style: { display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 10, background: c.bg3, border: `1px solid ${c.border}`, color: c.text, fontSize: 15, fontWeight: 700, fontFamily: "inherit", cursor: "pointer" } },
        s.emoji && h("span", { style: { fontSize: 18 } }, s.emoji), s.ac, h("span", { style: { fontSize: 11.5, color: c.textMuted, fontWeight: 500 } }, s.es)))));
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [modId, setModId] = useState(() => new URLSearchParams(location.search).get("m"));
  const [tarjetas, setTarjetas] = useState(null);
  const [practica, setPractica] = useState(null);
  const [visto, setVisto] = useState(1);
  const [examen, setExamen] = useState(null);
  const [tema, setTema] = useState(U3_TEMAS[0].id);
  const [, refrescar] = useState(0);

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      setVisto(await azGet('az_u3_visto', 1));
      await azLoadProgress();
      azSaveUnitProgress(3, {});
      refrescar(x => x + 1);
    })();
    const pop = () => { setModId(new URLSearchParams(location.search).get("m")); setTarjetas(null); setPractica(null); };
    window.addEventListener("popstate", pop);
    return () => window.removeEventListener("popstate", pop);
  }, []);
  useEffect(() => {
    const m = modId ? unidad3Modulo(modId) : null;
    window.azFuenteActual = () => m ? "Unidad 3 · " + m.titulo : "Unidad 3";
    if (m && m.n > visto) { setVisto(m.n); azSet('az_u3_visto', m.n); }
    if (m) azGuardarUltimo({ unidad: 3, n: m.n, total: U.modulos.length, titulo: "Unidad 3 · " + m.titulo, href: "azbuka-3.html?m=" + m.id });
  }, [modId]);
  useEffect(() => { if (!practica && AZ_PROGRESS.units) setExamen((AZ_PROGRESS.units["3"] || {}).examen || null); }, [practica]);

  const abrirModulo = id => { history.pushState(null, "", id ? "?m=" + id : location.pathname); setModId(id); window.scrollTo(0, 0); };
  const practicarUnidad = () => setPractica({ titulo: "Unidad 3", pool: EJ_U3.filter(e => e.modulo <= Math.max(visto, 1)) });
  /* Módulos 2 a 5: la práctica suma el género de las palabras vistas en los módulos anteriores, para mezclar */
  const practicarModulo = m => setPractica({ titulo: m.titulo, n: m.nPractica,
    pool: EJ_U3.filter(e => e.modulo === m.n || (m.n >= 2 && m.n <= 5 && e.acumula && e.modulo >= 2 && e.modulo < m.n)) });
  const rendirExamen = m => setPractica({ titulo: "Evaluación de la Unidad 3", pool: EJ_U3, examen: { intro: m.intro, partes: m.partes, aprobado: m.aprobado } });
  const reforzar = parte => setPractica({ titulo: "Reforzar: " + parte.nombre, pool: EJ_U3.filter(e => parte.tipos.indexOf(e.tipo) >= 0) });

  const c = azColors(darkMode);
  const green = darkMode ? "#4CAF82" : "#2E7D55";
  const mod = modId ? unidad3Modulo(modId) : null;
  const idx = mod ? U.modulos.indexOf(mod) : -1;
  const prev = mod && U.modulos[idx - 1], next = mod && U.modulos[idx + 1];
  const palabrasDom = OBJETIVO_U3.filter(id => azItem("lex:" + id).level === 2).length;
  const chip = on => ({ padding: "7px 11px", borderRadius: 10, fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit",
    background: on ? c.gold + "22" : c.bg2, border: `1px solid ${on ? c.gold : c.border}`, color: on ? c.gold : c.textMuted });
  const tabs = mod ? [
    { id: "u", icon: "⊞", aria: "Unidad", action: () => abrirModulo(null) },
    { id: "p", icon: "‹", aria: "Módulo anterior", disabled: !prev, action: () => prev && abrirModulo(prev.id) },
    { id: "m", texto: "Módulo " + mod.n },
    { id: "s", icon: "›", aria: "Módulo siguiente", disabled: !next, action: () => next && abrirModulo(next.id) }
  ] : azTabsUnidad(3);

  const portada = h(React.Fragment, null,
    h(AzPortadaUnidad, { u: U, c, green, visto: Math.max(visto, 1), examen, onPracticar: practicarUnidad, onAbrir: abrirModulo,
      progreso: [{ label: "Palabras dominadas", valor: palabrasDom, total: OBJETIVO_U3.length }] }));
  
  let vista = null;
  if (mod) {
    const sinE = x => x.replace(/ё/g, "е");
    const lista = n => (U3_VISTAS[n] || "").split(" ").map(ru => D3.sust.find(s => sinE(s.ru) === sinE(ru))).filter(Boolean);
    const temaAct = U3_TEMAS.find(t => t.id === tema);
    const idsTema = D3.sust.filter(s => s.tema === tema).map(s => s.id);
    vista = h("div", { key: mod.id, style: { animation: "fadeIn 0.3s ease", paddingTop: 18 } },
      h("div", { className: "u-kicker" }, "Unidad 3 · Módulo " + mod.n),
      h("h1", { className: "u-title" }, mod.titulo),
      h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(mod.intro)),
      mod.tipo === "leccion" && h(React.Fragment, null,
        h(AzSecciones, { secciones: mod.secciones }),
        mod.genero && h(React.Fragment, null, h("div", { className: "u-sec" }, "Ejemplos"), h(Ejemplos, { lista: lista(mod.n), c })),
        mod.n === 5 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Masculinos que terminan en -а, -я o -е"), h(Ejemplos, { lista: lista(5), c })),
        mod.n === 6 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Singular y plural"),
          h(AzTablaGrupos, { encabezados: ["Singular", "Plural"], c, filas: lista(6).filter(s => s.pl).map(s => [{ id: s.id, ru: s.ac, es: s.es }, { id: s.id, ru: s.pl, es: "" }]) })),
        mod.tablaAdj && h(React.Fragment, null, h("div", { className: "u-sec" }, mod.tablaAdj === "m7" ? "Los primeros adjetivos, en sus cuatro formas" : "Más adjetivos para describir"),
          h(AzTablaGrupos, { encabezados: ["Masculino", "Femenino", "Neutro", "Plural"], c,
            filas: D3.adj.filter(a => a.desde === (mod.tablaAdj === "m7" ? 7 : 9)).map(a => [{ ru: a.m, es: a.esM }, { ru: a.f, es: a.esF }, { ru: a.n, es: "" }, { ru: a.pl, es: "" }]) })),
        h("button", { className: "ubtn", style: { marginTop: 22 }, onClick: () => practicarModulo(mod) }, "Practicar este módulo")),
      mod.tipo === "vocabulario" && h(React.Fragment, null,
        h("div", { style: { display: "flex", flexWrap: "wrap", gap: 8, marginTop: 14 } }, U3_TEMAS.map(t => h("button", { key: t.id, style: chip(tema === t.id), onClick: () => setTema(t.id) }, t.titulo))),
        h("div", { className: "u-sec" }, temaAct.titulo + " (" + idsTema.length + ")"),
        h(AzVocabulario, { ids: idsTema, c }),
        h("button", { className: "ubtn", onClick: () => setTarjetas({ ids: idsTema, titulo: temaAct.titulo }) }, "Tarjetas: " + temaAct.titulo),
        h("button", { className: "ubtn", style: { marginTop: 10 }, onClick: () => setPractica({ titulo: temaAct.titulo, pool: EJ_U3.filter(e => e.modulo === 8 && idsTema.indexOf(e.grupo) >= 0) }) }, "Practicar: " + temaAct.titulo)),
      mod.tipo === "proyecto" && h(AzProyecto, { mod, c, green, clave: "az_u3_proyecto", fuente: { titulo: "Unidad 3 · Proyecto final", href: "azbuka-3.html?m=u3m10" }, aviso: AVISO_ACENTOS }),
      mod.tipo === "examen" && h(React.Fragment, null,
        h("div", { className: "u-card", style: { padding: "6px 16px", marginTop: 16 } }, mod.partes.map((p, k) =>
          h("div", { key: p.nombre, style: { display: "flex", justifyContent: "space-between", padding: "10px 0", borderTop: k ? `1px solid ${c.border}` : "none", fontSize: 14.5 } },
            h("span", { style: { fontWeight: 600 } }, p.nombre), h("span", { style: { color: c.textMuted } }, p.n + " ejercicios")))),
        examen && h("div", { style: { marginTop: 14, fontSize: 14, color: examen.aprobado ? green : "#E2884A", fontWeight: 700 } },
          "Última vez: " + examen.pct + " % (" + examen.fecha.split("-").reverse().join("/") + ")" + (examen.aprobado ? " · aprobada" : "")),
        h("button", { className: "ubtn", onClick: () => rendirExamen(mod) }, examen ? "Rendir de nuevo" : "Empezar la evaluación")),
      next && h("button", { className: "ubtn sec", style: { marginTop: 22 }, onClick: () => abrirModulo(next.id) }, "Siguiente: " + next.titulo));
  }

  return h(React.Fragment, null,
    h(AzEstilosUnidad, { c, green }),
    h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs }, mod ? vista : portada),
    practica && h(AzPractica, { key: practica.titulo + (practica.pool[0] || {}).id, unidad: 3, titulo: practica.titulo, pool: practica.pool, mezcla: U3_MEZCLA,
      n: azNPractica(practica.pool, practica.n), dark: darkMode, aviso: AVISO_ACENTOS, examen: practica.examen, onReforzar: reforzar,
      onSalir: () => { setPractica(null); refrescar(x => x + 1); } }),
    tarjetas && h(AzTarjetasPalabras, { ids: tarjetas.ids, titulo: tarjetas.titulo, c, green, detalle: detalleTarjeta, onClose: () => { setTarjetas(null); refrescar(x => x + 1); } }),
    h(AzBurbujaHost, { dark: darkMode }));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
