<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

</head>

<div id="root"></div>
<script src="assets/preact.js"></script>

<!-- El léxico del curso activo (06/11/2026: en Abecé, el español; los datos de cada unidad los pide azHoyCargar) -->
<script>azEscribirLexico();</script>
<script src="assets/supabase.js"></script>
<script src="js/cuenta.js"></script>
<script src="js/progress.js"></script>
<script src="js/shell.js"></script>
<script src="js/corrector.js"></script>
<script src="js/burbuja.js"></script>
<script src="js/unidad-ui.js"></script>
<script src="js/unidad.js"></script>
<script src="js/hoy.js"></script>
<script>
/* ============================================================
   REPASO.HTML — Repaso de hoy (19/10/2026, Contexto §6.22)
   ------------------------------------------------------------
   La sesión diaria con repaso espaciado (progress.js: srs, cajas de
   1, 3, 7 y 14 días). Arma sola unos 12 ejercicios (~10 minutos):
     · la regla del día: la regla más floja (2 Mal o más en 7 días) o,
       si no hay, la regla que toca; su resumen y 2 ejercicios;
     · lo que toca repasar (ejercicios y palabras de cualquier unidad
       ya vista), hasta el 60 % de la sesión;
     · el resto, de la unidad actual (la de az_ultimo), hasta el
       módulo al que llegó.
   Los datos de cada unidad se cargan al abrir la página (azHoyCargar,
   hoy.js). El desafío del día sigue aparte, en el inicio.
   ABECÉ (06/11/2026): la misma página para el curso de español, con los
   textos en ruso (borrador para Iván): los bancos ejerciciosUnidadEsN, la
   mezcla ESN_MEZCLA, az_ultimo_es y solo lo del curso (en el repaso
   espaciado, las unidades de Abecé se guardan como "es1", "es2"…).
   ============================================================ */
const { useState, useEffect } = htmPreact;
const h = React.createElement;
const AZ_REPASO_N = 12, AZ_REPASO_PARTE = 0.6;
const ABECE = typeof AZ_DIRECCION !== "undefined" && AZ_DIRECCION.id === "abece";
const AZ_REPASO_MAX = ABECE ? AZ_UNITS.length : 13;   /* las unidades que tienen banco */
const AVISO_ACENTOS = ABECE
  ? "В испанском знак ударения (´) — часть написания: если его забыть, ответ засчитывается как «Почти». Перевёрнутые знаки ¿ и ¡ не обязательны."
  : "En Azbuka, los acentos (´) son solo una ayuda para leer: en ruso no se escriben, así que no hace falta que los pongas. La е vale por ё.";
/* Los textos de la página: en Abecé, en ruso */
const TX = ABECE ? {
  armando: "Собираем твоё повторение…", error: "Не получилось собрать повторение. Попробуй ещё раз, когда будет интернет.",
  nadaHoy: "Сегодня повторять нечего.", nadaTodavia: "Повторять пока нечего.",
  vuelve: "Пройденное возвращается вовремя: на следующий день, через 3 дня, через 7 и через 14.",
  empieza: "Повторение собирается из того, что ты тренируешь в уроках. Начни с первого.",
  seguir: "Продолжить урок", primera: "Начать урок 1", paraRepasar: "Повторить", deUnidad: n => "Из урока " + n, nuevos: "Новое",
  resumen: (n, m, a) => n + " " + azPlural(n, "упражнение", "упражнения", "упражнений") + ", минут 10." + (m ? " Завтра вернётся: " + m + "." : "") + (a ? " Уже выучено: " + a + "." : ""),
  regla: "Правило дня", unidad: n => "Урок " + n, costo: n => "На этой неделе ошибок: " + n + ".", verRegla: "Открыть всё правило", empezar: "Начать",
  kicker: "Сегодня", titulo: "Повторение дня",
  intro: "То, что ты скоро забудешь, из любого урока, и немного из урока, в котором ты сейчас. То, что получилось, вернётся позже; то, что не получилось, — завтра.",
  practica: "Повторение дня", salir: "Вернуться к повторению",
  introPr: (n, r) => n + " " + azPlural(n, "упражнение", "упражнения", "упражнений") + ": " + (r ? "сначала правило дня, потом " : "") + "то, что пора повторить, и немного из текущего урока. То, что получилось, вернётся позже; то, что не получилось, — завтра.",
  inicio: "abece-1.html", doc: "Abecé — Повторение дня"
} : {
  armando: "Armando tu repaso…", error: "No se pudo armar el repaso. Vuelve a intentarlo con conexión.",
  nadaHoy: "Hoy no hay nada para repasar.", nadaTodavia: "Todavía no hay nada para repasar.",
  vuelve: "Lo que practicaste vuelve cuando toca: al día siguiente, a los 3 días, a los 7 y a los 14.",
  empieza: "El repaso se arma con lo que vas practicando en las unidades. Empieza por la primera.",
  seguir: "Seguir con la unidad", primera: "Empezar la Unidad 1", paraRepasar: "Para repasar", deUnidad: n => "De la Unidad " + n, nuevos: "Nuevos",
  resumen: (n, m, a) => n + " ejercicios, unos 10 minutos." + (m ? " Mañana vuelven " + m + "." : "") + (a ? " Ya aprendiste " + a + "." : ""),
  regla: "La regla del día", unidad: n => "Unidad " + n, costo: n => "Te costó " + n + " veces esta semana.", verRegla: "Ver la regla completa", empezar: "Empezar",
  kicker: "Hoy", titulo: "Repaso de hoy",
  intro: "Lo que estás por olvidar, de cualquier unidad, y un poco de la unidad en la que estás. Lo que sale bien vuelve más adelante; lo que sale mal, mañana.",
  practica: "Repaso de hoy", salir: "Volver al repaso",
  introPr: (n, r) => n + " ejercicios: " + (r ? "primero la regla del día, después " : "") + "lo que toca repasar y un poco de la unidad actual. Lo que sale bien vuelve más adelante; lo que sale mal, mañana.",
  inicio: "azbuka-1.html", doc: null
};
function azPlural(n, a, b, c) { const m = n % 10, d = n % 100; return m === 1 && d !== 11 ? a : m >= 2 && m <= 4 && (d < 12 || d > 14) ? b : c; }
if (TX.doc) { document.title = TX.doc; document.documentElement.lang = "ru"; }

/* El banco de una unidad, sin ampliaciones ni recorridos fijos; cada ejercicio con su unidad */
function bancoDe(n) {
  try {
    const fn = window[(ABECE ? "ejerciciosUnidadEs" : "ejerciciosUnidad") + n];
    if (typeof fn !== "function") return [];
    return fn().filter(e => !e.ampliacion && e.tipo !== "dia" && e.tipo !== "final").map(e => Object.assign({}, e, { unidad: n }));
  } catch (e) { return []; }
}
const unidadDe = clave => { const m = /^ej:U(\d+)-/.exec(clave); return m ? Number(m[1]) : null; };
/* La unidad de una entrada del repaso espaciado (Abecé: "es4" → 4) y si es del curso activo */
const uDe = x => { const u = x.u; if (ABECE) { const m = /^es(\d+)$/.exec(String(u || "")); return m ? Number(m[1]) : null; }
  return typeof u === "number" ? u : /^\d+$/.test(String(u || "")) ? Number(u) : unidadDe(x.clave); };
const delCurso = x => ABECE ? /^es/.test(String(x.u || "")) : !/^es/.test(String(x.u || ""));

/* Arma la sesión. Devuelve { lista, regla, cuentas } */
async function armarSesion(ultimo) {
  await azLoadProgress();
  const actual = ultimo && ultimo.unidad && ultimo.unidad <= AZ_REPASO_MAX ? ultimo.unidad : null;
  const pend = azRepasoPendiente().filter(delCurso).map(x => Object.assign({}, x, { u: uDe(x) }));
  const flojas = azReglasFlojas().filter(delCurso).map(x => Object.assign({}, x, { u: uDe(x) }));
  const reglasPend = pend.filter(x => x.clave.indexOf("regla:") === 0);
  const reglaId = flojas.length ? flojas[0].id : reglasPend.length ? reglasPend[0].clave.slice(6) : null;
  const reglaU = flojas.length ? flojas[0].u : reglasPend.length ? reglasPend[0].u : null;
  /* Unidades que hay que cargar */
  const unidades = new Set();
  if (actual) unidades.add(actual);
  if (reglaU && reglaU <= AZ_REPASO_MAX) unidades.add(reglaU);
  pend.slice(0, 60).forEach(x => { const u = x.u || unidadDe(x.clave); if (u && u <= AZ_REPASO_MAX) unidades.add(u); });
  const bancos = {};
  for (const n of [...unidades].sort((a, b) => a - b)) { await azHoyCargar(n); bancos[n] = bancoDe(n); }
  const todos = [].concat(...Object.values(bancos));
  const porId = new Map(todos.map(e => [e.id, e]));
  const lista = [], usados = new Set(), grupos = new Set();
  const libre = e => e && !usados.has(e.id) && !(e.grupo && grupos.has(e.unidad + ":" + e.grupo));
  const tomar = (e, motivo) => { usados.add(e.id); if (e.grupo) grupos.add(e.unidad + ":" + e.grupo); lista.push(Object.assign({}, e, { motivo })); };
  const cupoRepaso = Math.round(AZ_REPASO_N * AZ_REPASO_PARTE);
  /* 1. La regla del día: 2 ejercicios de esa regla */
  if (reglaId) azPickExercises(todos.filter(e => e.regla === reglaId), { n: 2, repaso: 0 }).forEach(e => libre(e) && tomar(e, "regla"));
  /* 2. Los ejercicios que toca repasar, lo más atrasado primero */
  pend.filter(x => x.clave.indexOf("ej:") === 0).forEach(x => {
    const e = porId.get(x.clave.slice(3));
    if (lista.length < cupoRepaso && libre(e)) tomar(e, "repaso");
  });
  /* 3. Las palabras y letras que tocan: un ejercicio que las practique */
  pend.filter(x => /^(lex|alfabeto):/.test(x.clave)).forEach(x => {
    if (lista.length >= cupoRepaso) return;
    const e = azShuffle(todos.filter(y => (y.items || []).indexOf(x.clave) >= 0 && libre(y)))[0];
    if (e) tomar(e, "repaso");
  });
  /* 4. La unidad actual, hasta el módulo al que llegó */
  if (actual && bancos[actual]) {
    const hasta = ultimo.n || 99;
    const base = bancos[actual].filter(e => (e.modulo || 1) <= hasta && libre(e));
    azPickExercises(base, { n: AZ_REPASO_N - lista.length, mezcla: window[(ABECE ? "ES" : "U") + actual + "_MEZCLA"] || {}, dificultad: azTargetDifficulty(actual, 1), repaso: 0 })
      .forEach(e => { if (lista.length < AZ_REPASO_N && libre(e)) tomar(e, "unidad"); });
  }
  /* El orden: la regla primero, después repaso y unidad mezclados */
  const primero = lista.filter(e => e.motivo === "regla"), resto = azShuffle(lista.filter(e => e.motivo !== "regla"));
  const manana = azSumarDias(azHoy(), 1);
  const srs = AZ_PROGRESS.srs || {};
  const cuentas = {
    repaso: lista.filter(e => e.motivo === "repaso").length,
    unidad: lista.filter(e => e.motivo === "unidad").length,
    pendientes: pend.length,
    manana: Object.keys(srs).filter(k => srs[k].p === manana).length,
    aprendidos: Object.keys(srs).filter(k => srs[k].c === 5).length
  };
  return { lista: primero.concat(resto), regla: reglaId ? { id: reglaId, floja: flojas.length ? flojas[0].fallos : 0 } : null, cuentas, actual };
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [ultimo, setUltimo] = useState(undefined);
  const [ses, setSes] = useState(null);
  const [practica, setPractica] = useState(false);
  const [verRegla, setVerRegla] = useState(false);
  const [vuelta, setVuelta] = useState(0);
  useEffect(() => { (async () => {
    setDarkMode((await azGet("az_theme", "dark")) !== "light");
    setUltimo(await azLeerUltimo());
  })(); }, []);
  useEffect(() => { if (ultimo === undefined) return; setSes(null); armarSesion(ultimo).then(setSes).catch(() => setSes({ error: true })); }, [ultimo, vuelta]);
  const c = azColors(darkMode);
  const green = darkMode ? "#4CAF82" : "#2E7D55";
  const ir = href => e => azNavigate(e, href);

  let cuerpo;
  if (!ses) cuerpo = h("div", { className: "u-text", style: { marginTop: 18 } }, TX.armando);
  else if (ses.error) cuerpo = h("div", { className: "u-text", style: { marginTop: 18 } }, TX.error);
  else if (!ses.lista.length) cuerpo = h(React.Fragment, null,
    h("div", { className: "u-card", style: { padding: "16px 18px", marginTop: 16 } },
      h("div", { style: { fontSize: 17, fontWeight: 800 } }, ultimo ? TX.nadaHoy : TX.nadaTodavia),
      h("div", { className: "u-text", style: { fontSize: 14.5, marginTop: 6 } }, ultimo ? TX.vuelve : TX.empieza)),
    h("a", { className: "ubtn", href: ultimo ? ultimo.href : TX.inicio, onClick: ir(ultimo ? ultimo.href : TX.inicio), style: { display: "block", textAlign: "center", textDecoration: "none", boxSizing: "border-box" } }, ultimo ? TX.seguir : TX.primera));
  else {
    const r = ses.regla && typeof azRegla === "function" ? azRegla(ses.regla.id) : null;
    const s = r && r.seccion;
    const ej = s && s.ejemplos && s.ejemplos[0];
    cuerpo = h(React.Fragment, null,
      h("div", { className: "u-card", style: { padding: "14px 18px", marginTop: 16 } },
        [[TX.paraRepasar, ses.cuentas.repaso + ses.lista.filter(e => e.motivo === "regla").length],
         [ses.actual ? TX.deUnidad(ses.actual) : TX.nuevos, ses.cuentas.unidad]].map(([t, v], k) =>
          h("div", { key: t, style: { display: "flex", justifyContent: "space-between", padding: "8px 0", borderTop: k ? `1px solid ${c.border}` : "none", fontSize: 15 } },
            h("span", { style: { fontWeight: 600 } }, t), h("span", { style: { fontWeight: 800, color: c.gold } }, v))),
        h("div", { style: { fontSize: 12.5, color: c.textMuted, marginTop: 6, lineHeight: 1.5 } },
          TX.resumen(ses.lista.length, ses.cuentas.manana, ses.cuentas.aprendidos))),
      s && h(React.Fragment, null,
        h("div", { className: "u-sec" }, TX.regla),
        h("div", { className: "u-card", style: { padding: "14px 18px" } },
          h("div", { style: { fontSize: 11, fontWeight: 700, letterSpacing: 1.2, textTransform: "uppercase", color: c.textMuted } }, TX.unidad(r.unidad) + " · " + r.modulo.titulo),
          h("div", { style: { fontSize: 17, fontWeight: 800, marginTop: 4 } }, s.titulo),
          ses.regla.floja > 0 && h("div", { style: { fontSize: 13, color: "#E2884A", fontWeight: 700, marginTop: 4 } }, TX.costo(ses.regla.floja)),
          s.destacado && h("div", { className: "u-dest", style: { marginTop: 10 } }, azFmt(s.destacado)),
          ej && h("div", { style: { marginTop: 10, background: c.bg2, border: `1px solid ${c.border}`, borderRadius: 10, padding: "10px 12px" } },
            /* La frase en la lengua que se aprende y, abajo, la traducción (Abecé: es / ru) */
            h("div", { lang: ABECE ? "es" : "ru", style: { fontSize: 16, fontWeight: 700 } }, String(ABECE ? ej.es : ej.ru).replace(/[{}]/g, "")),
            h("div", { lang: ABECE ? "ru" : "es", style: { fontSize: 13.5, color: c.textMuted, marginTop: 2 } }, ABECE ? ej.ru : ej.es)),
          h("button", { className: "ubtn sec", style: { marginTop: 12 }, onClick: () => setVerRegla(true) }, TX.verRegla))),
      h("button", { className: "ubtn", style: { marginTop: 22 }, onClick: () => setPractica(true) }, TX.empezar));
  }

  return h(React.Fragment, null,
    h(AzEstilosUnidad, { c, green }),
    h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs: [] },
      h("div", { style: { animation: "fadeIn 0.3s ease", paddingTop: 18, paddingBottom: 24 } },
        h("div", { className: "u-kicker" }, TX.kicker),
        h("h1", { className: "u-title" }, TX.titulo),
        h("div", { className: "u-text", style: { marginTop: 8 } }, TX.intro),
        cuerpo)),
    practica && ses && ses.lista && h(AzPractica, { key: "repaso-" + vuelta, unidad: ses.actual || 1, titulo: TX.practica, pool: ses.lista, enOrden: true, n: ses.lista.length,
      dark: darkMode, aviso: AVISO_ACENTOS, sinOtra: true, salir: TX.salir,
      intro: TX.introPr(ses.lista.length, !!ses.regla),
      onSalir: () => { setPractica(false); setVuelta(x => x + 1); } }),
    verRegla && ses && ses.regla && h(AzHojaRegla, { id: ses.regla.id, c, onClose: () => setVerRegla(false), volver: TX.salir }),
    h(AzBurbujaHost, { dark: darkMode }));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById("root"));
</script>
</body>
</html>
