<!DOCTYPE html>
<html lang="es">
<head>

</head>
<body>
<div id="root"></div>
<script src="assets/preact.js"></script>
<script src="data/data-lexicon.js"></script>
<script src="data/data-casos.js"></script>
<script src="data/data-verbos.js"></script>
<script src="data/data-frases.js"></script>
<script src="data/data-dialogos.js"></script>
<script src="data/data-unidad-5.js"></script>
<script src="js/core.js"></script>

<script>
/* ============================================================
   AZBUKA-5.HTML — Unidad 5: Verbos en presente y acciones cotidianas
   ------------------------------------------------------------
   03/10/2026. Piezas de pantalla de unidad-ui.js, práctica y
   evaluación de unidad.js. Propio de esta unidad: tarjetas de verbos
   con sus seis formas (módulos 1, 3, 4, 9 y ampliación del 5),
   pronombres (módulo 2), lecturas de «Mi día» (módulo 10) y el
   desafío del día, que pasó al inicio (js/hoy.js).
   URL: azbuka-5.html · azbuka-5.html?m=u5m3
   ============================================================ */
const { useState, useEffect } = htmPreact;
const h = React.createElement;
const U = UNIDAD_5;
const EJ_U5 = ejerciciosUnidad5();
const EJ_U5_BASE = EJ_U5.filter(e => !e.ampliacion);
const D5 = u5Datos();
const OBJETIVO_U5 = LEXICON_COMER.filter(e => (e.introducedIn || []).indexOf(5) >= 0 || (e.appearsIn || []).indexOf(5) >= 0).map(e => e.id);
const AVISO_ACENTOS = "En Azbuka, los acentos (´) son solo una ayuda para leer: en ruso no se escriben, así que no hace falta que los pongas. La е vale por ё.";
const PERS6 = ["я", "ты", "он / она́", "мы", "вы", "они́"];
const verbosDe = g => Object.values(D5.verb).filter(v => v.grupo === g);

/* Dorso de las tarjetas: las seis formas de los verbos */
function detalleTarjeta(e) {
  const v = D5.verb[D5.sin(e.acento || e.ru)];
  if (v) return PERS6.map((p, i) => p + " " + v.f[i]).join(" · ");
  const s = D5.sust[D5.sin(e.acento || e.ru)];
  return s && s.nom !== s.acc ? "acusativo: " + s.acc : null;
}

/* Tarjetas de verbos: una por verbo, con sus seis formas en 2 × 3. Se tocan para escuchar. */
function TablaVerbos({ c, lista }) {
  const forma = (pr, f) => h("button", { key: pr, onClick: () => azHablarRu(f), lang: "ru",
    style: { textAlign: "left", padding: "7px 10px", borderRadius: 9, background: c.bg2, border: `1px solid ${c.border}`, color: c.text, fontFamily: "inherit", cursor: "pointer", minWidth: 0 } },
    h("div", { style: { fontSize: 10.5, fontWeight: 700, letterSpacing: .5, color: c.textMuted } }, pr), h("div", { style: { fontSize: 15.5, fontWeight: 700 } }, f));
  return h(React.Fragment, null,
    h("div", { className: "u-text", style: { fontSize: 13, marginTop: 8 } }, "Tocá una forma para escuchar cómo suena."),
    lista.map(v => h("div", { key: v.id, className: "u-card", style: { padding: "12px 14px", marginTop: 10 } },
      h("div", { style: { display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" } },
        h("span", { lang: "ru", style: { fontSize: 18, fontWeight: 800, color: c.gold } }, h(AzPalabra, { texto: v.ac, id: v.id })),
        h("span", { style: { fontSize: 13, color: c.textMuted } }, v.es)),
      h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginTop: 8 } },
        forma("я", v.f[0]), forma("мы", v.f[3]), forma("ты", v.f[1]), forma("вы", v.f[4]), forma("он / она́", v.f[2]), forma("они́", v.f[5])))));
}

/* Хоте́ть y мочь lado a lado (módulo 9): una fila por persona */
function TablaLado({ c, tipo }) {
  const a = D5.verb[D5.sin("хоте́ть")], b = D5.verb[D5.sin("мочь")];
  if (tipo !== "hm" || !a || !b) return null;
  return h(AzTablaGrupos, { encabezados: ["", "хоте́ть (querer)", "мочь (poder)"], c,
    filas: PERS6.map((p, i) => [{ ru: p, es: "" }, { ru: a.f[i], es: a.esF[[0, 1, 2, 3, 4, 4][i]] }, { ru: b.f[i], es: b.esF[[0, 1, 2, 3, 4, 4][i]] }]) });
}

/* Lecturas del módulo 10: texto tocable, audio (con ■) y traducción a pedido */
function Lectura({ L, c }) {
  const [es, setEs] = useState(false);
  const idx = azIndiceFormas();
  const lexDe = ru => (ru.match(/[А-Яа-яЁё\u0301]+/g) || []).map(w => { const r = idx.get(azFormaClave(w)); return r && r[0] ? r[0][0] : null; });
  return h("div", { className: "u-card", style: { padding: "14px 16px", marginTop: 12 } },
    h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
      h("div", { lang: "ru", style: { flex: 1, fontSize: 18, fontWeight: 800, color: c.gold } }, L.titulo),
      h("button", { className: "play", onClick: () => azHablarSecuencia(L.lineas.map(l => ({ texto: l[0] }))), "aria-label": "Escuchar el texto" }, "▶"),
      h("button", { className: "play", onClick: azCallar, "aria-label": "Detener el audio" }, "■")),
    L.lineas.map((l, k) => h("div", { key: k, style: { marginTop: 8, fontSize: 16.5, lineHeight: 1.5 } },
      h(AzTexto, { ru: l[0], lex: lexDe(l[0]), objetivo: OBJETIVO_U5 }),
      es && h("div", { style: { fontSize: 13, color: c.textMuted } }, l[1]))),
    h("button", { className: "ubtn sec", style: { marginTop: 12 }, onClick: () => setEs(!es) }, es ? "Ocultar la traducción" : "Ver la traducción"));
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [modId, setModId] = useState(() => new URLSearchParams(location.search).get("m"));
  const [tarjetas, setTarjetas] = useState(null);
  const [practica, setPractica] = useState(null);
  const [visto, setVisto] = useState(1);
  const [examen, setExamen] = useState(null);
  const [, refrescar] = useState(0);

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      setVisto(await azGet('az_u5_visto', 1));
      await azLoadProgress();
      azSaveUnitProgress(5, {});
      refrescar(x => x + 1);
    })();
    const pop = () => { setModId(new URLSearchParams(location.search).get("m")); setTarjetas(null); setPractica(null); };
    window.addEventListener("popstate", pop);
    return () => window.removeEventListener("popstate", pop);
  }, []);
  useEffect(() => {
    const m = modId ? unidad5Modulo(modId) : null;
    window.azFuenteActual = () => m ? "Unidad 5 · " + m.titulo : "Unidad 5";
    if (m && m.n > visto) { setVisto(m.n); azSet('az_u5_visto', m.n); }
    if (m) azGuardarUltimo({ unidad: 5, n: m.n, total: U.modulos.length, titulo: "Unidad 5 · " + m.titulo, href: "azbuka-5.html?m=" + m.id });
  }, [modId]);
  useEffect(() => { if (!practica && AZ_PROGRESS.units) setExamen((AZ_PROGRESS.units["5"] || {}).examen || null); }, [practica]);

  const abrirModulo = id => { history.pushState(null, "", id ? "?m=" + id : location.pathname); setModId(id); window.scrollTo(0, 0); };
  const practicarUnidad = () => setPractica({ titulo: "Unidad 5", pool: EJ_U5_BASE.filter(e => e.modulo <= Math.max(visto, 1)) });
  const practicarModulo = m => setPractica({ titulo: m.titulo, n: m.nPractica, pool: EJ_U5_BASE.filter(e => e.modulo === m.n) });
  const practicarAmpliacion = () => setPractica({ titulo: "Ampliación: más verbos", pool: EJ_U5.filter(e => e.ampliacion) });
  const rendirExamen = m => setPractica({ titulo: "Evaluación de la Unidad 5", pool: EJ_U5_BASE, examen: { intro: m.intro, partes: m.partes, aprobado: m.aprobado } });
  const reforzar = parte => setPractica({ titulo: "Reforzar: " + parte.nombre, pool: EJ_U5_BASE.filter(e => parte.tipos.indexOf(e.tipo) >= 0) });

  const c = azColors(darkMode);
  const green = darkMode ? "#4CAF82" : "#2E7D55";
  const mod = modId ? unidad5Modulo(modId) : null;
  const idx = mod ? U.modulos.indexOf(mod) : -1;
  const prev = mod && U.modulos[idx - 1], next = mod && U.modulos[idx + 1];
  const palabrasDom = OBJETIVO_U5.filter(id => azItem("lex:" + id).level === 2).length;
  const tabs = mod ? [
    { id: "u", icon: "⊞", aria: "Unidad", action: () => abrirModulo(null) },
    { id: "p", icon: "‹", aria: "Módulo anterior", disabled: !prev, action: () => prev && abrirModulo(prev.id) },
    { id: "m", texto: "Módulo " + mod.n },
    { id: "s", icon: "›", aria: "Módulo siguiente", disabled: !next, action: () => next && abrirModulo(next.id) }
  ] : azTabsUnidad(5);

  const portada = h(AzPortadaUnidad, { u: U, c, green, visto: Math.max(visto, 1), examen, onPracticar: practicarUnidad, onAbrir: abrirModulo,
    progreso: [{ label: "Palabras dominadas", valor: palabrasDom, total: OBJETIVO_U5.length }] });

  let vista = null;
  if (mod) {
    const nuevasM5 = LEXICON_COMER.filter(e => (e.introducedIn || []).indexOf(5) >= 0 && !D5.verb[D5.sin(e.acento || e.ru)] && !U5_DIA[e.acento] && e.acento !== "никогда́" && e.acento !== "до́ма").map(e => e.id);
    const ampV = verbosDe("a");
    vista = h("div", { key: mod.id, style: { animation: "fadeIn 0.3s ease", paddingTop: 18 } },
      h("div", { className: "u-kicker" }, "Unidad 5 · Módulo " + mod.n),
      h("h1", { className: "u-title" }, mod.titulo),
      h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(mod.intro)),
      mod.tipo === "leccion" && h(React.Fragment, null,
        /* Si una sección pide una tabla (tabla: "hm"), va justo debajo de esa sección */
        (() => {
          const partes = []; let desde = 0;
          mod.secciones.forEach((s, k) => { if (s.tabla) { partes.push(h(AzSecciones, { key: "s" + k, secciones: mod.secciones.slice(desde, k + 1) }), h(TablaLado, { key: "t" + k, c, tipo: s.tabla })); desde = k + 1; } });
          if (desde < mod.secciones.length) partes.push(h(AzSecciones, { key: "fin", secciones: mod.secciones.slice(desde) }));
          return partes;
        })(),
        mod.n === 1 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Чита́ть, en sus seis formas"), h(TablaVerbos, { c, lista: [D5.verb[D5.sin("чита́ть")]] })),
        mod.n === 2 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Los pronombres"),
          h(AzTablaGrupos, { encabezados: ["Singular", "Plural"], c, filas: [
            [{ ru: "я", es: "yo" }, { ru: "мы", es: "nosotros" }], [{ ru: "ты", es: "vos" }, { ru: "вы", es: "ustedes / usted" }],
            [{ ru: "он", es: "él" }, { ru: "они́", es: "ellos / ellas", filas: 2 }], [{ ru: "она́", es: "ella" }, false]] })),
        mod.grupo === 1 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Los verbos de la primera conjugación"), h(TablaVerbos, { c, lista: verbosDe(1) })),
        mod.grupo === 2 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Los verbos de la segunda conjugación"), h(TablaVerbos, { c, lista: verbosDe(2) })),
        mod.grupo === "e" && h(React.Fragment, null, h("div", { className: "u-sec" }, "Los verbos especiales"), h(TablaVerbos, { c, lista: verbosDe("e") })),
        mod.n === 5 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Palabras nuevas (" + nuevasM5.length + ")"), h(AzVocabulario, { ids: nuevasM5, c }),
          h("button", { className: "ubtn", onClick: () => setTarjetas({ ids: OBJETIVO_U5.filter(id => (lexComerById(id).introducedIn || []).indexOf(5) >= 0 && !ampV.some(v => v.id === id)), titulo: "Palabras nuevas de la unidad" }) }, "Tarjetas: palabras nuevas")),
        h("button", { className: "ubtn", style: { marginTop: 22 }, onClick: () => practicarModulo(mod) }, "Practicar este módulo"),
        mod.n === 5 && ampV.length > 0 && h("div", { style: { marginTop: 28, paddingTop: 6, borderTop: `1px solid ${c.border}` } },
          h("div", { className: "u-sec" }, "Ampliación · opcional"),
          h("p", { className: "u-text", style: { fontSize: 14.5 } }, "Más verbos que siguen los mismos modelos, para quien quiera sumar vocabulario. Es opcional: no entra en la práctica de la unidad ni en la evaluación."),
          h(TablaVerbos, { c, lista: ampV }),
          h("button", { className: "ubtn", onClick: () => setTarjetas({ ids: ampV.map(v => v.id), titulo: "Ampliación: más verbos" }) }, "Tarjetas (" + ampV.length + ")"),
          h("button", { className: "ubtn sec", style: { marginTop: 10 }, onClick: practicarAmpliacion }, "Practicar la ampliación"))),
      mod.tipo === "lectura" && h(React.Fragment, null,
        U5_LECTURAS.map(L => h(Lectura, { key: L.id, L, c })),
        h("button", { className: "ubtn", style: { marginTop: 18 }, onClick: () => practicarModulo(mod) }, "Practicar «Mi día»")),
      mod.tipo === "proyecto" && h(AzProyecto, { mod, c, green, clave: "az_u5_proyecto", fuente: { titulo: "Unidad 5 · Мой день", href: "azbuka-5.html?m=u5m11" }, aviso: AVISO_ACENTOS }),
      mod.tipo === "examen" && h(React.Fragment, null,
        h("div", { className: "u-card", style: { padding: "6px 16px", marginTop: 16 } }, mod.partes.map((p, k) =>
          h("div", { key: p.nombre, style: { display: "flex", justifyContent: "space-between", padding: "10px 0", borderTop: k ? `1px solid ${c.border}` : "none", fontSize: 14.5 } },
            h("span", { style: { fontWeight: 600 } }, p.nombre), h("span", { style: { color: c.textMuted } }, p.n + " ejercicios")))),
        examen && h("div", { style: { marginTop: 14, fontSize: 14, color: examen.aprobado ? green : "#E2884A", fontWeight: 700 } },
          "Última vez: " + examen.pct + " % (" + examen.fecha.split("-").reverse().join("/") + ")" + (examen.aprobado ? " · aprobada" : "")),
        h("button", { className: "ubtn", onClick: () => rendirExamen(mod) }, examen ? "Rendir de nuevo" : "Empezar la evaluación")),
      next && h("button", { className: "ubtn sec", style: { marginTop: 22 }, onClick: () => abrirModulo(next.id) }, "Siguiente: " + next.titulo));
  }

  return h(React.Fragment, null,
    h(AzEstilosUnidad, { c, green }),
    h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs }, mod ? vista : portada),
    practica && h(AzPractica, { key: practica.titulo + (practica.pool[0] || {}).id, unidad: 5, titulo: practica.titulo, pool: practica.pool, mezcla: U5_MEZCLA,
      n: azNPractica(practica.pool, practica.n), dark: darkMode, aviso: AVISO_ACENTOS, examen: practica.examen, onReforzar: reforzar, objetivo: OBJETIVO_U5,
      onSalir: () => { setPractica(null); refrescar(x => x + 1); } }),
    tarjetas && h(AzTarjetasPalabras, { ids: tarjetas.ids, titulo: tarjetas.titulo, c, green, detalle: detalleTarjeta, onClose: () => { setTarjetas(null); refrescar(x => x + 1); } }),
    h(AzBurbujaHost, { dark: darkMode }));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
