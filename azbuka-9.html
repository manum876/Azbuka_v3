function detalleTarjeta(e) {
  const v = verboById(e.id);
  if (v && v.futuro) return "futuro: " + v.futuro.slice(0, 3).join(", ") + "…";
  return v && v.presente ? PERS6.map((p, i) => p + " " + v.presente[i]).join(" · ") : null;
}

/* Pregunta abierta (módulo 8): se contesta libre y la app revisa el futuro */
function PreguntaAbierta({ c, green }) {
  const lista = U9_PREGUNTAS.filter(q => /де́лать|пое́дешь|бу́дешь за́втра/.test(q[0]));
  const [k, setK] = useState(() => Math.floor(Math.random() * lista.length));
  const [txt, setTxt] = useState("");
  const [res, setRes] = useState(null);
  const q = lista[k % lista.length];
  const K = w => azFormaClave(w);
  const revisar = () => {
    const w = (txt.match(/[А-Яа-яЁё\u0301-]+/g) || []).map(K);
    const BUDU = ["буду", "будешь", "будет", "будем", "будете", "будут"], MOV1 = ["пойду", "поеду"];
    const fut = w.find(x => BUDU.indexOf(x) >= 0 || /^(пойд|поед)/.test(x));
    const tips = [].concat(...U.modulos.find(m => m.id === "u9m12").consejos.map(x => x.fn(txt)));
    if (!fut) return setRes({ nivel: "mal", msg: "Contestá en futuro: бу́ду + infinitivo, o пойду́ / пое́ду.", tips });
    if (fut !== "буду" && MOV1.indexOf(fut) < 0) return setRes({ nivel: "casi", msg: "Hablás de vos: va **бу́ду** (o пойду́ / пое́ду), no «" + fut + "».", tips });
    setRes({ nivel: tips.length ? "casi" : "bien", msg: tips.length ? "Casi: mirá el detalle de abajo." : "Bien: es futuro.", tips });
  };
  return h("div", { className: "u-card", style: { padding: 16, marginTop: 14 } },
    h("div", { className: "u-kicker", style: { marginBottom: 6 } }, "Contestá con tus palabras"),
    h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
      h("div", { lang: "ru", style: { flex: 1, fontSize: 17, fontWeight: 700 } }, "— " + q[0]),
      h("button", { className: "play", onClick: () => azHablarRu(q[0]), "aria-label": "Escuchar" }, "▶")),
    h("div", { style: { fontSize: 12.5, color: c.textMuted, marginTop: 2 } }, q[1]),
    h("input", { className: "pr-input", lang: "ru", value: txt, placeholder: "Contestá en ruso…", onInput: e => { setTxt(e.target.value); setRes(null); },
      autocapitalize: "off", autocorrect: "off", spellcheck: false, autocomplete: "off",
      style: { width: "100%", boxSizing: "border-box", marginTop: 10, background: c.bg3, border: `1px solid ${c.border}`, borderRadius: 10, padding: "11px 12px", color: c.text, fontSize: 16, fontFamily: "inherit" } }),
    h("button", { className: "ubtn", style: { marginTop: 10 }, disabled: !txt.trim(), onClick: revisar }, "Revisar"),
    res && h("div", { style: { marginTop: 10, fontSize: 14, lineHeight: 1.5 } },
      h("div", { style: { fontWeight: 800, color: { bien: green, casi: "#C9B369", mal: "#D9776F" }[res.nivel] } }, { bien: "✓ Bien", casi: "≈ Casi", mal: "✗ Mal" }[res.nivel]),
      h("div", null, azFmt(res.msg)),
      res.tips.map((t, i) => h("div", { key: i, className: "u-truco" }, azFmt(t)))),
    h("button", { className: "ubtn sec", style: { marginTop: 12 }, onClick: () => { setK(k + 1); setTxt(""); setRes(null); } }, "Otra pregunta"));
}

  const [darkMode, setDarkMode] = useState(true);
  const [modId, setModId] = useState(() => new URLSearchParams(location.search).get("m"));
  const [tarjetas, setTarjetas] = useState(null);
  const [practica, setPractica] = useState(null);
  const [visto, setVisto] = useState(1);
  const [examen, setExamen] = useState(null);
  const [, refrescar] = useState(0);

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      setVisto(await azGet('az_u9_visto', 1));
      await azLoadProgress();
      azSaveUnitProgress(9, {});
      refrescar(x => x + 1);
    })();
    const pop = () => { setModId(new URLSearchParams(location.search).get("m")); setTarjetas(null); setPractica(null); };
    window.addEventListener("popstate", pop);
    return () => window.removeEventListener("popstate", pop);
  }, []);
  useEffect(() => {
    const m = modId ? unidad9Modulo(modId) : null;
    window.azFuenteActual = () => m ? "Unidad 9 · " + m.titulo : "Unidad 9";
    if (m && m.n > visto) { setVisto(m.n); azSet('az_u9_visto', m.n); }
    if (m) azGuardarUltimo({ unidad: 9, n: m.n, total: U.modulos.length, titulo: "Unidad 9 · " + m.titulo, href: "azbuka-9.html?m=" + m.id });
  }, [modId]);
  useEffect(() => { if (!practica && AZ_PROGRESS.units) setExamen((AZ_PROGRESS.units["9"] || {}).examen || null); }, [practica]);

  const abrirModulo = id => { history.pushState(null, "", id ? "?m=" + id : location.pathname); setModId(id); window.scrollTo(0, 0); };
  const practicarUnidad = () => setPractica({ titulo: "Unidad 9", pool: EJ_U9_BASE.filter(e => e.modulo <= Math.max(visto, 1)) });
  const practicarModulo = m => setPractica({ titulo: m.titulo, n: m.nPractica, pool: EJ_U9_BASE.filter(e => e.modulo === m.n) });
  const practicarAmpliacion = () => setPractica({ titulo: "Ampliación: посеща́ть", pool: EJ_U9.filter(e => e.ampliacion) });

  let vista = null;
  if (mod) {
    const ids = l => l.map(ru => (LEXICON_COMER.find(e => e.acento === ru) || {}).id).filter(Boolean);
    const seis = (titulo, es, f) => ({ titulo, es, f });
    const vI = ru => { const v = D9.verb[D9.sin(ru)]; return v && seis(v.ac, { "хоте́ть": "querer", "плани́ровать": "planear", "собира́ться": "tener pensado", "мечта́ть": "soñar con" }[ru], v.presente); };

      h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(mod.intro)),
      mod.tipo === "leccion" && h(React.Fragment, null,
        h(AzSecciones, { secciones: mod.secciones }),
        mod.n === 2 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Las formas"), h(TablaSeis, { c, lista: [seis("бу́ду", "voy a…", D9.budu)] })),
        mod.n === 5 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Cuándo"), h(AzTablaGrupos, { encabezados: ["En ruso"], c, filas: U9_TIEMPO.map(([r, e]) => [{ ru: r, es: e }]) })),
        mod.n === 6 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Los verbos de intención"), h(TablaSeis, { c, lista: ["хоте́ть", "плани́ровать", "собира́ться", "мечта́ть"].map(vI) })),
        mod.n === 7 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Voy a ir"), h(TablaSeis, { c, lista: [seis("пойду́", "voy a ir (a pie)", D9.poidu), seis("пое́ду", "voy a ir (en vehículo)", D9.poedu)] })),
        mod.n === 8 && h(PreguntaAbierta, { c, green }),
        mod.n === 9 && h(React.Fragment, null, h("div", { className: "u-sec" }, "La semana de Ana"), h(AgendaAna, { c })),
        mod.n === 10 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Palabras del viaje"), h(AzVocabulario, { c, ids: ids(["пое́здка", "путеше́ствие", "биле́т", "по́езд", "самолёт", "гости́ница", "страна́", "о́тпуск"]) })),
        h("button", { className: "ubtn", style: { marginTop: 22 }, onClick: () => practicarModulo(mod) }, "Practicar este módulo"),
        mod.n === 10 && ampIds.length > 0 && h("div", { style: { marginTop: 28, paddingTop: 6, borderTop: `1px solid ${c.border}` } },
          h("div", { className: "u-sec" }, "Ampliación · opcional"),

        h("div", { className: "u-sec", style: { marginTop: 28 } }, "3. " + U9_PROYECTO2.titulo),
        h("p", { className: "u-text" }, azFmt(U9_PROYECTO2.intro)),
        h(AzProyecto, { mod: U9_PROYECTO2, c, green, clave: "az_u9_proyecto2", fuente: { titulo: "Unidad 9 · Вчера́, сего́дня, за́втра", href: "azbuka-9.html?m=u9m12" }, aviso: AVISO_ACENTOS })),
      mod.tipo === "examen" && h(React.Fragment, null,
        h("div", { className: "u-card", style: { padding: "6px 16px", marginTop: 16 } }, mod.partes.map((p, k) =>
          h("div", { key: p.nombre, style: { display: "flex", justifyContent: "space-between", padding: "10px 0", borderTop: k ? `1px solid ${c.border}` : "none", fontSize: 14.5 } },

    practica && h(AzPractica, { key: practica.titulo + (practica.pool[0] || {}).id, unidad: 9, titulo: practica.titulo, pool: practica.pool, mezcla: U9_MEZCLA,
