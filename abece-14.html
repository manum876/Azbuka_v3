/* ============================================================
   ABECE-14.HTML — Abecé · Итоговый экзамен (Unidad 14), 20/11/2026.

   unidades, que la página carga.
   Lo que sigue es la cabecera de azbuka-14.html:
   ------------------------------------------------------------
   AZBUKA-14.HTML — Examen final (Unidad 14)
   ------------------------------------------------------------
   06/10/2026. Seis bloques (100 puntos) que se hacen por separado y
   se guardan en az_examen_final; el puntaje final aparece cuando
   están los seis. Se aprueba con 80 → pantalla «Ты говори́шь
   по-ру́сски». En el examen, «Se entiende» vale medio punto.
   12/10/2026: Gramática, Vocabulario y Audio sortean sus preguntas en
   cada intento (u14Intento) y cada pregunta dice qué regla evalúa; al
   terminar un bloque, «Qué repasar» lista las reglas falladas y las
   abre en una hoja (carga la unidad con u14CargarRegla).
   URL: azbuka-14.html · azbuka-14.html?b=lectura
   ============================================================ */
const { useState, useEffect } = htmPreact;
const h = React.createElement;
const ES_OK = AZ_DIRECCION.id === "abece" && typeof ejerciciosExamenFinalEs === "function";
const B = ES_OK ? ejerciciosExamenFinalEs() : {};
const ESC = ES_OK ? ES14_ESCRITURA() : {};
const U14_BLOQUES = typeof ES14_BLOQUES !== "undefined" ? ES14_BLOQUES : [];
const U14_NIVELES = typeof ES14_NIVELES !== "undefined" ? ES14_NIVELES : [];
const AVISO_ACENTOS = "В испанском знак ударения (´) — часть написания: если его забыть, ответ засчитывается как «Почти». Перевёрнутые знаки ¿ и ¡ не обязательны.";
const CLAVE = "az_es_examen_final";
const APROBADO = 80;

function azBallov(n) { n = Math.round(n); const d = n % 10, c = n % 100; return d === 1 && c !== 11 ? "балл" : d >= 2 && d <= 4 && (c < 12 || c > 14) ? "балла" : "баллов"; }
function nivelDe(p) { return U14_NIVELES.find(n => p >= n[0]); }
function puntosDe(est, b) { const x = (est.bloques || {})[b.id]; return x ? Math.round(x.pct * b.puntos / 100 * 10) / 10 : null; }

/* Escritura: una tarea (elegir opción si hay, escribir, entregar) */
function Tarea({ t, id, est, guardar, c, green }) {
  const prev = (est.escritura || {})[id] || {};
  const [op, setOp] = useState(prev.op || null);
  const [txt, setTxt] = useState(prev.txt || "");
  const [res, setRes] = useState(prev.pct != null ? es14PuntuarTexto(prev.txt, t) : null);
  const n = azContarPalabras(txt), [a, b] = t.palabras;
  const entregar = () => { const r = es14PuntuarTexto(txt, t); setRes(r); guardar(id, { op, txt, pct: r.pct }); };
  return h("div", { className: "u-card", style: { padding: "14px 16px", marginTop: 12 } },
    h("div", { style: { fontWeight: 800, fontSize: "var(--az-fs-destacado)" } }, t.titulo + " · " + t.puntos + " " + azBallov(t.puntos)),
    t.consigna && h("p", { className: "u-text", style: { fontSize: "var(--az-fs-cuerpo)", marginTop: 8 } }, azFmt(t.consigna)),

    (!t.opciones || op) && h(React.Fragment, null,

      h("div", { style: { fontSize: "var(--az-fs-chico)", marginTop: 8, fontWeight: 700, color: n >= a && n <= b ? green : c.textMuted } }, n + " слов · цель: " + a + "–" + b),
      h("div", { style: { marginTop: 8 } }, t.objetivos.map((o, i) => { const v = o.fn(txt), ok = v >= o.meta;
        return h("div", { key: i, className: "req" }, h("span", { style: { color: ok ? green : c.textMuted, fontWeight: 800 } }, ok ? "✓" : "○"), h("span", { style: { color: ok ? c.text : c.textSub } }, o.txt)); })),
      h("button", { className: "ubtn", disabled: !txt.trim(), onClick: entregar }, prev.pct != null ? "Сдать ещё раз" : "Сдать"),
      res && h("div", { className: "u-card", style: { padding: "12px 16px", marginTop: 12 } },
        h("div", { style: { fontWeight: 800, fontSize: "var(--az-fs-destacado)", color: green } }, res.pct + " % · " + Math.round(res.pct * t.puntos / 10) / 10 + " из " + t.puntos + " " + azBallov(t.puntos)),
        h("div", { style: { fontSize: "var(--az-fs-chico)", marginTop: 8, color: c.textSub } }, "Выполнено пунктов: " + Math.round(res.cobertura * 100) + " %" + (res.descuento ? " · минус за ошибки: " + Math.round(res.descuento * 100) + " %" : "")),
        res.rev.dudas.map((x, i) => h("div", { key: "d" + i, className: "u-truco", lang: "es" }, "«" + x.t + "» — такого слова нет в словаре" + (x.sugerencia ? ". Может быть, «" + x.sugerencia + "»?" : "."))),
        res.rev.tips.map((x, i) => h("div", { key: "t" + i, className: "u-truco" }, azFmt(x))),
        h("div", { style: { fontSize: "var(--az-fs-nota)", color: c.textMuted, marginTop: 8, lineHeight: 1.5 } }, "Оценка приблизительная: она проверяет, есть ли в тексте все пункты, и снимает баллы за несуществующие слова и типичные ошибки, но не исправляет всю грамматику."))));
}

/* «Что повторить»: las reglas y palabras falladas, cada regla abre su sección */
function QueRepasar({ fallos, c, onRegla, titulo }) {
  const [todas, setTodas] = useState(false);
  const R = es14Reglas(), orden = Object.keys(R).sort((a, b) => R[a][0] - R[b][0] || R[a][1] - R[b][1]);
  const reglas = (fallos.reglas || []).filter(id => R[id]).sort((a, b) => orden.indexOf(a) - orden.indexOf(b)), pal = fallos.palabras || [];
  if (!reglas.length && !pal.length) return null;
  const MAX = 8, ver = todas ? reglas : reglas.slice(0, MAX);
  return h(React.Fragment, null,
    h("div", { className: "u-sec" }, titulo || "Что повторить"),
    reglas.length > 0 && h("div", { style: { fontSize: "var(--az-fs-chico)", color: c.textSub, margin: "-4px 0 12px", lineHeight: 1.5 } }, "Правила по вопросам с неверным ответом, в порядке курса. Нажми на правило, чтобы прочитать его."),
    ver.map(id => { const r = R[id];
      return h("div", { key: id, className: "u-card mod", role: "button", tabIndex: 0, onClick: () => onRegla(id), onKeyDown: e => { if (e.key === "Enter") onRegla(id); } },
        h("div", { className: "mod-n" }, "📖"),
        h("div", { style: { flex: 1, minWidth: 0 } },
          h("div", { className: "mod-t" }, azFmt(r[3])),
          h("div", { className: "mod-d" }, "Урок " + r[0] + " · ", azFmt(r[2])))); }),
    reglas.length > MAX && h("button", { className: "ubtn sec", style: { marginTop: 0 }, onClick: () => setTodas(!todas) }, todas ? "Показать меньше" : "Показать все (" + reglas.length + ")"),
    pal.length > 0 && h("div", { className: "u-card", style: { padding: "12px 16px" } },
      h("div", { style: { fontSize: "var(--az-fs-chico)", fontWeight: 700, color: c.textMuted } }, "Слова, которые стоит повторить"),
      h("div", { lang: "es", style: { fontSize: "var(--az-fs-destacado)", marginTop: 8, lineHeight: 1.6, color: c.text } }, pal.join(" · "))));
}
function juntarFallos(est) {
  const reglas = [], palabras = [];
  U14_BLOQUES.forEach(b => { const f = ((est.bloques || {})[b.id] || {}).fallos; if (!f) return;
    (f.reglas || []).forEach(x => { if (reglas.indexOf(x) < 0) reglas.push(x); }); (f.palabras || []).forEach(x => { if (palabras.indexOf(x) < 0) palabras.push(x); }); });
  return { reglas, palabras };
}

}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [bId, setBId] = useState(() => new URLSearchParams(location.search).get("b"));

  const abrirRegla = id => { if (typeof azRegla === "function" && azRegla(id)) setHoja(id); else { const r = es14Reglas()[id]; if (r) location.href = "abece-" + r[0] + ".html?m=es" + r[0] + "m" + r[1]; } };

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      setEst(Object.assign({ bloques: {}, escritura: {} }, await azGet(CLAVE, {})));
      await azLoadProgress();
    })();

    return () => window.removeEventListener("popstate", pop);
  }, []);
  useEffect(() => { window.azFuenteActual = () => "Итоговый экзамен"; }, []);

  const hechos = U14_BLOQUES.filter(b => est.bloques[b.id]);
  const total = Math.round(hechos.reduce((a, b) => a + puntosDe(est, b), 0));
  const completo = hechos.length === U14_BLOQUES.length;
  const guardarEst = nuevo => {
    setEst(nuevo); azSet(CLAVE, nuevo);
    const todos = U14_BLOQUES.every(b => nuevo.bloques[b.id]);
    if (todos) {
      const tot = Math.round(U14_BLOQUES.reduce((a, b) => a + puntosDe(nuevo, b), 0));
      const u = azUnitProgress(14);   /* Abecé: units["es14"] (azUnidadClave) */ u.examen = { pct: tot, aprobado: tot >= APROBADO, fecha: new Date().toISOString().slice(0, 10) };
      if (!u.mejorExamen || tot > u.mejorExamen) u.mejorExamen = tot; azSaveProgress();
      if (tot >= APROBADO) setTimeout(() => setFinal(true), 400);
    }
  };
  const guardarBloque = (id, pct, fallos) => guardarEst(Object.assign({}, est, { bloques: Object.assign({}, est.bloques, { [id]: Object.assign({ pct, fecha: new Date().toISOString().slice(0, 10) }, fallos ? { fallos } : {}) }) }));
  const guardarTarea = (tid, datos) => {
    const esc = Object.assign({}, est.escritura, { [tid]: datos });

    if (esc.t1 && esc.t1.pct != null && esc.t2 && esc.t2.pct != null) {

    }

  const onFin = (id, pool) => lista => {
    const ej = e => pool.find(x => x.id === e.id) || {};

    const tot = lista.reduce((a, e) => a + peso(e), 0), sum = lista.reduce((a, e) => a + e.p * peso(e), 0);

      if (x.regla && fallos.reglas.indexOf(x.regla) < 0) fallos.reglas.push(x.regla);
      if (x.palabra && fallos.palabras.indexOf(x.palabra) < 0) fallos.palabras.push(x.palabra); });

  ] : azTabsUnidad(14);

  const nv = nivelDe(total);
  const portada = h("div", { style: { animation: "fadeIn var(--az-t-media) var(--az-curva)", paddingTop: 16 } },
    h("div", { className: "u-kicker" }, "Урок 14"),

    h("div", { className: "u-card", style: { padding: "14px 16px", marginTop: 16 } },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline" } },
        h("span", { style: { fontSize: "var(--az-fs-chico)", fontWeight: 700, color: c.text } }, completo ? "Итоговый результат" : "Пройдено частей: " + hechos.length + " из 6"),

      h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(b.intro)),
      h("div", { style: { fontSize: "var(--az-fs-chico)", color: c.textMuted, marginTop: 8 } }, "Примерное время: " + b.min),
      p != null && h("div", { style: { marginTop: 12, fontSize: "var(--az-fs-chico)", fontWeight: 700, color: green } }, "Пройдено: " + p + " из " + b.puntos + " " + azBallov(b.puntos) + " (" + est.bloques[b.id].fecha.split("-").reverse().join(".") + ")"),
      b.id === "escritura"
        ? h(React.Fragment, null, h("div", { className: "u-dest" }, AVISO_ACENTOS),
            h(Tarea, { t: ESC.t1, id: "t1", est, guardar: guardarTarea, c, green }), h(Tarea, { t: ESC.t2, id: "t2", est, guardar: guardarTarea, c, green }))
        : h("button", { className: "ubtn", onClick: () => setPractica({ id: b.id, pool: es14Intento(b.id, Date.now() % 233279 + 1) }) }, p != null ? "Пройти ещё раз" : "Начать"),
      p != null && est.bloques[b.id].fallos && h(QueRepasar, { fallos: est.bloques[b.id].fallos, c, onRegla: abrirRegla }),
      next && h("button", { className: "ubtn sec", style: { marginTop: 24 }, onClick: () => abrir(next.id) }, "Дальше: " + next.ru));
  }

  return h(React.Fragment, null,
    h(AzEstilosUnidad, { c, green }),
    h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs }, b ? vista : portada),
    practica && h(AzPractica, { key: practica.id, unidad: 14, titulo: U14_BLOQUES.find(x => x.id === practica.id).ru, pool: practica.pool, enOrden: true, n: practica.pool.length, dark: darkMode,
      aviso: AVISO_ACENTOS + " Это экзамен: каждый ответ засчитывается один раз, без «Попробовать ещё раз».", entiende: "medio", onFin: onFin(practica.id, practica.pool), onSalir: () => setPractica(null) }),
    final && h(Final, { total, c, onCerrar: () => setFinal(false) }),
    hoja && h(AzHojaRegla, { id: hoja, c, volver: "Вернуться к экзамену", onClose: () => setHoja(null) }),
    h(AzBurbujaHost, { dark: darkMode }));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
