const GEN_RU = { m: "мужской род", f: "женский род", "m/f": "мужской и женский род" };
const K_RU = typeof AZ_FES_K !== "undefined" ? AZ_FES_K : {};

/* Plural ruso (el mismo de ficha.html): 1 слово, 2 слова, 5 слов */
function pluralRu(n, uno, pocos, muchos) {
  const d = n % 10, c = n % 100;
  return d === 1 && c !== 11 ? uno : d >= 2 && d <= 4 && (c < 12 || c > 14) ? pocos : muchos;
}
function getParam(k) { return new URLSearchParams(window.location.search).get(k); }
const FORMA_BUSCADA = (getParam("f") || "").trim().toLowerCase();
const mismaForma = (a, b) => !!a && !!b && (a.toLowerCase() === b || azNormEs(a) === azNormEs(b));

/* Una entrada «tiene formas» si cambia (no las invariables sin nota) */
function tieneFormas(id) {
  const d = typeof FORMAS_ES !== "undefined" ? FORMAS_ES[id] : null;
  return !!d && !(d.inv && d.t !== "sust" && !d.nota);
}
function lexEs(id) { return typeof LEXICON_ES !== "undefined" ? LEXICON_ES.find(e => e.id === id) : null; }

/* Pantalla ancha: las tablas entran enteras (mismo corte que Casos). */
function useWide() {
  const q = "(min-width: 640px)";
  const [wide, setWide] = useState(() => window.matchMedia(q).matches);
  useEffect(() => {
    const m = window.matchMedia(q);
    const f = () => setWide(m.matches);
    m.addEventListener ? m.addEventListener("change", f) : m.addListener(f);
    return () => { m.removeEventListener ? m.removeEventListener("change", f) : m.removeListener(f); };
  }, []);
  return wide;
}

/* ── Celdas ──────────────────────────────────────────────────
   Una celda puede tener varias formas separadas por « · » (le · se):
   cada una en su renglón, y cada una suena al tocarla. El artículo
   va delante en gris (la canción). hit = resaltada. */
function Celda({ text, art, hit }) {
  if (!text) return h("span", { className: "f-none" }, "—");
  const partes = String(text).split(" · ");
  return h("div", null, partes.map((p, i) => {
    const marcada = hit === true || (FORMA_BUSCADA && mismaForma(p.replace(/^con /, ""), FORMA_BUSCADA));
    const dicho = (art ? art + " " : "") + p;
    return h("div", { key: i, className: "f-cell" + (marcada ? " f-hit" : ""), onClick: () => azHablarEs(dicho) },
      h("span", { className: "f-ru" }, art && h("span", { className: "f-art" }, art + " "), p),
      h("span", { className: "f-play" }, "▶"));
  }));
}

    ];
  } else {
    const ant = caps[i - 1], sig = caps[i + 1];
    cuerpo = [
      h("button", { key: "b", className: "help-chip gback", onClick: () => setCap(null) }, "‹ Оглавление"),

      h("div", { key: "s", className: "sheet-sub" }, k.sub),

        h("button", { className: "pair-btn", onClick: () => setShowTr(!showTr),
          style: showTr ? { background: c.gold + "22", border: `1px solid ${c.gold}`, color: c.gold } : { background: c.bg2, border: `1px solid ${c.border}`, color: c.textMuted } }, "Перевод")),
      h("div", { key: "c" }, k.bloques.map((b, n) => h(GuiaBloque, { key: cap + n, b, showTr }))),
      h("div", { key: "n", className: "gnav" },
        ant ? h("button", { className: "pair-btn gnav-b", onClick: () => setCap(ant.id) }, "‹ " + ant.titulo) : h("span"),
        sig ? h("button", { className: "pair-btn gnav-b gnav-sig", onClick: () => setCap(sig.id) }, sig.titulo + " ›")
            : h("button", { className: "pair-btn gnav-b gnav-sig", onClick: () => setCap(null) }, "К оглавлению"))

  return h("div", { className: "sheet", role: "dialog", "aria-modal": "true", ref },

    h("div", { className: "sheet-in" }, cuerpo));
}
/* Capítulos de la guía que tocan una palabra (botones «?» de la ficha) */
function capitulosDe(d) {
  const ids = d.t === "sust" ? ["articulo", "genero"] : (d.t === "adj" || ((d.t === "det" || d.t === "num") && (d.m || d.mpl))) ? ["concordancia"]
    : (d.t === "art" || d.t === "contr") ? ["articulo"] : d.serie === "personal" ? ["pronombres", "gustar"] : [];
  return HAY_GUIA ? ids.map(gramaticaEsGuia).filter(Boolean) : [];
}

/* Qué resaltar en la tabla de serie de una entrada */
function resaltarDe(d) {
  if (d.serie === "personal") {
    return { filas: new Set(d.celdas.map(x => x[0])), celdas: new Set(d.celdas.map(x => x[0] + "|" + x[1])) };
  }
  if (d.neutro) return { filas: new Set([d.fila]), col: "n" };
  if (d.t === "art") return { filas: new Set([d.fila]), todaFila: true };
  return { filas: new Set([d.fila]), tipo: d.serie === "posesivo" ? d.tipo : null, col: null, todaFila: true };
}

function FichaGram({ id, c, onGuia }) {
  const e = lexEs(id);
  const d = e ? FORMAS_ES[id] : null;
  if (!e || !d) {
    return h("div", { style: { textAlign: "center", padding: "10vh 0" } },
      h("h1", { style: { fontSize: 18, marginBottom: 8, color: c.text } }, "Слово не найдено"),
      h("p", { style: { fontSize: 13.5, color: c.textMuted } }, e ? "«" + e.es + "» не меняет форму." : "Нет слова с id «" + id + "»."));
  }
  const pos = e.posNormalized;
  const fem = d.t === "sust" && d.f;
  const badge = (POS_RU[pos] || pos) + (pos === "sustantivo" && e.gender ? " · " + GEN_RU[fem ? "m" : e.gender] : "");
  const tags = [];
  if (d.soloPl) tags.push("Только мн. ч.");
  if (d.t === "sust" && !d.pl && !d.soloPl) tags.push("Только ед. ч.");
  if (d.inv && d.t === "sust") tags.push("Мн. ч. не меняется");
  if (d.invG) tags.push("Одинаково в м. и ж. р.");
  if (d.inv && d.t !== "sust") tags.push("Не меняется");
  /* La forma buscada (?f=): de dónde viene */
  let buscada = null;
  if (FORMA_BUSCADA && typeof formasEsLista === "function") {
    const x = formasEsLista(id).filter(y => mismaForma(y.f, FORMA_BUSCADA))[0];
    if (x && azNormEs(x.f) !== azNormEs(e.es)) buscada = x;
  }
  const notas = notasPalabra(d, e.es);
  let tabla;
  if (d.serie) {
    const s = SERIES_UI[d.serie];
    tabla = h("div", null,
      h(SerieTabla, { serie: d.serie, c, resaltar: resaltarDe(d) }),
      d.serie === "personal" && h("div", { className: "nota" }, h("b", null, "Функция: "), d.celdas.map(([f, k], i) =>
        h("span", { key: i }, i ? "; " : "", (FORMAS_ES_SERIES.personal.cols.find(x => x[0] === k) || [k, k])[1] + " — " + FORMAS_ES_SERIES.personal.filas.find(x => x[0] === f)[1]))),
      d.serie === "personal" && d.celdas.some(([f, k]) => /^(3|us|uds)/.test(f) && (k === "od" || k === "oi")) && h("div", { className: "nota" }, FORMAS_ES_SERIES.personal.nota),
      h("div", { className: "help-row" }, h("a", { className: "help-chip", href: "gramatica.html?tabla=" + d.serie, onClick: ev => azNavigate(ev, "gramatica.html?tabla=" + d.serie) }, s.titulo, h("span", null, "›"))));
  } else if (d.t === "sust" || d.m || d.mpl) tabla = h(TablaPalabra, { d, c });
  return h("div", { style: { animation: "fadeIn 0.3s ease" } },
    h("div", { className: "ficha" },
      h("div", { className: "hero" },
        h("div", { className: "hero-top" },
          h("div", { style: { minWidth: 0 } },
            h("div", { className: "ru" }, e.es),
            e.translit && h("div", { className: "translit az-tl" }, e.translit),
            e.ipa && h("div", { className: "ipa" }, "IPA: /" + e.ipa + "/")),
          h("button", { className: "play", onClick: () => azHablarEs(e.es), "aria-label": "Произношение" }, "▶")),
        h("span", { className: "pos-badge" }, badge),
        tags.length > 0 && h("div", { className: "tags" }, tags.map((t, i) => h("span", { key: i, className: "tag" }, t)))),
      h("div", { className: "fbody" },
        h("div", { className: "section-lbl" }, "Значения"),
        (e.senses || []).map((s, i) => h("div", { key: i, className: "sense" },
          h("span", { className: "sense-num" }, i + 1),
          h("span", { className: "sense-es" }, s.ru),
          s.definitionRu && h("div", { className: "sense-def" }, s.definitionRu))),
        h("div", { className: "section-lbl", style: { marginTop: 22 } }, "Формы"),
        buscada && h("div", { className: "busco" }, h("b", null, buscada.f), " — " + (K_RU[buscada.k] || "форма") + " от ", h("b", null, e.es), ". Выделено в таблице."),
        tabla,
        notas.map((n, i) => h("div", { key: i, className: "nota" }, n)),
        capitulosDe(d).length > 0 && h("div", { className: "help-row" }, capitulosDe(d).map(k =>
          h("button", { key: k.id, className: "help-chip", onClick: () => onGuia(k.id) }, k.titulo, h("span", null, "?")))),
        h("div", { className: "buttons" },
          h("a", { className: "btn pr", href: "ficha.html?id=" + id, onClick: ev => azNavigate(ev, "ficha.html?id=" + id) }, "📖 В словаре"),
          h("button", { className: "btn", onClick: () => azHablarEs(e.es) }, "▶ Произношение")))));
}

function TablaPagina({ serie, c }) {
  const ui = SERIES_UI[serie];
  if (!ui) return h("div", { style: { textAlign: "center", padding: "10vh 0", color: c.textMuted } }, "Таблица не найдена");

        h("a", { key: k, className: "help-chip", href: "gramatica.html?tabla=" + k, onClick: ev => azNavigate(ev, "gramatica.html?tabla=" + k) }, SERIES_UI[k].titulo, h("span", null, "›")))))));
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [q, setQ] = useState("");
  const qRef = useRef(null);
  const searchWrapRef = useRef(null);
  const [headerH, setHeaderH] = useState(0);
  const [searchH, setSearchH] = useState(0);
  const [, setListo] = useState(0);

  const [guia, setGuia] = useState(() => getParam("guia"));

    const f = () => setListo(n => n + 1);
    window.addEventListener("az-formas", f);
    return () => window.removeEventListener("az-formas", f);
  }, []);

    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');

  }, []);
  useLayoutEffect(() => {
    function measure() {
      const header = document.querySelector("header");

      if (searchWrapRef.current) setSearchH(searchWrapRef.current.getBoundingClientRect().height);
    }

    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, [darkMode]);

  const c = azColors(darkMode);
  if (!ES_OK) {
    return h(AzShell, { darkMode, setDarkMode, moduleId: "gramatica", tabs: [] },
      h("div", { style: { textAlign: "center", padding: "12vh 6vw", color: c.textSub, fontSize: 14.5, lineHeight: 1.55 } },
        "Este módulo es de Abecé (español para rusohablantes).", h("br"),
        h("a", { href: "index.html", style: { color: c.gold, fontWeight: 700 }, onClick: ev => azNavigate(ev, "index.html") }, "Volver al inicio")));
  }
  const id = getParam("id");
  const tabla = getParam("tabla");
  const enFicha = !!(id || tabla);

  const results = (q.trim() ? azBuscarEs(q) : [])
    .filter(r => tieneFormas(r.id))
    .map(r => Object.assign({}, r, { href: "gramatica.html?id=" + r.id + (r.forma ? "&f=" + encodeURIComponent(r.forma) : "") }))
    .filter((r, i, a) => a.findIndex(x => x.href === r.href) === i);

      key: r.href, href: r.href, className: "res-row",

      style: { borderTop: i === 0 ? "none" : `1px solid ${c.border}` }
    },
      h("span", null, h("span", { className: "res-ru" }, r.acento || r.ru), h("span", { className: "res-asp" }, POS_CORTO[r.pos] || "")),
      h("span", { className: "res-es" }, r.es)));
  const noResults = h("div", { style: { padding: "12px 14px", fontSize: 13, color: c.textMuted } }, "Ничего не найдено");
  const campo = [
    h("input", {
      key: "i", ref: qRef, value: q, onInput: (ev) => setQ(ev.target.value),
      placeholder: "Слово или форма: buenas, los…",
      style: { width: "100%", boxSizing: "border-box", background: c.bg3, border: `1px solid ${c.border}`, borderRadius: 9, padding: "10px 34px 10px 14px", color: c.text, fontSize: 14 }
    }),
    q && h("button", {
      key: "x", onClick: () => { setQ(""); if (qRef.current) qRef.current.focus(); }, "aria-label": "Очистить поиск",
      style: { position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", width: 24, height: 24, borderRadius: "50%", background: c.border, border: "none", color: c.text, fontSize: 13, lineHeight: 1, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }
    }, "✕")
  ];
  const searchBar = enFicha && h("div", {
    ref: searchWrapRef,
    style: { position: "fixed", top: headerH, left: 0, right: 0, zIndex: 90, background: c.bg, backdropFilter: "blur(12px)", borderBottom: `1px solid ${c.border}`, padding: "12px 3vw" }
  },
    h("div", { style: { maxWidth: 960, margin: "0 auto", position: "relative" } },
      ...campo,
      q.trim() && h("div", {
        style: { position: "absolute", top: "calc(100% + 6px)", left: 0, right: 0, zIndex: 50, maxHeight: "50vh", overflowY: "auto", background: c.card, border: `1px solid ${c.border}`, borderRadius: 10, boxShadow: "0 16px 40px rgba(0,0,0,.4)" }
      }, results.length ? resultRows : noResults)));

  /* Portada (patrón de §6.1, como Casos) */
  const modulo = (typeof AZ_MODULES !== "undefined" ? AZ_MODULES : []).find(m => m.id === "gramatica") || { glyph: "Gr", icon: "purple", title: "Грамматика" };
  const total = Object.keys(FORMAS_ES).filter(tieneFormas).length;
  const INTRO_ITEMS = [
    ["Формы каждого слова", "Род, число и артикль: la canción → las canciones, bueno → buena, buenos, buenas."],
    ["Таблицы", "Местоимения по функциям, артикли, указательные и притяжательные слова."],
    ["Поиск по любой форме", "Напиши buenas, los или canciones — и попадёшь к нужному слову."]];

  const buscando = !!q.trim();
  const portada = h("div", null,
    !buscando && h("div", { className: "intro" },
      h("div", { className: "intro-top" },

        h("div", null,
          h("div", { className: "intro-title" }, modulo.title),
          h("div", { className: "intro-kicker" }, String(total).replace(/\B(?=(\d{3})+$)/g, "\u00a0") + " " + pluralRu(total, "слово", "слова", "слов") + " · 4 таблицы"))),
      h("div", { className: "intro-desc" }, "В испанском слова почти не меняются, но у них есть род, число и артикль, а у местоимений — своя форма для каждой функции. Здесь — формы каждого слова словаря и главные таблицы."),
      INTRO_ITEMS.map((it, i) => h("div", { key: i, className: "intro-item" },

    !buscando && HAY_GUIA && h(GuiaBoton, { titulo: "Как устроена грамматика", desc: "Артикль, ser и estar, местоимения, времена", onClick: () => setGuia("") }),
    h("div", { style: { position: "relative" } }, ...campo),
    !buscando && h("div", { className: "search-hint" }, "Можно искать по-испански или по-русски, или написать любую форму: buenas → bueno, canciones → canción."),
    !buscando && h("div", { className: "try-row" },
      h("span", { className: "try-lbl" }, "Попробуй:"),
      EJEMPLOS.map(x => h("a", { key: x.id, className: "try-chip", href: "gramatica.html?id=" + x.id, onClick: (ev) => azNavigate(ev, "gramatica.html?id=" + x.id) }, x.es))),
    !buscando && h("div", { className: "lbl" }, "Таблицы"),
    !buscando && h("div", { className: "grid" }, Object.keys(SERIES_UI).map(k => h("a", {
      key: k, className: "tcard", href: "gramatica.html?tabla=" + k, onClick: ev => azNavigate(ev, "gramatica.html?tabla=" + k)
    }, h("b", null, SERIES_UI[k].titulo), h("span", null, SERIES_UI[k].corto)))),
    buscando && h("div", { style: { marginTop: 10, background: c.card, border: `1px solid ${c.border}`, borderRadius: 10, overflow: "hidden", animation: "fadeIn 0.3s ease" } },
      results.length ? resultRows : noResults));

  return h(AzShell, { darkMode, setDarkMode, moduleId: "gramatica", tabs: [] },
    h(GramStyles, { c, dark: darkMode }),
    searchBar,
    h("div", { style: { paddingTop: enFicha ? (searchH ? searchH + 14 + "px" : "18px") : "16px", paddingBottom: 40 } },
      id ? h(FichaGram, { key: id, id, c, onGuia: setGuia }) : tabla ? h(TablaPagina, { key: tabla, serie: tabla, c }) : portada),
    guia != null && h(GuiaSheet, { inicio: guia, onClose: () => setGuia(null), c }));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
