<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>
<div id="root"></div>
<script src="assets/preact.js"></script>
<script src="data/data-lexicon.js"></script>
<script src="data/data-casos.js"></script>
<script src="data/data-verbos.js"></script>
<script src="data/data-frases.js"></script>
<script src="data/data-dialogos.js"></script>
<script src="data/data-unidad-4.js"></script>
<script src="js/core.js"></script>

<script src="js/corrector.js"></script>

<script>
/* ============================================================
   AZBUKA-4.HTML — Unidad 4: Casos I · nominativo y acusativo
   ------------------------------------------------------------
   02/10/2026. Piezas de pantalla de unidad-ui.js, práctica y
   evaluación de unidad.js. Propio de esta unidad: chips de ejemplo
   por módulo, tabla de verbos (módulo 3), tablas nominativo →
   acusativo con ampliación (módulos 4 a 6), lecturas (módulo 8) y
   la «palabra del día» en la portada.
   URL: azbuka-4.html · azbuka-4.html?m=u4m5
   ============================================================ */
const { useState, useEffect } = htmPreact;
const h = React.createElement;
const U = UNIDAD_4;
const EJ_U4 = ejerciciosUnidad4();
const EJ_U4_BASE = EJ_U4.filter(e => !e.ampliacion);
const D4 = u4Datos();
const OBJETIVO_U4 = LEXICON_COMER.filter(e => (e.introducedIn || []).indexOf(4) >= 0 || (e.appearsIn || []).indexOf(4) >= 0).map(e => e.id);
const AVISO_ACENTOS = "En Azbuka, los acentos (´) son solo una ayuda para leer: en ruso no se escriben, así que no hace falta que los pongas. La е vale por ё.";
const sin4 = D4.sin;
const sust4 = ru => D4.sust[sin4(ru)];
const verb4 = ru => D4.verb[sin4(ru)];

/* Dorso de las tarjetas: el acusativo de los sustantivos, las cuatro formas de los verbos */
function detalleTarjeta(e) {
  const s = D4.sust[sin4(e.acento || e.ru)], v = D4.verb[sin4(e.acento || e.ru)];
  if (s) return "acusativo: " + s.acc;
  if (v) return "я " + v.f[0] + " · он / она́ " + v.f[1] + " · мы " + v.f[2] + " · они́ " + v.f[3];
  return null;
}

/* Chips de ejemplo: se tocan para escuchar */
function Chips({ lista, c, conAcc }) {
  return h(React.Fragment, null,
    h("div", { className: "u-text", style: { fontSize: 13, marginTop: 8 } }, "Tocá una palabra para escuchar cómo suena."),
    h("div", { style: { display: "flex", flexWrap: "wrap", gap: 8, marginTop: 10 } }, lista.map((x, i) =>
      h("button", { key: i, onClick: () => azHablarRu(x.ru), lang: "ru",
        style: { display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 10, background: c.bg3, border: `1px solid ${c.border}`, color: c.text, fontSize: 15, fontWeight: 700, fontFamily: "inherit", cursor: "pointer" } },
        x.emoji && h("span", { style: { fontSize: 18 } }, x.emoji), x.ru, x.es && h("span", { style: { fontSize: 11.5, color: c.textMuted, fontWeight: 500 } }, x.es)))));
}

/* Verbos del módulo 3: una tarjeta por verbo con sus cuatro formas (2 × 2),
   porque cinco columnas no entran en el ancho del teléfono. Se tocan para escuchar. */
function TablaVerbos({ c }) {
  const forma = (pr, f) => h("button", { key: pr, onClick: () => azHablarRu(f), lang: "ru",
    style: { textAlign: "left", padding: "7px 10px", borderRadius: 9, background: c.bg2, border: `1px solid ${c.border}`, color: c.text, fontFamily: "inherit", cursor: "pointer", minWidth: 0 } },
    h("div", { style: { fontSize: 10.5, fontWeight: 700, letterSpacing: .5, color: c.textMuted } }, pr), h("div", { style: { fontSize: 15.5, fontWeight: 700 } }, f));
  return h(React.Fragment, null,
    h("div", { className: "u-text", style: { fontSize: 13, marginTop: 8 } }, "Tocá una forma para escuchar cómo suena."),
    Object.values(D4.verb).map(v => h("div", { key: v.id, className: "u-card", style: { padding: "12px 14px", marginTop: 10 } },
      h("div", { style: { display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" } },
        h("span", { lang: "ru", style: { fontSize: 18, fontWeight: 800, color: c.gold } }, h(AzPalabra, { texto: v.ac, id: v.id })),
        h("span", { style: { fontSize: 13, color: c.textMuted } }, v.es)),
      h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginTop: 8 } },
        forma("я", v.f[0]), forma("он / она́", v.f[1]), forma("мы", v.f[2]), forma("они́", v.f[3])))));
}

/* Lecturas del módulo 8: texto tocable, audio y traducción a pedido */
function Lectura({ L, c }) {
  const [es, setEs] = useState(false);
  const idx = azIndiceFormas();
  const lexDe = ru => (ru.match(/[А-Яа-яЁё\u0301]+/g) || []).map(w => { const r = idx.get(azFormaClave(w)); return r && r[0] ? r[0][0] : null; });
  const todo = L.lineas.map(l => l[0]).join(" ");
  return h("div", { className: "u-card", style: { padding: "14px 16px", marginTop: 12 } },
    h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
      h("div", { lang: "ru", style: { flex: 1, fontSize: 18, fontWeight: 800, color: c.gold } }, L.titulo),
      h("button", { className: "play", onClick: () => azHablarSecuencia(L.lineas.map(l => ({ texto: l[0] }))), "aria-label": "Escuchar el texto" }, "▶"),
      h("button", { className: "play", onClick: azCallar, "aria-label": "Detener el audio" }, "■")),
    L.lineas.map((l, k) => h("div", { key: k, style: { marginTop: 8, fontSize: 16.5, lineHeight: 1.5 } },
      h(AzTexto, { ru: l[0], lex: lexDe(l[0]), objetivo: OBJETIVO_U4 }),
      es && h("div", { style: { fontSize: 13, color: c.textMuted } }, l[1]))),
    h("button", { className: "ubtn sec", style: { marginTop: 12 }, onClick: () => setEs(!es) }, es ? "Ocultar la traducción" : "Ver la traducción"));
}

/* Palabra del día: palabra, acusativo, ejemplo y una frase propia */
function PalabraDelDia({ c, green }) {
  const p = u4PalabraDelDia();
  const [txt, setTxt] = useState("");
  const [rev, setRev] = useState(null);
  const revisar = () => {
    const idx = azIndiceFormas();
    const usa = (txt.match(/[А-Яа-яЁё\u0301]+/g) || []).some(w => { const r = idx.get(azFormaClave(w)); return r && r.some(x => x[0] === p.id); });
    setRev(Object.assign({ usa }, azRevisarTexto(txt, [], U.modulos.find(m => m.id === "u4m10").consejos)));
  };
  return h("div", { className: "u-card", style: { padding: "16px", marginTop: 14 } },
    h("div", { className: "u-kicker", style: { marginBottom: 8 } }, "Palabra del día"),
    h("div", { style: { display: "flex", alignItems: "center", gap: 14 } },
      h("div", { style: { fontSize: 44 } }, p.emoji),
      h("div", { style: { flex: 1, minWidth: 0 } },
        h("div", { lang: "ru", style: { fontSize: 24, fontWeight: 800, color: c.gold } }, h(AzPalabra, { texto: p.ac, id: p.id })),
        h("div", { style: { fontSize: 13.5, color: c.textSub } }, p.es + " · acusativo: ", h("b", { lang: "ru", style: { color: c.text } }, p.acc))),
      h("button", { className: "play", onClick: () => azHablarRu(p.nom), "aria-label": "Escuchar" }, "▶")),
    p.ejemplo && h("div", { style: { display: "flex", alignItems: "center", gap: 10, marginTop: 12, padding: "10px 12px", borderRadius: 10, background: c.bg2, border: `1px solid ${c.border}` } },
      h("div", { style: { flex: 1 } }, h("div", { lang: "ru", style: { fontSize: 15.5, fontWeight: 700 } }, p.ejemplo), h("div", { style: { fontSize: 12.5, color: c.textMuted, marginTop: 2 } }, p.ejemploEs)),
      h("button", { className: "play", onClick: () => azHablarRu(p.ejemplo), "aria-label": "Escuchar el ejemplo" }, "▶")),
    h("div", { className: "u-text", style: { fontSize: 13.5, marginTop: 12 } }, "Escribí una frase propia en la que " + p.ac + " reciba la acción:"),
    h("input", { className: "pr-input", lang: "ru", value: txt, placeholder: "Escribí en ruso…", onInput: e => { setTxt(e.target.value); setRev(null); },
      autocapitalize: "off", autocorrect: "off", spellcheck: false, autocomplete: "off",
      style: { width: "100%", boxSizing: "border-box", marginTop: 8, background: c.bg3, border: `1px solid ${c.border}`, borderRadius: 10, padding: "11px 12px", color: c.text, fontSize: 16, fontFamily: "inherit" } }),
    h("button", { className: "ubtn", style: { marginTop: 10 }, disabled: !txt.trim(), onClick: revisar }, "Revisar"),
    rev && h("div", { style: { marginTop: 10, fontSize: 14, lineHeight: 1.5 } },
      h("div", { style: { color: rev.usa ? green : "#E2884A", fontWeight: 700 } }, rev.usa ? "✓ Usaste " + p.ac + "." : "No encuentro " + p.ac + " en tu frase."),
      rev.dudas.map((d, i) => h("div", { key: i, className: "u-truco", lang: "ru" }, "«" + d.t + "» no la encuentro en el diccionario" + (d.sugerencia ? ". ¿Quisiste decir «" + d.sugerencia + "»?" : "."))),
      rev.tips.map((t, i) => h("div", { key: "t" + i, className: "u-truco" }, azFmt(t))),
      rev.usa && !rev.dudas.length && !rev.tips.length && h("div", { style: { color: c.textSub, marginTop: 4 } }, "Si querés, guardala en el cuaderno."),
      rev.usa && h("button", { className: "ubtn sec", style: { marginTop: 8 }, onClick: () => azGuardarEnCuaderno(txt, { titulo: "Unidad 4 · Palabra del día: " + p.ac, href: "azbuka-4.html" }) }, "＋ Cuaderno")));
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [modId, setModId] = useState(() => new URLSearchParams(location.search).get("m"));
  const [tarjetas, setTarjetas] = useState(null);
  const [practica, setPractica] = useState(null);
  const [visto, setVisto] = useState(1);
  const [examen, setExamen] = useState(null);
  const [, refrescar] = useState(0);

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      setVisto(await azGet('az_u4_visto', 1));
      await azLoadProgress();
      azSaveUnitProgress(4, {});
      refrescar(x => x + 1);
    })();
    const pop = () => { setModId(new URLSearchParams(location.search).get("m")); setTarjetas(null); setPractica(null); };
    window.addEventListener("popstate", pop);
    return () => window.removeEventListener("popstate", pop);
  }, []);
  useEffect(() => {
    const m = modId ? unidad4Modulo(modId) : null;
    window.azFuenteActual = () => m ? "Unidad 4 · " + m.titulo : "Unidad 4";
    if (m && m.n > visto) { setVisto(m.n); azSet('az_u4_visto', m.n); }
    if (m) azGuardarUltimo({ unidad: 4, n: m.n, total: U.modulos.length, titulo: "Unidad 4 · " + m.titulo, href: "azbuka-4.html?m=" + m.id });
  }, [modId]);
  useEffect(() => { if (!practica && AZ_PROGRESS.units) setExamen((AZ_PROGRESS.units["4"] || {}).examen || null); }, [practica]);

  const abrirModulo = id => { history.pushState(null, "", id ? "?m=" + id : location.pathname); setModId(id); window.scrollTo(0, 0); };
  const practicarUnidad = () => setPractica({ titulo: "Unidad 4", pool: EJ_U4_BASE.filter(e => e.modulo <= Math.max(visto, 1)) });
  const practicarModulo = m => setPractica({ titulo: m.titulo, n: m.nPractica, pool: EJ_U4_BASE.filter(e => e.modulo === m.n) });
  const practicarAmpliacion = m => setPractica({ titulo: "Ampliación: " + m.titulo.toLowerCase(), pool: EJ_U4.filter(e => e.ampliacion && e.modulo === m.n) });
  const rendirExamen = m => setPractica({ titulo: "Evaluación de la Unidad 4", pool: EJ_U4_BASE, examen: { intro: m.intro, partes: m.partes, aprobado: m.aprobado } });
  const reforzar = parte => setPractica({ titulo: "Reforzar: " + parte.nombre, pool: EJ_U4_BASE.filter(e => parte.tipos.indexOf(e.tipo) >= 0) });

  const c = azColors(darkMode);
  const green = darkMode ? "#4CAF82" : "#2E7D55";
  const mod = modId ? unidad4Modulo(modId) : null;
  const idx = mod ? U.modulos.indexOf(mod) : -1;
  const prev = mod && U.modulos[idx - 1], next = mod && U.modulos[idx + 1];
  const palabrasDom = OBJETIVO_U4.filter(id => azItem("lex:" + id).level === 2).length;
  const tabs = mod ? [
    { id: "u", icon: "⊞", aria: "Unidad", action: () => abrirModulo(null) },
    { id: "p", icon: "‹", aria: "Módulo anterior", disabled: !prev, action: () => prev && abrirModulo(prev.id) },
    { id: "m", texto: "Módulo " + mod.n },
    { id: "s", icon: "›", aria: "Módulo siguiente", disabled: !next, action: () => next && abrirModulo(next.id) }
  ] : azTabsUnidad(4);

  const portada = h(AzPortadaUnidad, { u: U, c, green, visto: Math.max(visto, 1), examen, onPracticar: practicarUnidad, onAbrir: abrirModulo,
    progreso: [{ label: "Palabras dominadas", valor: palabrasDom, total: OBJETIVO_U4.length }] });

  let vista = null;
  if (mod) {
    const vistas = n => (U4_VISTAS[n] || "").split(" ");
    const chipsSust = n => vistas(n).map(sust4).filter(Boolean).map(s => ({ ru: s.nom, es: s.es, emoji: s.emoji }));
    /* Tabla nominativo → acusativo: las palabras del módulo (base o ampliación) */
    const tablaAcc = (lista) => h(AzTablaGrupos, { encabezados: ["Nominativo", "Acusativo"], c,
      filas: lista.map(s => [{ id: s.id, ru: s.nom, es: s.es }, { id: s.id, ru: s.acc, es: "" }]) });
    const delModulo = (n, amp) => Object.values(D4.sust).filter(s => s.mod === n && (amp ? s.amp === n : !s.amp) && !/ребенок/.test(sin4(s.nom)));
    const ampIds = n => (U4_AMPLIACION_RU[n] || "").split(" ").map(ru => { const s = sust4(ru); return s ? s.id : null; }).filter(Boolean);
    vista = h("div", { key: mod.id, style: { animation: "fadeIn 0.3s ease", paddingTop: 18 } },
      h("div", { className: "u-kicker" }, "Unidad 4 · Módulo " + mod.n),
      h("h1", { className: "u-title" }, mod.titulo),
      h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(mod.intro)),
      mod.tipo === "leccion" && h(React.Fragment, null,
        h(AzSecciones, { secciones: mod.secciones }),
        mod.n === 1 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Doce palabras en nominativo y acusativo"),
          tablaAcc(vistas(1).map(sust4).filter(Boolean))),
        mod.n === 2 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Personas y cosas"), h(Chips, { c, lista: chipsSust(2) })),
        mod.n === 3 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Los verbos de la unidad"),
          h(TablaVerbos, { c })),
        mod.grupo && h(React.Fragment, null,
          h("div", { className: "u-sec" }, { f: "Femeninos (y hombres en -а)", m: "Masculinos: cosas, personas y animales", n: "Neutros" }[mod.grupo]),
          tablaAcc(delModulo(mod.n, false))),
        h("button", { className: "ubtn", style: { marginTop: 22 }, onClick: () => practicarModulo(mod) }, "Practicar este módulo"),
        mod.grupo && ampIds(mod.n).length > 0 && h("div", { style: { marginTop: 28, paddingTop: 6, borderTop: `1px solid ${c.border}` } },
          h("div", { className: "u-sec" }, "Ampliación · opcional"),
          h("p", { className: "u-text", style: { fontSize: 14.5 } }, "Más palabras que siguen las mismas reglas, para quien quiera sumar vocabulario. Es opcional: no entra en la práctica de la unidad ni en la evaluación."),
          tablaAcc(delModulo(mod.n, true)),
          h("button", { className: "ubtn", onClick: () => setTarjetas({ ids: ampIds(mod.n), titulo: "Ampliación: " + mod.titulo.toLowerCase() }) }, "Tarjetas (" + ampIds(mod.n).length + ")"),
          h("button", { className: "ubtn sec", style: { marginTop: 10 }, onClick: () => practicarAmpliacion(mod) }, "Practicar la ampliación"))),
      mod.tipo === "lectura" && h(React.Fragment, null,
        U4_LECTURAS.map(L => h(Lectura, { key: L.id, L, c })),
        h("button", { className: "ubtn", style: { marginTop: 18 }, onClick: () => practicarModulo(mod) }, "Contestar las preguntas")),
      mod.tipo === "proyecto" && h(AzProyecto, { mod, c, green, clave: "az_u4_proyecto", fuente: { titulo: "Unidad 4 · Proyecto final", href: "azbuka-4.html?m=u4m10" }, aviso: AVISO_ACENTOS }),
      mod.tipo === "examen" && h(React.Fragment, null,
        h("div", { className: "u-card", style: { padding: "6px 16px", marginTop: 16 } }, mod.partes.map((p, k) =>
          h("div", { key: p.nombre, style: { display: "flex", justifyContent: "space-between", padding: "10px 0", borderTop: k ? `1px solid ${c.border}` : "none", fontSize: 14.5 } },
            h("span", { style: { fontWeight: 600 } }, p.nombre), h("span", { style: { color: c.textMuted } }, p.n + " ejercicios")))),
        examen && h("div", { style: { marginTop: 14, fontSize: 14, color: examen.aprobado ? green : "#E2884A", fontWeight: 700 } },
          "Última vez: " + examen.pct + " % (" + examen.fecha.split("-").reverse().join("/") + ")" + (examen.aprobado ? " · aprobada" : "")),
        h("button", { className: "ubtn", onClick: () => rendirExamen(mod) }, examen ? "Rendir de nuevo" : "Empezar la evaluación")),
      next && h("button", { className: "ubtn sec", style: { marginTop: 22 }, onClick: () => abrirModulo(next.id) }, "Siguiente: " + next.titulo));
  }

  return h(React.Fragment, null,
    h(AzEstilosUnidad, { c, green }),
    h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs }, mod ? vista : h(React.Fragment, null, portada, h(PalabraDelDia, { c, green }))),
    practica && h(AzPractica, { key: practica.titulo + (practica.pool[0] || {}).id, unidad: 4, titulo: practica.titulo, pool: practica.pool, mezcla: U4_MEZCLA,
      n: azNPractica(practica.pool, practica.n), dark: darkMode, aviso: AVISO_ACENTOS, examen: practica.examen, onReforzar: reforzar, objetivo: OBJETIVO_U4,
      onSalir: () => { setPractica(null); refrescar(x => x + 1); } }),
    tarjetas && h(AzTarjetasPalabras, { ids: tarjetas.ids, titulo: tarjetas.titulo, c, green, detalle: detalleTarjeta, onClose: () => { setTarjetas(null); refrescar(x => x + 1); } }),
    h(AzBurbujaHost, { dark: darkMode }));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
