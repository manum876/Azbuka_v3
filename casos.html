/* ============================================================
   CASOS.HTML — Módulo Casos: un filtro del léxico central.
   ------------------------------------------------------------
   · Sin ?id=  → portada: solo el buscador (busca sustantivos,
     adjetivos, pronombres, determinantes y numerales, vía
     azSearchLexicon(q, POS_DECLINABLE)).
   · Con ?id=CMR-xxxxx → ficha de declinación:
       arriba, datos del léxico central (palabra, transliteración,
       IPA, categoría, género, animacidad, acepciones);
       abajo, las tablas de data-casos.js.
   · Cada caso y cada forma especial (locativo, partitivo, conteo, forma
     corta, acusativo animado, н-, numerales) abre una ficha a
     pantalla completa con la explicación de data-gramatica.js.
   Esta página NO guarda datos de palabras ni explicaciones:
   todo sale de data-lexicon.js, data-casos.js y data-gramatica.js.
   ============================================================ */
const { useState, useEffect, useRef, useLayoutEffect } = htmPreact;
const h = React.createElement;

/* Mismas etiquetas que ficha.html */
const POS_LABEL = { sustantivo: "Sustantivo", adjetivo: "Adjetivo", pronombre: "Pronombre", determinante: "Determinante", numeral: "Numeral" };
const POS_SHORT = { sustantivo: "sust.", adjetivo: "adj.", pronombre: "pron.", determinante: "det.", numeral: "num." };
const POS_DECLINABLE = ["sustantivo", "adjetivo", "pronombre", "determinante", "numeral"];
const GENDER_LABEL = { m: "masculino", f: "femenino", n: "neutro" };
const ANIMATE_LABEL = { "sí": "animado", yes: "animado", no: "inanimado" };

const GENEROS = [["m", "Masculino", "Masc."], ["f", "Femenino", "Fem."], ["n", "Neutro", "Neutro"], ["pl", "Plural", "Plural"]];
const CORTA_FILAS = [["m", "он", "masculino"], ["f", "она", "femenino"], ["n", "оно", "neutro"], ["pl", "они", "plural"]];

function getWordId() {
  return new URLSearchParams(window.location.search).get("id");
}

/* Voz: se envía sin el acento gráfico (U+0301), que algunas voces
   leen mal. */
function speakRu(text) {
  try {
    if (!text || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\u0301/g, ""));
    u.lang = "ru-RU";
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  } catch (err) {}
}

/* Pantalla ancha: las 4 columnas de género entran juntas. */
function useWide() {
  const q = "(min-width: 640px)";
  const [wide, setWide] = useState(() => window.matchMedia(q).matches);
  useEffect(() => {
    const m = window.matchMedia(q);
    const f = () => setWide(m.matches);
    m.addEventListener ? m.addEventListener("change", f) : m.addListener(f);
    return () => { m.removeEventListener ? m.removeEventListener("change", f) : m.removeListener(f); };
  }, []);
  return wide;
}

/* Celda con una forma: toca para escuchar. Si es un par de
   acusativos [inanimado, animado], muestra los dos. */
/* Forma buscada (?f=): se resalta en la tabla. */
const FORMA_BUSCADA = azFormaClave(new URLSearchParams(window.location.search).get("f") || "");
/* Si la forma buscada trae acento (часа́), se distingue de otra que solo
   cambia en el acento (ча́са). Sin acento, vale cualquiera de las dos. */
const FORMA_EXACTA = (new URLSearchParams(window.location.search).get("f") || "").toLowerCase();
function esFormaBuscada(t) {
  if (!FORMA_BUSCADA || !t) return false;
  if (FORMA_EXACTA.indexOf("\u0301") >= 0) return t.toLowerCase() === FORMA_EXACTA;
  return azFormaClave(t) === FORMA_BUSCADA;
}
function Forma({ text, extra }) {
  if (Array.isArray(text)) {
    return h("div", null,
      h(FormaLinea, { text: text[0], tag: "inan." }),
      h("div", { className: "f-extra" }, h(FormaLinea, { text: text[1], tag: "anim." }))
    );
  }
  if (!text) return h("span", { className: "f-none" }, "—");
  return h("div", null,
    h(FormaLinea, { text }),
    extra && extra.map((x, i) => h("div", { key: i, className: "f-extra" }, h(FormaLinea, { text: x[0], tag: x[1] })))
  );
}
function FormaLinea({ text, tag }) {
  if (!text) return h("span", { className: "f-none" }, "—");
  const hit = esFormaBuscada(text);
  return h("div", { className: "f-cell" + (hit ? " f-hit" : ""), onClick: () => speakRu(text) },
    h("span", { className: "f-ru" }, text),
    tag && h("span", { className: "f-tag" }, tag),
    h("span", { className: "f-play" }, "▶")
  );
}

/* Tabla de los 6 casos: filas = casos, columnas = sg/pl, géneros… */
function TablaCasos({ columnas, valor, extra, onCaso }) {
  return h("table", { className: "ctable" },
    h("colgroup", null,
      h("col", { style: { width: columnas.length > 2 ? "22%" : "31%" } }),
      columnas.map((col, i) => h("col", { key: i }))
    ),
    h("thead", null, h("tr", null,
      h("th", null, h("span", { className: "th-sub" }, "Caso")),
      columnas.map((col, i) => h("th", { key: i },
        h("span", { className: "th-ru" }, col.titulo),
        col.sub && h("span", { className: "th-sub" }, col.sub)
      ))
    )),
    h("tbody", null, GRAMATICA_CASOS_ORDEN.map((cid, r) => {
      const caso = gramaticaCaso(cid);
      return h("tr", { key: cid },
        h("td", null, h("button", { className: "case-btn", onClick: () => onCaso(cid), "aria-label": "Qué es el " + caso.nombre.toLowerCase() },
          h("div", { className: "p-ru" }, caso.nombre, h("span", null, "?")),
          h("div", { className: "p-es" }, caso.preguntas)
        )),
        columnas.map((col, i) => h("td", { key: i }, h(Forma, { text: valor(col, r), extra: extra ? extra(col, r) : null })))
      );
    }))
  );
}

/* Tabla simple de 4 filas (forma corta) */
function TablaCorta({ corta }) {
  return h("table", { className: "ctable" },
    h("colgroup", null, h("col", { style: { width: "31%" } }), h("col", null)),
    h("tbody", null, CORTA_FILAS.map((f, r) => h("tr", { key: r },
      h("td", null, h("div", { className: "p-ru" }, f[1]), h("div", { className: "p-es" }, f[2])),
      h("td", null, h(Forma, { text: corta[f[0]] }))
    )))
  );
}

/* Hoja a pantalla completa: un caso o una forma especial. */
function useLockScroll() {
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };
  }, []);
}
/* Ejemplo: la palabra que está en el caso viene entre llaves {…} en
   data-gramatica.js; se resalta y abajo va la explicación. */
function RuMarcado({ text }) {
  return h("span", null, text.split(/(\{[^}]*\})/).map((p, i) =>
    p.charAt(0) === "{" ? h("span", { key: i, className: "ex-hl" }, p.slice(1, -1)) : p));
}
function Ejemplo({ ru, es, titulo, por }) {
  const limpio = ru.replace(/[{}]/g, "");
  return h("div", { className: "ex ex-col" },
    h("div", { className: "ex-top" },
      h("div", { style: { flex: 1, minWidth: 0 } },
        titulo && h("div", { className: "ex-t" }, titulo),
        h("div", { className: "ex-ru" }, h(RuMarcado, { text: ru })),
        h("div", { className: "ex-es" }, es)
      ),
      h("button", { className: "play", onClick: () => speakRu(limpio), "aria-label": "Escuchar" }, "▶")
    ),
    por && h("div", { className: "ex-why" }, por)
  );
}
function CasoSheet({ cid, formas, base, onClose }) {
  useLockScroll();
  const g = gramaticaCaso(cid);
  if (!g) return null;
  const fila = (k, lista) => h("div", { className: "wb-line" },
    h("div", { className: "wb-k" }, k),
    h("div", { className: "wb-row" }, lista.map((f, i) => h("span", { key: i, className: "wb-item", onClick: () => speakRu(f[0]) }, f[0], f[1] && h("small", null, f[1]))))
  );
  return h("div", { className: "sheet", role: "dialog", "aria-modal": "true" },
    h("button", { className: "sheet-x", onClick: onClose, "aria-label": "Cerrar" }, "✕"),
    h("div", { className: "sheet-in" },
      h("div", { className: "sheet-kicker" }, "Caso"),
      h("div", { className: "sheet-title" }, g.nombre),
      h("div", { className: "sheet-sub" }, g.ru),
      h("div", { className: "sheet-q" }, h("span", { className: "sheet-q-k" }, "Responde a: "), g.preguntas),
      /* La palabra de la ficha: primero en nominativo, después en este caso */
      formas && formas.length > 0 && h("div", { className: "word-box" },
        cid !== "nominativo" && base && base.length > 0 && fila("La palabra (nominativo)", base),
        fila(cid === "nominativo" ? "La palabra (nominativo)" : "En " + g.nombre.toLowerCase(), formas)
      ),
      h("div", { className: "sheet-text" }, g.resumen),
      g.usos && g.usos.length > 0 && h("div", null,
        h("div", { className: "section-lbl", style: { marginTop: 24 } }, "Para qué se usa"),
        g.usos.map((u, i) => h(Ejemplo, { key: i, titulo: u[0], ru: u[1], es: u[2], por: u[3] }))
      ),
      g.preposiciones && g.preposiciones.length > 0 && h("div", null,
        h("div", { className: "section-lbl", style: { marginTop: 24 } }, "Preposiciones"),
        h("div", { className: "prep-list" }, g.preposiciones.map((p, i) => h("div", { key: i, className: "prep" }, h("b", null, p[0]), p[1])))
      ),
      h("div", { className: "section-lbl", style: { marginTop: 24 } }, "Ejemplos"),
      g.ejemplos.map((ej, i) => h(Ejemplo, { key: i, ru: ej[0], es: ej[1], por: ej[2] }))
    )
  );
}
function FormaSheet({ fid, onClose }) {
  useLockScroll();
  const g = GRAMATICA_FORMAS[fid];
  if (!g) return null;
  return h("div", { className: "sheet", role: "dialog", "aria-modal": "true" },
    h("button", { className: "sheet-x", onClick: onClose, "aria-label": "Cerrar" }, "✕"),
    h("div", { className: "sheet-in" },
      h("div", { className: "sheet-kicker" }, "Declinación"),
      h("div", { className: "sheet-title" }, g.titulo),
      h("div", { className: "sheet-text" }, g.texto),
      h("div", { className: "section-lbl", style: { marginTop: 24 } }, "Ejemplos"),
      g.ejemplos.map((ej, i) => h(Ejemplo, { key: i, ru: ej[0], es: ej[1], por: ej[2] }))
    )
  );
}

/* Botón «?» que abre una forma especial */
function Ayuda({ fid, texto, onForma }) {
  return h("button", { className: "help-chip", onClick: () => onForma(fid) }, texto, h("span", null, "?"));
}

/* Formas de la palabra en un caso (para la hoja del caso). */
function formasEnCaso(d, r) {
  if (!d) return [];
  const out = [];
  const push = (x, tag) => {
    if (!x) return;
    if (Array.isArray(x)) { out.push([x[0], (tag ? tag + " " : "") + "inan."]); out.push([x[1], (tag ? tag + " " : "") + "anim."]); }
    else out.push([x, tag]);
  };
  if (d.tipo === "sustantivo") {
    if (d.sg) push(d.sg[r], d.pl ? "sg." : "");
    if (d.pl) push(d.pl[r], d.sg ? "pl." : "");
    if (r === 1 && d.partitivo) push(d.partitivo, "partitivo");
    if (r === 1 && d.conteo) push(d.conteo, "con 2, 3 y 4");
    if (r === 5 && d.loc2) push(d.loc2, "locativo");
  }
  else if (d.tipo === "adjetivo") GENEROS.forEach(g => d[g[0]] && push(d[g[0]][r], g[2].toLowerCase()));
  else if (d.tipo === "personal") { push(d.formas[r], ""); if (d.n && d.n[r] && d.n[r] !== d.formas[r]) push(d.n[r], "con prep."); }
  else if (d.tipo === "serie") push(d.formas[r], "");
  const seen = new Set();
  return out.filter(f => { const k = f[0] + "|" + f[1]; if (seen.has(k)) return false; seen.add(k); return true; });
}

function FichaCasos({ id, c }) {
  const lex = id ? lexComerById(id) : null;
  const d = id ? casosById(id) : null;
  const wide = useWide();
  const [gSel, setGSel] = useState("m");
  const [caso, setCaso] = useState(null);
  const [forma, setForma] = useState(null);

  if (!lex || !d) {
    return h("div", { style: { textAlign: "center", padding: "10vh 0" } },
      h("h1", { style: { fontSize: 18, marginBottom: 8, color: c.text } }, "Palabra no encontrada"),
      h("p", { style: { fontSize: 13.5, color: c.textMuted } },
        lex ? `"${lex.ru}" no se declina.` : `No hay ninguna palabra con id "${id}".`)
    );
  }

  /* Si se llegó buscando una forma (?f=), se explica de dónde viene */
  const bf = FORMA_BUSCADA ? azFormasDe(id).filter(x => esFormaBuscada(x[0])) : [];
  const buscada = bf.length ? { forma: bf[0][0], etiquetas: [...new Set(bf.map(x => x[1]))] } : null;
  const pos = lex.posNormalized;
  const badge = [POS_LABEL[pos] || pos];
  if (pos === "sustantivo" && lex.gender) badge.push(GENDER_LABEL[lex.gender] || lex.gender);
  if (pos === "sustantivo" && lex.animate) badge.push(ANIMATE_LABEL[lex.animate] || lex.animate);

  const tags = [];
  if (d.tipo === "indeclinable") tags.push("No se declina");
  if (d.tipo === "sustantivo" && !d.sg) tags.push("Solo se usa en plural");
  if (d.tipo === "sustantivo" && !d.pl) tags.push("Solo se usa en singular");
  if (d.adjetival) tags.push("Se declina como adjetivo");
  if (d.tipo === "serie" && d.numero === "pl") tags.push("Plural");

  /* Ayudas (formas especiales) que aplican a esta palabra */
  const ayudas = [];
  const tieneParAc = d.tipo === "adjetivo" || (d.formas && d.formas.some(Array.isArray));
  if (tieneParAc) ayudas.push(["acusativoAnimado", "Acusativo animado"]);
  if (d.loc2) ayudas.push(["locativo", "Locativo"]);
  if (d.partitivo) ayudas.push(["partitivo", "Partitivo"]);
  if (d.conteo) ayudas.push(["conteo", "Forma de conteo"]);
  if (d.tipo === "personal" && d.n) ayudas.push(["pronombreN", "Formas con н-"]);
  if (pos === "numeral") ayudas.push(["numerales", "Números y casos"]);
  if (d.tipo === "indeclinable") ayudas.push(["indeclinable", "Palabras que no se declinan"]);

  /* ── Tabla según el tipo ── */
  let tabla = null, selector = null;
  if (d.tipo === "sustantivo") {
    const cols = [];
    if (d.sg) cols.push({ titulo: "Singular", k: "sg" });
    if (d.pl) cols.push({ titulo: "Plural", k: "pl" });
    tabla = h(TablaCasos, {
      columnas: cols, onCaso: setCaso,
      valor: (col, r) => d[col.k][r],
      /* partitivo junto al genitivo; locativo junto al preposicional */
      extra: (col, r) => {
        if (col.k !== "sg") return null;
        if (r === 1 && (d.partitivo || d.conteo)) return [].concat(d.partitivo ? [[d.partitivo, "coloq."]] : [], d.conteo ? [[d.conteo, "con 2–4"]] : []);
        if (r === 5 && d.loc2) return [[d.loc2, "lugar"]];
        return null;
      }
    });
  } else if (d.tipo === "adjetivo" && (d.m || d.f || d.n || d.pl)) {
    const gens = GENEROS.filter(g => d[g[0]]);
    const sel = gens.some(g => g[0] === gSel) ? gSel : gens[0][0];
    const cols = (wide ? gens : gens.filter(g => g[0] === sel)).map(g => ({ titulo: wide ? g[2] : g[1], k: g[0] }));
    if (!wide && gens.length > 1) selector = h("div", { className: "pair-row" }, gens.map(g => {
      const on = g[0] === sel;
      return h("button", {
        key: g[0], className: "pair-btn", onClick: () => setGSel(g[0]),
        style: on
          ? { background: c.gold + "22", border: `1px solid ${c.gold}`, color: c.gold }
          : { background: c.bg2, border: `1px solid ${c.border}`, color: c.textMuted }
      }, g[1]);
    }));
    tabla = h(TablaCasos, { columnas: cols, onCaso: setCaso, valor: (col, r) => d[col.k][r] });
  } else if (d.tipo === "personal") {
    const cols = [{ titulo: "Forma", k: "formas" }];
    if (d.n) cols.push({ titulo: "Con preposición", k: "n" });
    tabla = h(TablaCasos, {
      columnas: cols, onCaso: setCaso,
      valor: (col, r) => d[col.k][r],
      extra: (col, r) => {
        const alt = col.k === "n" ? d.altN : d.alt;
        const nombre = GRAMATICA_CASOS_ORDEN[r] === "instrumental" ? "inst" : null;
        return alt && nombre && alt[nombre] ? [[alt[nombre], "también"]] : null;
      }
    });
  } else if (d.tipo === "serie") {
    tabla = h(TablaCasos, {
      columnas: [{ titulo: d.numero === "pl" ? "Plural" : "Forma", k: "formas" }], onCaso: setCaso,
      valor: (col, r) => d.formas[r],
      extra: (col, r) => (d.alt && GRAMATICA_CASOS_ORDEN[r] === "instrumental" && d.alt.inst ? [[d.alt.inst, "también"]] : null)
    });
  }

  return h("div", { style: { animation: "fadeIn 0.3s ease" } },
    h("div", { className: "ficha" },

      /* ── HERO: palabra, pronunciación, categoría ── */
      h("div", { className: "hero" },
        h("div", { className: "hero-top" },
          h("div", { style: { minWidth: 0 } },
            h("div", { className: "ru" }, d.ru),
            lex.translit && h("div", { className: "translit" }, lex.translit),
            lex.ipa && h("div", { className: "ipa" }, "IPA: /" + lex.ipa + "/")
          ),
          h("button", { className: "play", onClick: () => speakRu(d.ru), "aria-label": "Escuchar" }, "▶")
        ),
        h("span", { className: "pos-badge" }, badge.join(" · ")),
        tags.length > 0 && h("div", { className: "tags" }, tags.map((t, i) => h("span", { key: i, className: "tag" }, t)))
      ),

      h("div", { className: "fbody" },

        /* ── ACEPCIONES (léxico central) ── */
        h("div", { className: "section-lbl" }, "Acepciones"),
        (lex.senses || []).map((s, i) => h("div", { key: i, className: "sense" },
          h("span", { className: "sense-num" }, i + 1),
          h("span", { className: "sense-es" }, s.es),
          s.definitionEs && h("div", { className: "sense-def" }, s.definitionEs)
        )),

        /* ── DECLINACIÓN (data-casos.js) ── */
        tabla && h("div", null,
          h("div", { className: "section-lbl" }, "Declinación"),
          buscada && h("div", { className: "busco" }, h("b", null, buscada.forma), " es " + buscada.etiquetas.join(" / ") + " de ", h("b", null, d.ru), ". Está resaltada en la tabla."),
          selector,
          tabla,
          h("div", { className: "tnote" }, "Tocá un caso para ver para qué se usa, o una forma para escucharla.")
        ),
        d.tipo === "indeclinable" && h("div", null,
          h("div", { className: "section-lbl" }, "Declinación"),
          h("div", { className: "nota" }, "Esta palabra no cambia: tiene la misma forma, ", h("b", { style: { color: c.text } }, d.ru), ", en todos los casos.")
        ),

        /* ── FORMA CORTA ── */
        d.corta && h("div", null,
          h("div", { className: "section-lbl" }, "Forma corta"),
          h(TablaCorta, { corta: d.corta }),
          h("div", { className: "help-row" }, h(Ayuda, { fid: "formaCorta", texto: "Forma corta", onForma: setForma }))
        ),

        ayudas.length > 0 && h("div", null,
          h("div", { className: "section-lbl" }, "Formas especiales"),
          d.loc2 && h("div", { className: "tnote", style: { marginTop: 0 } }, "Para decir dónde: ", h("b", { style: { color: c.text } }, d.loc2), ". Para hablar de algo se usa el preposicional normal."),
          d.conteo && h("div", { className: "tnote", style: { marginTop: 0 } }, "Después de 2, 3 y 4: ", h("b", { style: { color: c.text } }, "два " + d.conteo), ", no ", h("b", { style: { color: c.text } }, d.sg ? d.sg[1] : ""), ". El genitivo normal se usa en los demás casos."),
          d.partitivo && h("div", { className: "tnote" }, "Partitivo coloquial: ", h("b", { style: { color: c.text } }, d.partitivo), " («un poco de»). El genitivo normal siempre es correcto."),
          h("div", { className: "help-row" }, ayudas.map(a => h(Ayuda, { key: a[0], fid: a[0], texto: a[1], onForma: setForma })))
        ),

        d.nota && h("div", null,
          h("div", { className: "section-lbl" }, "Nota"),
          h("div", { className: "nota" }, d.nota)
        )
      )
    ),
    caso && h(CasoSheet, { cid: caso, formas: formasEnCaso(d, GRAMATICA_CASOS_ORDEN.indexOf(caso)), base: formasEnCaso(d, 0), onClose: () => setCaso(null) }),
    forma && h(FormaSheet, { fid: forma, onClose: () => setForma(null) })
  );
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [q, setQ] = useState("");
  const qRef = useRef(null);
  const searchWrapRef = useRef(null);
  const [headerH, setHeaderH] = useState(0);
  const [searchH, setSearchH] = useState(0);
  const [, setFormasListas] = useState(0);

  /* Cuando terminan de cargarse las formas, se repite la búsqueda */
  useEffect(() => {
    const f = () => setFormasListas(n => n + 1);
    window.addEventListener("az-formas", f);
    return () => window.removeEventListener("az-formas", f);
  }, []);

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      await azLoadProgress();
      azModuleTouch('casos');
    })();
  }, []);

  /* Mismo patrón que ficha.html y verbos.html: la barra de búsqueda
     queda fija justo debajo del header del shell. */
  useLayoutEffect(() => {
    function measure() {
      const header = document.querySelector("header");
      if (header) setHeaderH(header.getBoundingClientRect().height);
      if (searchWrapRef.current) setSearchH(searchWrapRef.current.getBoundingClientRect().height);
    }
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, [darkMode]);

  const id = getWordId();
  const c = azColors(darkMode);
  const results = (q.trim() && typeof azSearchLexicon === "function" ? azSearchLexicon(q, POS_DECLINABLE) : [])
    .filter(r => casosById(r.id))
    .map(r => Object.assign({}, r, { href: r.forma ? r.href : "casos.html?id=" + r.id }));

  const resultRows = results.map((r, i) => h("a", {
      key: r.href, href: r.href, className: "res-row",
      onClick: (e) => azNavigate(e, r.href),
      style: { borderTop: i === 0 ? "none" : `1px solid ${c.border}` }
    },
      h("span", null, h("span", { className: "res-ru" }, r.acento || r.ru),
        h("span", { className: "res-asp" }, POS_SHORT[r.pos] || "")),
      h("span", { className: "res-es" }, r.es)
    ));
  const noResults = h("div", { style: { padding: "12px 14px", fontSize: 13, color: c.textMuted } }, "Sin resultados");

  /* Campo de búsqueda: el mismo en la portada (dentro de la página)
     y en la ficha (fijo debajo del header). */
  const campo = [
      h("input", {
        ref: qRef, value: q,
        onInput: (e) => setQ(e.target.value),
        placeholder: "Buscar sustantivo, adjetivo, pronombre…",
        style: { width: "100%", boxSizing: "border-box", background: c.bg3, border: `1px solid ${c.border}`, borderRadius: 9, padding: "10px 34px 10px 14px", color: c.text, fontSize: 14 }
      }),
      q && h("button", {
        onClick: () => { setQ(""); if (qRef.current) qRef.current.focus(); },
        "aria-label": "Limpiar búsqueda",
        style: { position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", width: 24, height: 24, borderRadius: "50%", background: c.border, border: "none", color: c.text, fontSize: 13, lineHeight: 1, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }
      }, "✕")
  ];
  const searchBar = id && h("div", {
    ref: searchWrapRef,
    style: { position: "fixed", top: headerH, left: 0, right: 0, zIndex: 90, background: c.bg, backdropFilter: "blur(12px)", borderBottom: `1px solid ${c.border}`, padding: "12px 3vw" }
  },
    h("div", { style: { maxWidth: 960, margin: "0 auto", position: "relative" } },
      ...campo,
      /* En la ficha, los resultados flotan por delante (como ficha.html) */
      id && q.trim() && h("div", {
        style: { position: "absolute", top: "calc(100% + 6px)", left: 0, right: 0, zIndex: 50, maxHeight: "50vh", overflowY: "auto", background: c.card, border: `1px solid ${c.border}`, borderRadius: 10, boxShadow: "0 16px 40px rgba(0,0,0,.4)" }
      }, results.length ? resultRows : noResults)
    )
  );

  /* Portada: presentación del módulo (título, qué hay y para qué
     sirve), el buscador y palabras para probar. Entra en una sola
     pantalla de iPhone. Al escribir, la presentación se esconde y
     quedan el buscador y los resultados. */
  const modulo = (typeof AZ_MODULES !== "undefined" ? AZ_MODULES : []).find(m => m.id === "casos") || {};
  const ICON_COLOR = { red: "#B5605C", orange: "#C48254", yellow: "#C9B369", green: "#5C9B78", blue: "#5D7DA6", purple: "#8871A8" };
  const total = typeof CASOS !== "undefined" ? Object.keys(CASOS).length.toLocaleString("es-AR") : "";
  const INTRO_ITEMS = [["Tablas completas", "Los 6 casos de cada palabra, en singular y plural o por género."], ["Qué es cada caso", "Tocá un caso para ver para qué sirve, con ejemplos explicados."], ["Formas especiales", "Locativo, partitivo, forma corta y acusativo animado, cuando la palabra los tiene."]];
  const EJEMPLOS = [["CMR-00230", "кни́га"], ["CMR-00096", "большо́й"], ["CMR-00007", "он"]];
  const buscando = !!q.trim();
  const portada = h("div", null,
    !buscando && h("div", { className: "intro" },
      h("div", { className: "intro-top" },
        h("div", { className: "intro-icon", style: { background: ICON_COLOR[modulo.icon] || c.gold } }, modulo.glyph || ""),
        h("div", null,
          h("div", { className: "intro-title" }, modulo.title || ""),
          total && h("div", { className: "intro-kicker" }, total + " palabras · 6 casos")
        )
      ),
      h("div", { className: "intro-desc" }, "En ruso, las palabras cambian de terminación según su función en la oración. Acá encontrás cómo se declina cada sustantivo, adjetivo, pronombre y número del diccionario."),
      INTRO_ITEMS.map((it, i) => h("div", { key: i, className: "intro-item" },
        h("span", { className: "intro-dot" }),
        h("div", null, h("div", { className: "intro-it" }, it[0]), h("div", { className: "intro-id" }, it[1]))
      ))
    ),
    h("div", { style: { position: "relative" } }, ...campo),
    !buscando && h("div", { className: "search-hint" }, "Podés buscar en ruso o en español, o escribir una forma declinada: тебе́ te lleva a ты."),
    !buscando && h("div", { className: "try-row" },
      h("span", { className: "try-lbl" }, "Probá con:"),
      EJEMPLOS.map(e => h("a", { key: e[0], className: "try-chip", href: "casos.html?id=" + e[0], onClick: (ev) => azNavigate(ev, "casos.html?id=" + e[0]) }, e[1]))
    ),
    buscando && h("div", { style: { marginTop: 10, background: c.card, border: `1px solid ${c.border}`, borderRadius: 10, overflow: "hidden", animation: "fadeIn 0.3s ease" } },
      results.length ? resultRows : noResults)
  );

  return h(AzShell, { darkMode, setDarkMode, moduleId: "casos", tabs: [] },
    h(CasosStyles, { c }),
    searchBar,
    h("div", { style: { paddingTop: id ? (searchH ? searchH + 14 + "px" : "18px") : "16px" } },
      id ? h(FichaCasos, { key: id, id, c }) : portada)
  );
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
