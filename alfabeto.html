<!DOCTYPE html>
<html lang="es" data-tl="siempre">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Азбука">
<title>Азбука · Alfabeto</title>
<meta name="theme-color" content="#0F0F14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/core.css">
<style>
  .page-gap{margin-top:16px;}

  /* ── Vista grid ── */
  .abc-hero{width:100%;box-sizing:border-box;text-align:center;padding:26px 20px;border-radius:20px;margin-bottom:14px;}
  .abc-hero-letters{font-size:30px;font-weight:800;letter-spacing:6px;margin-bottom:10px;}
  .abc-hero-title{font-size:20px;font-weight:800;margin-bottom:6px;}
  .abc-hero-tag{font-size:12.5px;}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
  .stat-card{border-radius:14px;padding:12px 8px;text-align:center;}
  .stat-num{font-size:20px;font-weight:800;line-height:1;}
  .stat-lbl{font-size:9.5px;margin-top:4px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}

  .pbar-track{width:100%;height:6px;border-radius:3px;overflow:hidden;margin-bottom:14px;}
  .pbar-fill{height:100%;border-radius:3px;transition:width .3s ease;}

  .toggle-row{display:flex;gap:8px;margin-bottom:16px;}
  .toggle-btn{flex:1;text-align:center;padding:8px 6px;border-radius:10px;font-size:11.5px;font-weight:600;cursor:pointer;transition:.18s;}

  .abc-search{width:100%;box-sizing:border-box;border-radius:10px;padding:11px 14px;font-size:16px;margin-bottom:14px;}

  .lgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  @media (max-width:600px){.lgrid{grid-template-columns:repeat(3,1fr);}}
  .lcard{position:relative;border-radius:14px;padding:14px 6px;text-align:center;}

  /* ── Vista detalle ── */
  .det-hero{border-radius:18px;padding:22px 20px;margin-bottom:14px;}
  .det-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .det-glyph{font-size:56px;font-weight:800;line-height:1;text-align:center;flex-shrink:0;}
  .det-cursive{font-family:'CyrCursive',cursive;font-size:56px;opacity:.7;margin-top:4px;}
  .det-name{font-size:20px;font-weight:800;margin-bottom:4px;}
  .det-translit{font-size:13px;margin-bottom:6px;}
  .det-pron{font-size:13.5px;line-height:1.5;margin-bottom:10px;}
  .status-row{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid;}
  .status-btn{flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;transition:.18s;}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  @media (max-width:600px){.info-grid{grid-template-columns:1fr;}}
  .info-card{border-radius:14px;padding:16px;}
  .info-title{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;}
  .info-text{font-size:13px;line-height:1.55;margin-bottom:8px;}
  .info-sub{font-size:11px;font-weight:700;margin-bottom:3px;}

  .card{border-radius:14px;padding:16px;margin-bottom:14px;}

  .word-row{display:flex;align-items:center;gap:12px;padding:12px 0;}
  .word-row + .word-row{border-top:1px solid;}
  .word-main{flex:1;min-width:0;}
  .word-ru{font-size:16px;font-weight:700;}
  .word-translit{font-size:11.5px;margin-top:1px;}
  .word-cursive{font-family:'CyrCursive',cursive;font-size:15px;opacity:.7;margin-top:2px;}
  .word-es{font-size:12.5px;margin-top:3px;}
  .word-note{font-size:11px;font-style:italic;margin-top:3px;line-height:1.4;}
  .word-btns{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
  .word-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0;}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/preact.js"></script>
<script src="data/data-catalogo.js"></script>
<script src="js/core.js"></script>
<!-- Los datos de la dirección activa (27/10/2026): en Azbuka, el léxico ruso y el
     alfabeto cirílico; en Abecé, el léxico español y el alfabeto español -->
<script>
(AZ_DIRECCION.id === "abece"
  ? ["data/data-lexicon-es.js", "data/data-alfabeto-es.js"]
  : ["data/data-lexicon.js", "data/data-alphabet.js"]
).forEach(src => document.write('<script src="' + src + '"><\/script>'));
</script>
<script src="assets/supabase.js"></script>
<script src="js/cuenta.js"></script>
<script src="js/progress.js"></script>
<script src="js/shell.js"></script>
<script src="js/mano.js"></script>
<script>
const { useState, useEffect } = htmPreact;

/* ── Dirección (27/10/2026): Azbuka (alfabeto cirílico, textos en español) o
   Abecé (alfabeto español, textos en ruso: borrador para Iván). La página y
   las clases son las mismas; cambian los datos (ALFABETO_ES, con «es» en las
   palabras y los dígrafos ch, ll, rr, qu, gu al final), la voz y los textos. ── */
const ES = AZ_DIRECCION.id === "abece" && typeof ALFABETO_ES !== "undefined";
const LETRAS = ES ? ALFABETO_ES : ALPHABET;
if (ES) document.title = "Abecé · Алфавит";
const CLAVE = l => (ES ? "abc-es:" : "alfabeto:") + l.upper;   /* semáforo de cada letra */
const TX = ES ? {
  buscar: "Найти букву…", heroLetras: "A B C D", heroTitulo: "Испанский алфавит",
  heroTag: n => "27 букв и " + n + " сочетаний · Звуки, письмо и примеры",
  total: "Всего", aprendiendo: "Изучаю", dominadas: "Выучено", mano: "✍️ Писать от руки",
  pron: "Произношение", nombres: "Названия", nada: q => "Нет букв по запросу «" + q + "»",
  digrafos: "Сочетания букв: один звук",
  manoTitulo: "Писать от руки", manoDesc: "Так испанцы пишут от руки. Нарисуй букву пальцем: сначала обведи её, потом — сама.",
  volver: "Алфавит", ant: "Предыдущая буква", sig: "Следующая буква",
  sonido: (l) => "Звук: /" + l.translit + "/" + (l.ipa && l.ipa.length ? " · IPA: " + l.ipa.map(x => "[" + x + "]").join(", ") : ""),
  escuchar: "▶ Слушать", escribir: "✍️ Написать",
  niveles: ["Не изучено", "Изучаю", "Выучено"],
  comoPron: "Как произносить", parecido: "Похоже в русском", errores: "Частые ошибки", consejo: "Совет",
  similares: "Похожие буквы", palabras: "Слова для практики", ficha: "Открыть в словаре"
} : {
  buscar: "Buscar letra…", heroLetras: "А Б В Г", heroTitulo: "El Alfabeto Cirílico Ruso",
  heroTag: () => "33 letras · Pronunciación, escritura y uso real",
  total: "Total", aprendiendo: "Aprendiendo", dominadas: "Dominadas", mano: "✍️ Escribir a mano",
  pron: "Pronunciación", nombres: "Nombres", nada: q => `No se encontraron letras para "${q}"`,
  digrafos: "",
  manoTitulo: "Escribir a mano", manoDesc: "Así escriben los rusos a mano. Dibuja la letra con el dedo: primero calcándola y después sola.",
  volver: "Alfabeto", ant: "Letra anterior", sig: "Letra siguiente",
  sonido: (l) => "Transliteración: /" + l.translit + "/",
  escuchar: "▶ Escuchar letra", escribir: "✍️ Escribirla",
  niveles: ["No estudiada", "Aprendiendo", "Dominada"],
  comoPron: "Cómo pronunciarlo", parecido: "Parecido en español", errores: "Errores comunes", consejo: "Consejo",
  similares: "Letras similares", palabras: "Palabras de práctica", ficha: "Ver en el Diccionario"
};
/* Textos de mano.js en Abecé (en Azbuka, los suyos por defecto) */
const MANO_TX_RU = {
  calcar: "Обвести", libre: "Самому", may: "Заглавная", min: "Строчная", ant: "Предыдущая буква", sig: "Следующая буква",
  libreAyuda: may => "Нарисуй " + (may ? "заглавную" : "строчную") + " букву, не глядя на образец.",
  lienzo: "Поле для рисования буквы", borrar: "Стереть", escuchar: "▶ Слушать", comprobar: "Проверить",
  vacio: "Сначала нарисуй букву.", bien: "✓ Верно", casi: "≈ Почти", mal: "✗ Неверно",
  resultado: (f, cob, prec) => "Совпадение: " + f + " %. Ты покрыл " + cob + " % буквы, и " + prec + " % твоей линии лежит на ней. Зелёным — образец.",
  nota: "Приложение сравнивает только итоговую форму, а не порядок и направление линий. Это подсказка для практики: все пишут немного по-разному."
};
const hablarLetra = l => ES ? azHablarEs(l.name) : azHablarRu(l.lower);
const hablarPalabra = w => ES ? azHablarEs(w.es) : azHablarRu(w.cyrillic);
function speakRu(text) { azHablarRu(text); }   /* voz compartida: core.js */

/* Resalta la letra en la palabra. En Abecé, sin importar la tilde (a = á) y
   con los dígrafos como un bloque (ll, rr, qu…). */
function highlightWord(word, letter) {
  const sty = { color: "#C9A84C", fontWeight: 800 };
  if (!ES) {
    return word.split("").map((ch, i) => {
      const match = ch === letter.upper || ch === letter.lower;
      return match ? React.createElement("span", { key: i, style: sty }, ch) : ch;
    });
  }
  const base = t => t.toLowerCase().replace(/[áàä]/g, "a").replace(/[éè]/g, "e").replace(/[íï]/g, "i").replace(/[óò]/g, "o").replace(/[úü]/g, "u");
  const pat = letter.lower === "ñ" || letter.lower === "ü" ? letter.lower : base(letter.lower);
  const w = letter.lower === "ñ" ? word.toLowerCase() : base(word);
  const out = [];
  for (let i = 0; i < word.length;) {
    if (w.substr(i, pat.length) === pat) { out.push(React.createElement("span", { key: i, style: sty }, word.substr(i, pat.length))); i += pat.length; }
    else { out.push(word[i]); i++; }
  }
  return out;
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const MANO0 = new URLSearchParams(location.search).get("mano");
  const [page, setPage] = useState(MANO0 ? "mano" : "grid"); // grid | detail | mano
  const [manoLetra, setManoLetra] = useState(MANO0 || (ES ? "A" : "А"));
  const [selectedId, setSelectedId] = useState(null);
  const [search, setSearch] = useState("");
  const [showPronun, setShowPronun] = useState(true);
  const [showNames, setShowNames] = useState(true);
  const [showTranslit, setShowTranslit] = useState(true);
  const [letterLevels, setLetterLevels] = useState({});

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      await azLoadProgress();
      const lv = {};
      LETRAS.forEach(l => { lv[l.upper] = azItem(CLAVE(l)).level; });
      setLetterLevels(lv);
      azModuleTouch('alfabeto');
    })();
  }, []);

  function setLevel(letter, level) {
    azSetItemLevel(CLAVE(letter), level);
    setLetterLevels(prev => ({ ...prev, [letter.upper]: level }));
  }

  function openLetter(letter) {
    setSelectedId(letter.id);
    setPage("detail");
  }

  const c = azColors(darkMode);
  const orange = darkMode ? "#E2884A" : "#C85A1A";
  const yellow = "#C9B369";
  const green = darkMode ? "#4CAF82" : "#2E7D55";

  const selected = selectedId ? LETRAS.find(l => l.id === selectedId) : null;
  const idx = selected ? LETRAS.findIndex(l => l.id === selected.id) : -1;
  function goPrev() { if (idx > 0) setSelectedId(LETRAS[idx - 1].id); }
  function goNext() { if (idx < LETRAS.length - 1) setSelectedId(LETRAS[idx + 1].id); }

  const learning = Object.values(letterLevels).filter(v => v === 1).length;
  const dominated = Object.values(letterLevels).filter(v => v === 2).length;
  const pct = Math.round((dominated / LETRAS.length) * 100);

  const q = search.trim().toLowerCase();
  const filtered = !q ? LETRAS : LETRAS.filter(l =>
    l.upper.toLowerCase().includes(q) || l.lower.includes(q) ||
    l.name.toLowerCase().includes(q) || azSinMarcas(l.pronunciation).toLowerCase().includes(q) || (l.nameTl || "").includes(q)
  );

  const tabs = page === "mano" ? [
    { id: "back", icon: "⊞", label: TX.volver, action: () => setPage("grid") }
  ] : page === "detail" ? [
    { id: "back", icon: "⊞", aria: TX.volver, action: () => setPage("grid") },
    { id: "prev", icon: "‹", aria: TX.ant, action: goPrev },
    { id: "count", texto: `${idx + 1} / ${LETRAS.length}` },
    { id: "next", icon: "›", aria: TX.sig, action: goNext }
  ] : [];

  return React.createElement(AzShell, {
    darkMode, setDarkMode, moduleId: "alfabeto", tabs
  },

    page === "mano" && React.createElement("div", { className: "page-gap", style: { animation: "fadeIn 0.3s ease" } },
      React.createElement("h1", { style: { fontSize: 24, fontWeight: 800, color: c.text, margin: "4px 0 6px" } }, TX.manoTitulo),
      React.createElement("div", { style: { fontSize: 13.5, color: c.textMuted, lineHeight: 1.6, marginBottom: 12 } }, TX.manoDesc),
      ES ? React.createElement(AzEscrituraMano, { key: manoLetra, letras: LETRAS.filter(l => !l.digrafo).map(l => Object.assign({}, l, { hablar: l.name })), inicial: manoLetra, c, tx: MANO_TX_RU, hablar: t => azHablarEs(t), lang: "es" })
         : React.createElement(AzEscrituraMano, { key: manoLetra, letras: LETRAS, inicial: manoLetra, c })
    ),

    page === "grid" && React.createElement("div", { className: "page-gap", style: { animation: "fadeIn 0.3s ease" } },

      React.createElement("input", {
        className: "abc-search", value: search, onInput: (e) => setSearch(e.target.value),
        placeholder: TX.buscar,
        style: { background: c.bg3, border: `1px solid ${c.border}`, color: c.text }
      }),

      React.createElement("div", { className: "abc-hero", style: { background: c.card, border: `1px solid ${c.border}` } },
        React.createElement("div", { className: "abc-hero-letters", style: { color: c.gold } }, TX.heroLetras),
        React.createElement("div", { className: "abc-hero-title", style: { color: c.text } }, TX.heroTitulo),
        React.createElement("div", { className: "abc-hero-tag", style: { color: c.textMuted } }, TX.heroTag(LETRAS.filter(l => l.digrafo).length))
      ),

      React.createElement("div", { className: "stat-row" },
        React.createElement("div", { className: "stat-card", style: { background: c.card, border: `1px solid ${c.border}` } },
          React.createElement("div", { className: "stat-num", style: { color: c.text } }, LETRAS.length),
          React.createElement("div", { className: "stat-lbl", style: { color: c.textMuted } }, TX.total)
        ),
        React.createElement("div", { className: "stat-card", style: { background: c.card, border: `1px solid ${c.border}` } },
          React.createElement("div", { className: "stat-num", style: { color: yellow } }, learning),
          React.createElement("div", { className: "stat-lbl", style: { color: c.textMuted } }, TX.aprendiendo)
        ),
        React.createElement("div", { className: "stat-card", style: { background: c.card, border: `1px solid ${c.border}` } },
          React.createElement("div", { className: "stat-num", style: { color: green } }, dominated),
          React.createElement("div", { className: "stat-lbl", style: { color: c.textMuted } }, TX.dominadas)
        )
      ),

      React.createElement("div", { className: "pbar-track", style: { background: c.bg3 } },
        React.createElement("div", { className: "pbar-fill", style: { width: pct + "%", background: green } })
      ),

      React.createElement("button", {
        className: "btn", onClick: () => { setManoLetra(ES ? "A" : "А"); setPage("mano"); window.scrollTo(0, 0); },
        style: { width: "100%", marginBottom: 14, padding: "12px 16px", borderRadius: 10, background: c.bg3, border: `1px solid ${c.border}`, color: c.text, fontSize: 14, fontWeight: 700 }
      }, TX.mano),

      React.createElement("div", { className: "toggle-row" },
        React.createElement("div", {
          className: "toggle-btn", onClick: () => setShowPronun(v => !v),
          style: { background: showPronun ? c.gold : c.bg3, color: showPronun ? "#0F0F14" : c.textMuted, border: `1px solid ${showPronun ? c.gold : c.border}` }
        }, TX.pron),
        React.createElement("div", {
          className: "toggle-btn", onClick: () => setShowNames(v => !v),
          style: { background: showNames ? c.gold : c.bg3, color: showNames ? "#0F0F14" : c.textMuted, border: `1px solid ${showNames ? c.gold : c.border}` }
        }, TX.nombres)
      ),

      React.createElement("div", { className: "lgrid" },
        filtered.map((letter, n) => {
          const lvl = letterLevels[letter.upper] || 0;
          /* Abecé: los dígrafos van al final, con su título a lo ancho */
          const titulo = ES && letter.digrafo && !(filtered[n - 1] && filtered[n - 1].digrafo);
          const lvlColor = lvl === 2 ? green : lvl === 1 ? yellow : c.textMuted;
          const tarjeta = React.createElement("div", {
            key: letter.id, className: "lcard letter-card",
            onClick: () => openLetter(letter),
            style: { background: c.card, border: `1px solid ${lvl > 0 ? lvlColor + "55" : c.border}` }
          },
            lvl > 0 && React.createElement("span", { style: { position: "absolute", top: 6, right: 8, fontSize: 10, color: lvlColor } }, lvl === 2 ? "●" : "◑"),
            React.createElement("div", { style: { display: "flex", alignItems: "baseline", justifyContent: "center", gap: 8, lineHeight: 1 } },
              React.createElement("span", { style: { fontSize: 28, fontWeight: 800, color: c.gold } }, letter.upper),
              React.createElement("span", { style: { fontSize: 28, fontWeight: 500, color: c.textSub } }, letter.lower)
            ),
            React.createElement("div", { className: "word-cursive", style: { color: c.gold, marginTop: 6, fontSize: 28 } }, letter.upper + " " + letter.lower),
            showNames && React.createElement("div", { style: { fontSize: 10, color: c.textMuted, marginTop: 6, fontStyle: "italic" } }, letter.name),
            showPronun && React.createElement("div", { style: { fontSize: 10, color: c.textSub, marginTop: 3 } }, "/" + letter.translit + "/")
          );
          return titulo ? [React.createElement("div", { key: "dg", style: { gridColumn: "1 / -1", fontSize: 10.5, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", color: c.textMuted, margin: "10px 2px 0" } }, TX.digrafos), tarjeta] : tarjeta;
        })
      ),

      filtered.length === 0 && React.createElement("div", { style: { textAlign: "center", padding: 40, color: c.textMuted } },
        React.createElement("div", { style: { fontSize: 32, marginBottom: 6 } }, "🔍"),
        React.createElement("p", null, TX.nada(search)))
    ),

    page === "detail" && selected && React.createElement("div", { className: "page-gap", style: { animation: "fadeIn 0.25s ease" } },

      React.createElement("div", { className: "det-hero", style: { background: c.card, border: `1px solid ${c.border}` } },
        React.createElement("div", { className: "det-top" },
          React.createElement("div", null,
            React.createElement("div", { className: "det-glyph", style: { color: c.gold } }, selected.upper + " " + selected.lower),
            React.createElement("div", { className: "det-cursive", style: { color: c.gold, textAlign: "center" } }, selected.upper + "\u2009" + selected.lower)
          ),
          React.createElement("div", { style: { flex: 1, minWidth: 180 } },
            React.createElement("div", { className: "det-name", style: { color: c.text } }, ES ? selected.name + " · " + selected.nameTl : selected.name),
            React.createElement("div", { className: "det-translit", style: { color: c.textSub } }, TX.sonido(selected)),
            React.createElement("div", { className: "det-pron", style: { color: c.textMuted } }, azFmt(selected.pronunciation)),
            /* Botones en una fila con espacio (14/10/2026): si no entran, bajan alineados */
            React.createElement("div", { style: { display: "flex", flexWrap: "wrap", gap: 8, marginTop: 4 } },
            React.createElement("button", {
              className: "btn", onClick: () => hablarLetra(selected),
              style: { background: c.gold, color: "#0F0F14", fontWeight: 700, fontSize: 12.5, padding: "9px 16px", borderRadius: 10 }
            }, TX.escuchar),
            !(ES && selected.digrafo) && React.createElement("button", {
              className: "btn", onClick: () => { setManoLetra(selected.upper); setPage("mano"); window.scrollTo(0, 0); },
              style: { background: c.bg3, border: `1px solid ${c.border}`, color: c.text, fontWeight: 700, fontSize: 12.5, padding: "9px 16px", borderRadius: 10 }
            }, TX.escribir))
          )
        ),
        React.createElement("div", { className: "status-row", style: { borderColor: c.border } },
          [0, 1, 2].map(lvl => {
            const active = (letterLevels[selected.upper] || 0) === lvl;
            const col = lvl === 2 ? green : lvl === 1 ? yellow : orange;
            const label = TX.niveles[lvl];
            return React.createElement("div", {
              key: lvl, className: "status-btn", onClick: () => setLevel(selected, lvl),
              style: { background: active ? col + "22" : c.bg3, border: `1px solid ${active ? col : c.border}`, color: active ? col : c.textMuted }
            }, label);
          })
        )
      ),

      React.createElement("div", { className: "info-grid" },
        React.createElement("div", { className: "info-card", style: { background: c.card, border: `1px solid ${c.border}` } },
          React.createElement("div", { className: "info-title", style: { color: c.gold } }, TX.comoPron),
          React.createElement("div", { className: "info-text", style: { color: c.text } }, azFmt(selected.details.description)),
          React.createElement("div", { className: "info-sub", style: { color: c.textSub } }, TX.parecido),
          React.createElement("div", { className: "info-text", style: { color: c.textMuted, marginBottom: 0 } }, azFmt(selected.details.similar))
        ),
        React.createElement("div", { className: "info-card", style: { background: c.card, border: `1px solid ${c.border}` } },
          React.createElement("div", { className: "info-title", style: { color: c.gold } }, TX.errores),
          React.createElement("div", { className: "info-text", style: { color: c.text } }, azFmt(selected.details.mistakes)),
          React.createElement("div", { className: "info-sub", style: { color: c.textSub } }, TX.consejo),
          React.createElement("div", { className: "info-text", style: { color: c.textMuted, marginBottom: 0 } }, azFmt(selected.details.tips))
        )
      ),

      React.createElement("div", { className: "card", style: { background: c.card, border: `1px solid ${c.border}` } },
        React.createElement("div", { className: "info-title", style: { color: c.gold } }, TX.similares),
        React.createElement("div", { className: "info-text", style: { color: c.text, marginBottom: 0 } }, azFmt(selected.details.similar_letters))
      ),

      React.createElement("div", { className: "card", style: { background: c.card, border: `1px solid ${c.border}` } },
        React.createElement("div", { className: "info-title", style: { color: c.gold, marginBottom: 4 } }, TX.palabras),
        selected.words.map((w, i) => {
          return React.createElement("div", { key: i, className: "word-row", style: { borderColor: c.border } },
            React.createElement("div", { className: "word-main" },
              React.createElement("div", { className: "word-ru", style: { color: c.text } }, highlightWord(ES ? w.es : w.cyrillic, selected)),
              showTranslit && React.createElement("div", { className: "word-translit" + (ES ? " az-tl" : ""), style: { color: c.textSub } }, w.translit),
              React.createElement("div", { className: "word-cursive", style: { color: c.gold } }, ES ? w.es : w.cyrillic),
              React.createElement("div", { className: "word-es", style: { color: c.textMuted } }, w.meaning),
              React.createElement("div", { className: "word-note", style: { color: c.textSub } }, azFmt(w.note))
            ),
            React.createElement("div", { className: "word-btns" },
              React.createElement("button", {
                className: "word-btn btn", onClick: () => hablarPalabra(w),
                style: { background: c.bg3, border: `1px solid ${c.border}`, color: c.textMuted }
              }, "▶"),
              w.lexId && React.createElement("a", {
                className: "word-btn btn", href: "ficha.html?id=" + w.lexId, "aria-label": TX.ficha,
                onClick: (e) => azNavigate(e, "ficha.html?id=" + w.lexId),
                style: { background: c.bg3, border: `1px solid ${c.border}`, color: c.gold, textDecoration: "none" }
              }, "📖")
            )
          );
        })
      )
    )
  );
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
