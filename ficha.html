<script>
/* ============================================================
   FICHA.HTML — UNA sola página para las ~4.931 palabras de
   LEXICON_COMER. No hay (ni va a haber) un HTML por palabra:
   esta página lee el id de la URL (?id=CMR-xxxxx), busca esa
   entrada con lexComerById() y arma el contenido en runtime.
   Agregar una palabra nueva al léxico no requiere tocar ni un
   archivo HTML — ya es navegable vía ficha.html?id=<su-id>.

   El formato visual (clases .ficha/.hero/.sense/.meta-grid/etc.)
   copia 1:1 preview-fichas-ejemplo.html del repo — mismas clases,
   mismos nombres — solo que acá los colores salen de azColors()
   para respetar el toggle de tema, y el contenido sale de campos
   reales de LEXICON_COMER en vez de datos de prueba.

   Sin ?id, la página es el módulo Diccionario (01/10/2026): ver el
   componente Diccionario más abajo.

   La base de datos (data-lexicon.js) es de SOLO LECTURA: esta
   página nunca la modifica, solo la lee y la muestra.

   ABECÉ (27/10/2026): con la dirección «abece» la página lee el léxico
   español (LEXICON_ES, data-lexicon-es.js), con los textos en ruso (TX)
   y su propia ficha (FichaEs): la palabra sola con la etiqueta de
   categoría y género, como en Azbuka, y un apartado «Женский род» cuando
   la forma femenina es otra palabra (campo femenino). Lo de Azbuka no cambia.
   Entrega 2 (27/10/2026): sección «Грамматика» con el grupo del verbo (link a
   Verbos), la pareja pronominal (ir ↔ irse), «только с «se»» y el régimen
   («Управление»), y el botón «🗣️ Спряжение» en los verbos.
   ============================================================ */
const { useState, useEffect, useRef, useLayoutEffect } = htmPreact;

/* ── Dirección: Azbuka (léxico ruso) o Abecé (léxico español) ── */
const ES = typeof AZ_DIRECCION !== "undefined" && AZ_DIRECCION.id === "abece" && typeof LEXICON_ES !== "undefined";
const LEX = ES ? LEXICON_ES : (typeof LEXICON_COMER !== "undefined" ? LEXICON_COMER : []);
const LEX_TEMAS = ES ? LEXICON_ES_TEMAS : (typeof LEXICON_TEMAS !== "undefined" ? LEXICON_TEMAS : {});
const lexPorId = id => ES ? lexEsById(id) : (typeof lexComerById === "function" ? lexComerById(id) : null);
const palabraDe = e => ES ? e.es : (e.acento || e.ru);           /* la palabra como se muestra */
const clavePal = e => ES ? e.es : e.ru;                          /* la palabra para ordenar */
const traduc = s => (s && (ES ? s.ru : s.es)) || "";
/* Textos de la página por dirección (los de Abecé, en ruso: borrador para Iván) */
const TX = ES ? {
  titulo: "Словарь", palabras: n => n + " " + azPluralRu(n, "слово", "слова", "слов"), temasN: n => n + " " + azPluralRu(n, "тема", "темы", "тем"),
  intro: "Ищи слово или смотри словарь по темам и частям речи. Нажми на слово, чтобы открыть его карточку.",
  buscar: "Поиск по-испански или по-русски…", buscarEn: t => "Искать в теме «" + t + "»…", buscarAria: "Поиск в словаре", limpiar: "Очистить поиск",
  categoria: "Часть речи", temas: "Темы", tema: "Тема", todos: "Все", contar: n => n + " " + azPluralRu(n, "слово", "слова", "слов"),
  nada: "С этими фильтрами ничего не найдено.", mas: n => "Показать ещё (" + n + ")",
  pos: [["todo", "Все"], ["sustantivo", "Существительные"], ["verbo", "Глаголы"], ["adjetivo", "Прилагательные"], ["adverbio", "Наречия"], ["otro", "Другие"]],
  abr: { sustantivo: "сущ.", verbo: "гл.", adjetivo: "прил.", adverbio: "нареч." },
  buscarLex: "Поиск в словаре…", sinRes: "Ничего не найдено", noEncontrada: "Слово не найдено",
  sinId: id => id ? "В словаре нет слова с номером «" + id + "»." : "В адресе нет параметра ?id=."
} : {
  titulo: "Diccionario", palabras: n => n + " PALABRAS", temasN: n => n + " TEMAS",
  intro: "Busca una palabra o recorre el léxico por tema y por categoría. Toca cualquier palabra para abrir su ficha.",
  buscar: "Buscar en ruso o en español…", buscarEn: t => "Buscar dentro de " + t + "…", buscarAria: "Buscar en el diccionario", limpiar: "Limpiar búsqueda",
  categoria: "Categoría", temas: "Temas", tema: "Tema", todos: "Todos", contar: n => n + (n === 1 ? " palabra" : " palabras"),
  nada: "Sin resultados con estos filtros.", mas: n => "Mostrar más (" + n + ")",
  pos: null, abr: null,
  buscarLex: "Buscar en el léxico…", sinRes: "Sin resultados", noEncontrada: "Palabra no encontrada",
  sinId: id => id ? `No hay ninguna entrada con id "${id}" en el léxico.` : "Faltó el parámetro ?id= en la URL."
};
/* Plural ruso: 1 слово, 2 слова, 5 слов (21 слово, 11 слов) */
function azPluralRu(n, uno, pocos, muchos) {
  const d = n % 10, c = n % 100;
  return d === 1 && c !== 11 ? uno : d >= 2 && d <= 4 && (c < 12 || c > 14) ? pocos : muchos;
}

const POS_LABEL = {
  sustantivo: "Sustantivo", verbo: "Verbo", adjetivo: "Adjetivo", pronombre: "Pronombre", determinante: "Determinante",
  numeral: "Numeral", adverbio: "Adverbio", "preposición": "Preposición", "conjunción": "Conjunción",
  "partícula": "Partícula", "interjección": "Interjección", otro: "Otro"
};
/* Categorías que se declinan: son las que tienen tabla en Casos. */
const POS_DECLINABLE = ["sustantivo", "adjetivo", "pronombre", "determinante", "numeral"];
const GENDER_LABEL = { m: "masculino", f: "femenino", n: "neutro" };
/* El léxico usa "sí" / "no". "yes" se acepta solo mientras quede algún dato viejo. */
const ANIMATE_LABEL = { "sí": "Animado", yes: "Animado", no: "Inanimado" };
const NUMBER_CLASS_LABEL = { pluraliaTantum: "Solo se usa en plural", singulariaTantum: "Solo se usa en singular" };
const ASPECT_LABEL = { imperfectivo: "imperfectivo", perfectivo: "perfectivo", biaspectual: "biaspectual" };
/* Tu progreso (02/10/2026): el semáforo de la palabra para este alumno
   (az_progress, lex:CMR-…), con los mismos colores y chips que la
   ficha de letra de Alfabeto. Se marca solo con los ejercicios y se
   puede corregir a mano tocando un chip (azSetItemLevel). Reemplaza
   al viejo campo learningStatus del léxico, que se sacó. */
const NIVEL_LABEL = ["No estudiada", "Aprendiendo", "Dominada"];

/* Traducción de las marcas SIN_PAREJA del léxico a texto de interfaz.
   Mismo diccionario que usa verbos.html — mantenerlos iguales si se edita. */
const SIN_PAREJA_LABEL = {
  "ESTATIVO": "Verbo de estado: no tiene pareja perfectiva.",
  "INDETERMINADO": "Verbo de movimiento en varias direcciones: no forma pareja perfectiva simple.",
  "BIASPECTUAL": "Biaspectual: la misma forma sirve como imperfectivo y como perfectivo.",
  "PASIVO_IMPERSONAL": "Verbo pasivo o impersonal: no forma pareja aspectual.",
  "IDIOMATICO": "De uso idiomático: no forma pareja aspectual.",
  "YA_CUBIERTO_POR_OTRO_PAR": "Su pareja está registrada en otra entrada.",
  "HOMOGRAFO_PENDIENTE": "Pareja aspectual pendiente de revisión.",
  "BAJA_FRECUENCIA_EN_LEXICO": "Su pareja no está en el léxico.",
  /* 19/10/2026: dos marcas nuevas (revisión completa de parejas) */
  "SOLO_PERFECTIVO": "Solo perfectivo: no tiene pareja imperfectiva.",
  "ACTIVIDAD": "Actividad sin final natural: no tiene pareja perfectiva."
};

/* Tipo de relación entre un verbo y su pareja: "aspectual" (default,
   mismo verbo, cambia el aspecto) o "resultado" (verbo distinto que
   describe el desenlace exitoso del primero, ej. искать → найти).
   Solo las excepciones llevan aspectualPartnerTypes en el léxico —
   si no está marcado, se asume "aspectual". */
const PAIR_TYPE_LABEL = { aspectual: "Pareja aspectual", resultado: "Resultado de la acción",
  /* 12/10/2026: versiones con un matiz, que no son la pareja aspectual del verbo */
  delimitativo: "Versión «un rato» (no es su pareja aspectual)", incoativo: "Versión «empezar a» (no es su pareja aspectual)", idavuelta: "Versión «ir y volver» (no es su pareja aspectual)" };

/* Arma la lista de parejas a mostrar para UN sentido puntual (o para
   toda la palabra, si no tiene más de un sentido). ids puede traer
   IDs reales (CMR-xxxxx) o una marca SIN_PAREJA:xxx — nunca mezcla. */
function parejasDeSentido(entry, ids) {
  const sinPareja = (ids || []).find(x => x.indexOf("SIN_PAREJA:") === 0);
  if (sinPareja) return { sinPareja: SIN_PAREJA_LABEL[sinPareja.slice(11)] || null };
  const real = (ids || []).filter(x => x.indexOf("CMR-") === 0);
  const types = entry.aspectualPartnerTypes || {};
  const parejas = real
    .map(pid => ({ id: pid, entry: typeof lexComerById === "function" ? lexComerById(pid) : null, tipo: types[pid] || "aspectual" }))
    .filter(p => p.entry);
  return { parejas };
}

function getWordId() {
  return new URLSearchParams(window.location.search).get("id");
}

function azSpeak(ru) { azHablarRu(ru); }   /* voz compartida: core.js */

/* ── DICCIONARIO (01/10/2026) ─────────────────────────────────
   ficha.html sin ?id es la portada del módulo Diccionario: buscador,
   chips de categoría y de tema, y la grilla de temas. Con un filtro
   o una búsqueda, la lista alfabética de palabras (cada una lleva a
   su ficha). Los filtros viven en la URL (?tema=…&pos=…&q=…), así que
   «‹» desde una ficha vuelve a la misma lista. Las palabras sin tema
   solo aparecen con «Todos». */
const h = React.createElement;
const DIC_POS = TX.pos || [["todo", "Todo"], ["sustantivo", "Sustantivos"], ["verbo", "Verbos"], ["adjetivo", "Adjetivos"], ["adverbio", "Adverbios"], ["otro", "Otras"]];
const DIC_ABR = TX.abr || { sustantivo: "sust.", verbo: "verbo", adjetivo: "adj.", adverbio: "adv." };
const dicSinAc = s => ES ? azNormEs(s) : (s || "").replace(/\u0301/g, "").replace(/ё/g, "е").toLowerCase();
/* Letra del separador: en Abecé, sin tilde (Á va con A), pero la Ñ es una letra propia */
const dicLetra = e => { const L = clavePal(e)[0].toUpperCase(); return ES && L !== "Ñ" ? L.normalize("NFD")[0] : L; };
function Diccionario({ c }) {
  const P = new URLSearchParams(location.search);
  const [tema, setTema] = useState(P.get("tema"));
  const [pos, setPos] = useState(P.get("pos") || "todo");
  const [q, setQ] = useState(P.get("q") || "");
  const [max, setMax] = useState(150);
  useEffect(() => {
    const u = new URLSearchParams();
    if (tema) u.set("tema", tema); if (pos !== "todo") u.set("pos", pos); if (q) u.set("q", q);
    const s = u.toString(); history.replaceState(history.state, "", location.pathname + (s ? "?" + s : ""));
    setMax(150);
  }, [tema, pos, q]);
  const temas = LEX_TEMAS;
  const cuenta = {}; LEX.forEach(e => (e.temas || []).forEach(t => cuenta[t] = (cuenta[t] || 0) + 1));
  const modulo = (typeof AZ_MODULES !== "undefined" ? AZ_MODULES : []).find(m => m.id === "diccionario") || { glyph: "Сл", icon: "orange" };
  const col = typeof azModuloColor === "function" ? azModuloColor(modulo) : { bg: c.gold, fg: "#fff" };
  const chip = on => on ? { background: c.gold + "22", border: `1px solid ${c.gold}`, color: c.gold } : { background: c.bg2, border: `1px solid ${c.border}`, color: c.textMuted };
  const filtrando = !!tema || pos !== "todo" || !!q.trim();
  let lista = [];
  if (filtrando) {
    lista = LEX.filter(e => (!tema || (e.temas || []).indexOf(tema) >= 0) &&
      (pos === "todo" || (pos === "otro" ? !DIC_ABR[e.posNormalized] : e.posNormalized === pos)));
    const t = q.trim();
    if (t) {
      if (ES) {  /* Abecé: la palabra (o su femenino) empieza así, o la traducción rusa lo contiene */
        const n = azNormEs(t), r = azNormRu(t.toLowerCase());
        const deForma = new Set(azFormasEsHits(t).map(x => x.id));   /* buenas → bueno, canciones → canción */
        lista = lista.filter(e => deForma.has(e.id) || azNormEs(e.es).startsWith(n) || (e.femenino && e.femenino.es && azNormEs(e.femenino.es).startsWith(n)) ||
          (e.senses || []).some(s => azNormRu((s.ru || "").toLowerCase()).indexOf(r) >= 0));
      } else { const n = dicSinAc(t), es = t.toLowerCase(); lista = lista.filter(e => dicSinAc(e.ru).startsWith(n) || (e.senses || []).some(s => (s.es || "").toLowerCase().indexOf(es) >= 0)); }
    }
    lista.sort((a, b) => clavePal(a).localeCompare(clavePal(b), ES ? "es" : "ru"));
  }
  const grupos = []; lista.slice(0, max).forEach(e => { const L = dicLetra(e); const g = grupos[grupos.length - 1]; if (!g || g.L !== L) grupos.push({ L, items: [e] }); else g.items.push(e); });
  const total = String(LEX.length).replace(/\B(?=(\d{3})+$)/g, ES ? "\u00a0" : ".");
  const css = `
    .dic{padding-top:14px;padding-bottom:110px}
    .dic .intro{background:${c.card};border:1px solid ${c.border};border-radius:16px;padding:18px 18px 14px;margin-bottom:14px}
    .dic .intro-top{display:flex;align-items:center;gap:14px}
    .dic .intro-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex-shrink:0}
    .dic .intro-title{font-size:24px;font-weight:800;color:${c.text};line-height:1.1}
    .dic .intro-kicker{font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:${c.gold};margin-top:4px}
    .dic .intro-desc{font-size:13.5px;line-height:1.55;color:${c.textSub};margin-top:12px}
    .dic .srch{display:flex;align-items:center;gap:8px;background:${c.bg3};border:1px solid ${c.border};border-radius:9px;padding:0 10px}
    .dic .srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:${c.text};font-size:16px;padding:11px 0;font-family:inherit}
    .dic .x{width:24px;height:24px;border-radius:50%;background:${c.border};border:0;color:${c.text};font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
    .dic .lbl{font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:${c.textMuted};margin:16px 2px 8px}
    .dic .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -3vw;padding:0 3vw}
    .dic .chips::-webkit-scrollbar{display:none}
    .dic .pair-btn{padding:7px 11px;border-radius:10px;font-size:12.5px;font-weight:600;white-space:nowrap;font-family:inherit;flex-shrink:0;cursor:pointer;transition:.18s}
    .dic .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .dic .tcard{background:${c.card};border:1px solid ${c.border};border-radius:12px;padding:12px 12px 10px;text-align:left;font-family:inherit;cursor:pointer}
    .dic .tcard b{display:block;font-size:13.5px;color:${c.text};line-height:1.25}
    .dic .tcard span{font-size:11.5px;color:${c.gold};font-weight:700}
    .dic .sum{font-size:12.5px;color:${c.textMuted};margin:14px 2px 8px}
    .dic .sum b{color:${c.text}}
    .dic .list{background:${c.card};border:1px solid ${c.border};border-radius:12px;overflow:hidden}
    .dic .let{font-size:11px;font-weight:800;color:${c.gold};background:${c.bg2};padding:5px 14px;border-top:1px solid ${c.border}}
    .dic .grp:first-child .let{border-top:0}
    .dic .res-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 14px;border-top:1px solid ${c.border};text-decoration:none}
    .dic .let+.res-row{border-top:0}
    .dic .res-ru{color:${c.text};font-weight:600;font-size:14.5px}

    const isVerbo = entry.posNormalized === "verbo";
    const isSustantivo = entry.posNormalized === "sustantivo";
    const casosListo = typeof CASOS !== "undefined";
    const dc = casosListo ? CASOS[entry.id] : null;
    const plural = dc && dc.pl ? dc.pl[0] : null;
    const isDeclinable = POS_DECLINABLE.includes(entry.posNormalized);

    const posBadgeText = (POS_LABEL[entry.posNormalized] || entry.posNormalized) +
      (isVerbo && entry.aspect ? " · " + (ASPECT_LABEL[entry.aspect] || entry.aspect) : "");

    /* Governance (rección) vive adentro de comer[0] — solo la mostramos
       para verbos, y solo si ese verbo puntual la tiene cargada. */
    const governance = isVerbo && entry.comer && entry.comer[0] && entry.comer[0].Governance
      ? entry.comer[0].Governance
      : null;

    const unitTitles = (entry.introducedIn || [])
      .map(n => (typeof AZ_UNITS !== "undefined" ? AZ_UNITS.find(u => u.id === n) : null))
      .filter(Boolean)
      .map(u => "Unidad " + u.id + " — " + u.title);

    const colNivel = [darkMode ? "#E2884A" : "#C85A1A", "#C9B369", darkMode ? "#4CAF82" : "#2E7D55"];
    const marcarNivel = n => { azSetItemLevel("lex:" + entry.id, n); setNivel(n); };

    entryContent = React.createElement("div", { style: { animation: "fadeIn 0.3s ease" } },
      React.createElement(FichaStyles, { c }),
      React.createElement("div", { className: "ficha" },

        /* ── HERO: título, transliteración, traducción y categoría ── */
        React.createElement("div", { className: "hero" },
          React.createElement("div", { className: "ru" }, entry.acento || entry.ru),
          entry.translit && React.createElement("div", { className: "translit az-tl" }, entry.translit),
          entry.ipa && React.createElement("div", { className: "ipa" }, "IPA: /" + entry.ipa + "/"),
          React.createElement("span", { className: "pos-badge" }, posBadgeText),

          /* Rección (Governance) — solo para verbos, solo si está cargada */
          governance && React.createElement("div", { className: "governance" },
            "Rige: ", React.createElement("b", null, governance))
        ),

        React.createElement("div", { className: "fbody" },

          /* ── ACEPCIONES ── */
          React.createElement("div", { className: "section-lbl" }, "Acepciones"),
          senses.map((s, i) => {
            /* Si el sentido tiene su propio aspectualPartner (verbos con
               más de una acepción, ver METODOLOGIA de senses), se usa ese.
               Si no, y es el único sentido de la palabra, se cae al
               aspectualPartner de nivel superior — así las ~1.630 palabras
               de un solo sentido siguen mostrando su pareja igual. */
            const idsDeEsteSentido = isVerbo
              ? (s.aspectualPartner || (senses.length === 1 ? entry.aspectualPartner : null))
              : null;
            const info = idsDeEsteSentido ? parejasDeSentido(entry, idsDeEsteSentido) : null;

            return React.createElement("div", { key: i, className: "sense" },
              React.createElement("span", { className: "sense-num" }, i + 1),
              React.createElement("span", { className: "sense-es" }, s.es),
              s.definitionEs && React.createElement("div", { className: "sense-def" }, s.definitionEs),
              info && info.sinPareja &&
                React.createElement("div", { className: "sense-pair empty" }, info.sinPareja),
              info && info.parejas && info.parejas.length > 0 &&
                React.createElement("div", { className: "sense-pair" },
                  info.parejas.map((p, j) => React.createElement("div", { key: p.id },
                    (p.tipo !== "aspectual" ? "→ " : "↔ ") + (PAIR_TYPE_LABEL[p.tipo] || PAIR_TYPE_LABEL.aspectual) + ": ",
                    React.createElement("a", {
                      href: "ficha.html?id=" + p.id,
                      onClick: (e) => azNavigate(e, "ficha.html?id=" + p.id)
                    }, p.entry.acento || p.entry.ru)
                  ))
                )
            );
          }),

          /* ── CULTURA: notas de data-cultura.js que hablan de esta
             palabra. Cada una abre su hoja en Diálogos. ── */
          (() => {
            const notas = typeof culturaDePalabra === "function" ? culturaDePalabra(entry.id) : [];
            if (!notas.length) return null;
            return React.createElement("div", null,
              React.createElement("div", { className: "section-lbl", style: { marginTop: 20 } }, "Cultura"),
              notas.map(n => {
                const href = "dialogos.html?cul=" + n.id;
                return React.createElement("a", {
                  key: n.id, href, className: "sense",
                  onClick: (e) => azNavigate(e, href),
                  style: { display: "block", textDecoration: "none" }
                },
                  React.createElement("span", { className: "sense-es" }, n.titulo, React.createElement("span", { style: { color: c.gold, marginLeft: 6 } }, "›")),
                  React.createElement("div", { className: "sense-def", style: { marginLeft: 0 } }, n.resumen)
                );
              })
            );
          })(),

          /* ── CLASIFICACIÓN PEDAGÓGICA (traducida y filtrada) ── */
          /* ── TU PROGRESO: semáforo de la palabra ── */
          React.createElement("div", { className: "section-lbl" }, "Tu progreso"),
          React.createElement("div", { className: "nivel-row" },
            [0, 1, 2].map(n => React.createElement("button", {
              key: n, className: "nivel-btn", onClick: () => marcarNivel(n),
              style: nivel === n
                ? { background: colNivel[n] + "22", border: `1px solid ${colNivel[n]}`, color: colNivel[n] }
                : { background: c.bg3, border: `1px solid ${c.border}`, color: c.textMuted }
            }, NIVEL_LABEL[n]))),
          React.createElement("div", { className: "nivel-nota" }, "Se marca solo con los ejercicios. Si no coincide con lo que sabes, toca para corregirlo."),

          React.createElement("div", { className: "section-lbl" }, "Clasificación pedagógica"),
          React.createElement("div", { className: "meta-grid" },
            React.createElement("div", { className: "meta-item" },
              React.createElement("div", { className: "meta-k" }, "Se enseña en"),
              React.createElement("div", { className: "meta-v" + (unitTitles.length ? "" : " empty") },
                unitTitles.length ? unitTitles.join(", ") : "Sin asignar")
            ),
            isSustantivo && entry.gender && React.createElement("div", { className: "meta-item" },
              React.createElement("div", { className: "meta-k" }, "Género"),
              React.createElement("div", { className: "meta-v" }, GENDER_LABEL[entry.gender] || entry.gender)
            ),
            isSustantivo && entry.animate && React.createElement("div", { className: "meta-item" },
              React.createElement("div", { className: "meta-k" }, "Animado"),
              React.createElement("div", { className: "meta-v" }, ANIMATE_LABEL[entry.animate] || entry.animate)
            ),
            /* Forma plural: se lee de data-casos.js (fuente única de las
               declinaciones); el léxico ya no la guarda. Casos se carga
               solo al abrir un sustantivo (ver useEffect en App). */
            isSustantivo && React.createElement("div", { className: "meta-item" },
              React.createElement("div", { className: "meta-k" }, "Forma plural"),
              entry.numberClass && NUMBER_CLASS_LABEL[entry.numberClass]
                ? React.createElement("div", { className: "meta-v" },
                    React.createElement("span", { className: "irregular-tag" }, NUMBER_CLASS_LABEL[entry.numberClass]))
                : plural
                  ? React.createElement("a", {
                      className: "meta-v meta-link",
                      href: "casos.html?id=" + entry.id,
                      onClick: (e) => azNavigate(e, "casos.html?id=" + entry.id)
                    }, plural)
                  : React.createElement("div", { className: "meta-v empty" }, casosListo ? "No cambia" : "…")
            )
          ),

          /* ── BOTONES: módulo correspondiente (si aplica) + audio ── */
          React.createElement("div", { className: "buttons" },
            isVerbo && React.createElement("a", {
              className: "btn pr", href: "verbos.html?id=" + entry.id,
              onClick: (e) => azNavigate(e, "verbos.html?id=" + entry.id)
            }, "🗣️ Ver en Verbos"),
            isDeclinable && React.createElement("a", {
              className: "btn pr", href: "casos.html?id=" + entry.id,
              onClick: (e) => azNavigate(e, "casos.html?id=" + entry.id)
            }, "📐 Ver en Casos"),
            (typeof azVozQuiero === "function" ? azVozQuiero(entry.acento || entry.ru) : null, null),   /* su audio, en segundo plano (17/10/2026) */
            React.createElement("button", {
              className: "btn", onClick: () => azSpeak(entry.acento || entry.ru)
            }, "▶ Pronunciación"),
            typeof azGuardarEnCuaderno === "function" && React.createElement("button", {
              className: "btn", onClick: () => azGuardarEnCuaderno((entry.acento || entry.ru) + " — " + (entry.senses || []).map(x => x.es).join("; "), { titulo: "Ficha · " + (entry.acento || entry.ru), href: "ficha.html?id=" + entry.id })
            }, "＋ Cuaderno")
          )
        )
      )
    );
  }

  /* Sin ?id: portada del Diccionario */
  if (!getWordId()) return React.createElement(AzShell, { darkMode, setDarkMode, moduleId: "diccionario", tabs: [] },
    React.createElement(Diccionario, { c: azColors(darkMode) }));
  return React.createElement(AzShell, {
    darkMode, setDarkMode,
    moduleId: null,
    tabs: [],
  }, searchBar, React.createElement("div", { style: { paddingTop: searchH ? searchH + 14 + "px" : "18px" } }, entryContent));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
