<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Азбука — Ficha de palabra</title>
<link rel="stylesheet" href="core.css">
</head>
<body>
<div id="root"></div>
<script src="preact.js"></script>
<script src="data-lexicon.js"></script>
<script src="core.js"></script>
<script src="shell.js"></script>
<script>
/* ============================================================
   FICHA.HTML — UNA sola página para las ~4.931 palabras de
   LEXICON_COMER. No hay (ni va a haber) un HTML por palabra:
   esta página lee el id de la URL (?id=CMR-xxxxx), busca esa
   entrada con lexComerById() y arma el contenido en runtime.
   Agregar una palabra nueva al léxico no requiere tocar ni un
   archivo HTML — ya es navegable vía ficha.html?id=<su-id>.

   El formato visual (clases .ficha/.hero/.sense/.meta-grid/etc.)
   copia 1:1 preview-fichas-ejemplo.html del repo — mismas clases,
   mismos nombres — solo que acá los colores salen de azColors()
   para respetar el toggle de tema, y el contenido sale de campos
   reales de LEXICON_COMER en vez de datos de prueba.

   La base de datos (data-lexicon.js) es de SOLO LECTURA: esta
   página nunca la modifica, solo la lee y la muestra.
   ============================================================ */
const { useState, useEffect, useRef, useLayoutEffect } = htmPreact;

const POS_LABEL = {
  sustantivo: "Sustantivo", verbo: "Verbo", adjetivo: "Adjetivo", pronombre: "Pronombre",
  numeral: "Numeral", adverbio: "Adverbio", "preposición": "Preposición", "conjunción": "Conjunción",
  "partícula": "Partícula", "interjección": "Interjección", otro: "Otro"
};
/* Categorías que se declinan: son las que tienen tabla en Casos. */
const POS_DECLINABLE = ["sustantivo", "adjetivo", "pronombre", "numeral"];
const GENDER_LABEL = { m: "masculino", f: "femenino", n: "neutro" };
/* El léxico usa "sí" / "no". "yes" se acepta solo mientras quede algún dato viejo. */
const ANIMATE_LABEL = { "sí": "Animado", yes: "Animado", no: "Inanimado" };
const NUMBER_CLASS_LABEL = { pluraliaTantum: "Solo se usa en plural", singulariaTantum: "Solo se usa en singular" };
const ASPECT_LABEL = { imperfectivo: "imperfectivo", perfectivo: "perfectivo", biaspectual: "biaspectual" };
/* learningStatus todavía no tiene valores reales cargados en la base
   (hoy es null en las 4.931 entradas) — este mapa es una previsión
   para cuando se empiece a poblar; lo no mapeado se muestra tal cual. */
const LEARNING_STATUS_LABEL = { taught: "Enseñada", seen: "Vista", review: "En repaso", new: "Nueva" };

/* Traducción de las marcas SIN_PAREJA del léxico a texto de interfaz.
   Mismo diccionario que usa verbos.html — mantenerlos iguales si se edita. */
const SIN_PAREJA_LABEL = {
  "ESTATIVO": "Verbo de estado: no tiene pareja perfectiva.",
  "INDETERMINADO": "Verbo de movimiento en varias direcciones: no forma pareja perfectiva simple.",
  "BIASPECTUAL": "Biaspectual: la misma forma sirve como imperfectivo y como perfectivo.",
  "PASIVO_IMPERSONAL": "Verbo pasivo o impersonal: no forma pareja aspectual.",
  "IDIOMATICO": "De uso idiomático: no forma pareja aspectual.",
  "YA_CUBIERTO_POR_OTRO_PAR": "Su pareja está registrada en otra entrada.",
  "HOMOGRAFO_PENDIENTE": "Pareja aspectual pendiente de revisión.",
  "BAJA_FRECUENCIA_EN_LEXICO": "Su pareja no está en el léxico."
};

/* Tipo de relación entre un verbo y su pareja: "aspectual" (default,
   mismo verbo, cambia el aspecto) o "resultado" (verbo distinto que
   describe el desenlace exitoso del primero, ej. искать → найти).
   Solo las excepciones llevan aspectualPartnerTypes en el léxico —
   si no está marcado, se asume "aspectual". */
const PAIR_TYPE_LABEL = { aspectual: "Pareja aspectual", resultado: "Resultado de la acción" };

/* Arma la lista de parejas a mostrar para UN sentido puntual (o para
   toda la palabra, si no tiene más de un sentido). ids puede traer
   IDs reales (CMR-xxxxx) o una marca SIN_PAREJA:xxx — nunca mezcla. */
function parejasDeSentido(entry, ids) {
  const sinPareja = (ids || []).find(x => x.indexOf("SIN_PAREJA:") === 0);
  if (sinPareja) return { sinPareja: SIN_PAREJA_LABEL[sinPareja.slice(11)] || null };
  const real = (ids || []).filter(x => x.indexOf("CMR-") === 0);
  const types = entry.aspectualPartnerTypes || {};
  const parejas = real
    .map(pid => ({ id: pid, entry: typeof lexComerById === "function" ? lexComerById(pid) : null, tipo: types[pid] || "aspectual" }))
    .filter(p => p.entry);
  return { parejas };
}

function getWordId() {
  return new URLSearchParams(window.location.search).get("id");
}

function azSpeak(ru) {
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(ru);
    u.lang = "ru-RU";
    window.speechSynthesis.speak(u);
  } catch (err) {}
}

/* Estilos de la ficha — mismas clases y mismos valores que
   preview-fichas-ejemplo.html, con --bg/--gold/etc. tomados de
   azColors(darkMode) en vez de hardcodeados, para que respete el
   toggle de tema del shell. */
function FichaStyles({ c }) {
  return React.createElement("style", null, `
    .ficha{background:${c.card};border:1px solid ${c.border};border-radius:14px;overflow:hidden;}
    .hero{background:linear-gradient(135deg,${c.bg2},${c.bg3});padding:20px 20px 16px;border-bottom:1px solid ${c.border};}
    .ru{font-size:34px;font-weight:800;color:${c.gold};line-height:1;}
    .translit{font-size:14px;color:${c.textSub};font-style:italic;margin-top:6px;}
    .ipa{font-size:12px;color:${c.textMuted};margin-top:2px;}
    .pos-badge{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:${c.gold}33;color:${c.gold};border:1px solid ${c.gold};border-radius:8px;padding:3px 10px;}
    .sense-pair{margin-top:6px;margin-left:28px;font-size:12px;color:${c.textSub};}
    .sense-pair a{color:${c.gold};text-decoration:none;font-weight:600;}
    .sense-pair.empty{color:${c.textMuted};font-style:italic;}
    .governance{margin-top:4px;font-size:12.5px;color:${c.textSub};}
    .governance b{color:${c.text};font-weight:600;}
    .irregular-tag{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:700;color:#E2884A;background:${c.bg3};border-radius:6px;padding:2px 8px;}
    .fbody{padding:18px 20px;}
    .section-lbl{font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:${c.gold};margin:20px 0 10px;}
    .section-lbl:first-child{margin-top:0;}
    .sense{background:${c.bg2};border:1px solid ${c.border};border-radius:10px;padding:12px 14px;margin-bottom:8px;}
    .sense-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:${c.gold};color:${c.bg};font-size:11px;font-weight:800;border-radius:50%;margin-right:8px;}
    .sense-es{font-size:16px;font-weight:700;color:${c.text};display:inline;}
    .sense-def{font-size:13.5px;color:${c.textSub};margin-top:6px;margin-left:28px;}
    .buttons{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px;}
    .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;border:1px solid ${c.border};background:${c.bg3};color:${c.text};font-size:13.5px;font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit;}
    .btn.pr{background:${c.gold};border-color:${c.gold};color:${c.bg};font-weight:700;}
    .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px;}
    .meta-item{background:${c.bg2};border-radius:8px;padding:8px 10px;}
    .meta-k{color:${c.textMuted};font-size:10px;text-transform:uppercase;letter-spacing:.5px;}
    .meta-v{color:${c.text};margin-top:2px;}
    .meta-v.empty{color:${c.textMuted};font-style:italic;}
    .meta-v.meta-link{color:${c.gold};text-decoration:none;font-weight:600;cursor:pointer;}
    .meta-v.meta-link:hover{text-decoration:underline;}
  `);
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [q, setQ] = useState("");
  const qRef = useRef(null);
  const searchWrapRef = useRef(null);
  const [headerH, setHeaderH] = useState(0);
  const [searchH, setSearchH] = useState(0);

  useEffect(() => {
    (async () => { setDarkMode((await azGet('az_theme', 'dark')) !== 'light'); })();
  }, []);

  const id = getWordId();
  const entry = id && typeof lexComerById === "function" ? lexComerById(id) : null;
  const c = azColors(darkMode);
  const results = q.trim() && typeof azSearchLexicon === "function" ? azSearchLexicon(q) : [];

  /* El header de AzShell es position:fixed y se mide a sí mismo (ver
     shell.js) — acá lo volvemos a medir vía DOM para saber justo dónde
     termina y clavar la barra de búsqueda pegada debajo, también fixed
     (no sticky: mismo motivo que el header — sticky puede "acompañar"
     el rebote elástico de iOS al scrollear, fixed no se mueve nunca).
     Se mide antes del primer paint (useLayoutEffect) para que no haya
     ni un frame de salto, y se re-mide en cada resize. */
  useLayoutEffect(() => {
    function measure() {
      const header = document.querySelector("header");
      if (header) setHeaderH(header.getBoundingClientRect().height);
      if (searchWrapRef.current) setSearchH(searchWrapRef.current.getBoundingClientRect().height);
    }
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, [darkMode]);

  /* Buscador propio de la ficha — mismo estilo que el del drawer, pero
     acá el resultado es un desplegable que flota POR DELANTE del resto
     de la página (position:absolute + z-index), no un panel que empuja
     y reacomoda la ficha hacia abajo como sí pasa en el drawer. La
     barra en sí queda clavada debajo del título, fija, sin moverse
     nunca con el scroll. */
  const searchBar = React.createElement("div", {
    ref: searchWrapRef,
    style: { position: "fixed", top: headerH, left: 0, right: 0, zIndex: 90, background: c.bg, backdropFilter: "blur(12px)", borderBottom: `1px solid ${c.border}`, padding: "12px 3vw" }
  },
    React.createElement("div", { style: { maxWidth: 960, margin: "0 auto", position: "relative" } },
      React.createElement("input", {
        ref: qRef,
        value: q,
        onInput: (e) => setQ(e.target.value),
        placeholder: "Buscar en el léxico…",
        style: { width: "100%", boxSizing: "border-box", background: c.bg3, border: `1px solid ${c.border}`, borderRadius: 9, padding: "10px 34px 10px 14px", color: c.text, fontSize: 14 }
      }),
      q && React.createElement("button", {
        onClick: () => { setQ(""); if (qRef.current) qRef.current.focus(); },
        "aria-label": "Limpiar búsqueda",
        style: { position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", width: 24, height: 24, borderRadius: "50%", background: c.border, border: "none", color: c.text, fontSize: 13, lineHeight: 1, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }
      }, "✕"),
      q.trim() && React.createElement("div", {
        style: { position: "absolute", top: "calc(100% + 6px)", left: 0, right: 0, zIndex: 50, maxHeight: "50vh", overflowY: "auto", background: c.card, border: `1px solid ${c.border}`, borderRadius: 10, boxShadow: "0 16px 40px rgba(0,0,0,.4)" }
      },
        results.length > 0
          ? results.map((r, i) => React.createElement("a", {
              key: r.id, href: r.href,
              onClick: (e) => azNavigate(e, r.href),
              style: { display: "flex", justifyContent: "space-between", gap: 10, padding: "10px 14px", textDecoration: "none", borderTop: i === 0 ? "none" : `1px solid ${c.border}` }
            },
              React.createElement("span", { style: { color: c.text, fontWeight: 600, fontSize: 14 } }, r.ru),
              React.createElement("span", { style: { color: c.textMuted, fontSize: 12.5, textAlign: "right" } }, r.es)
            ))
          : React.createElement("div", { style: { padding: "12px 14px", fontSize: 13, color: c.textMuted } }, "Sin resultados")
      )
    )
  );

  let entryContent;
  if (!entry) {
    entryContent = React.createElement("div", { style: { textAlign: "center", padding: "10vh 0" } },
      React.createElement("h1", { style: { fontSize: 18, marginBottom: 8 } }, "Palabra no encontrada"),
      React.createElement("p", { style: { fontSize: 13.5, color: c.textMuted } },
        id ? `No hay ninguna entrada con id "${id}" en el léxico.` : "Faltó el parámetro ?id= en la URL.")
    );
  } else {
    const senses = entry.senses || [];
    const isVerbo = entry.posNormalized === "verbo";
    const isSustantivo = entry.posNormalized === "sustantivo";
    const isDeclinable = POS_DECLINABLE.includes(entry.posNormalized);

    const posBadgeText = (POS_LABEL[entry.posNormalized] || entry.posNormalized) +
      (isVerbo && entry.aspect ? " · " + (ASPECT_LABEL[entry.aspect] || entry.aspect) : "");

    /* Governance (rección) vive adentro de comer[0] — solo la mostramos
       para verbos, y solo si ese verbo puntual la tiene cargada. */
    const governance = isVerbo && entry.comer && entry.comer[0] && entry.comer[0].Governance
      ? entry.comer[0].Governance
      : null;

    const unitTitles = (entry.introducedIn || [])
      .map(n => (typeof AZ_UNITS !== "undefined" ? AZ_UNITS.find(u => u.id === n) : null))
      .filter(Boolean)
      .map(u => "Unidad " + u.id + " — " + u.title);

    const learningStatusText = entry.learningStatus
      ? (LEARNING_STATUS_LABEL[entry.learningStatus] || entry.learningStatus)
      : null;

    entryContent = React.createElement("div", { style: { animation: "fadeIn 0.3s ease" } },
      React.createElement(FichaStyles, { c }),
      React.createElement("div", { className: "ficha" },

        /* ── HERO: título, transliteración, traducción y categoría ── */
        React.createElement("div", { className: "hero" },
          React.createElement("div", { className: "ru" }, entry.ru),
          entry.translit && React.createElement("div", { className: "translit" }, entry.translit),
          entry.ipa && React.createElement("div", { className: "ipa" }, "IPA: /" + entry.ipa + "/"),
          React.createElement("span", { className: "pos-badge" }, posBadgeText),

          /* Rección (Governance) — solo para verbos, solo si está cargada */
          governance && React.createElement("div", { className: "governance" },
            "Rige: ", React.createElement("b", null, governance))
        ),

        React.createElement("div", { className: "fbody" },

          /* ── ACEPCIONES ── */
          React.createElement("div", { className: "section-lbl" }, "Acepciones"),
          senses.map((s, i) => {
            /* Si el sentido tiene su propio aspectualPartner (verbos con
               más de una acepción, ver METODOLOGIA de senses), se usa ese.
               Si no, y es el único sentido de la palabra, se cae al
               aspectualPartner de nivel superior — así las ~1.630 palabras
               de un solo sentido siguen mostrando su pareja igual. */
            const idsDeEsteSentido = isVerbo
              ? (s.aspectualPartner || (senses.length === 1 ? entry.aspectualPartner : null))
              : null;
            const info = idsDeEsteSentido ? parejasDeSentido(entry, idsDeEsteSentido) : null;

            return React.createElement("div", { key: i, className: "sense" },
              React.createElement("span", { className: "sense-num" }, i + 1),
              React.createElement("span", { className: "sense-es" }, s.es),
              s.definitionEs && React.createElement("div", { className: "sense-def" }, s.definitionEs),
              info && info.sinPareja &&
                React.createElement("div", { className: "sense-pair empty" }, info.sinPareja),
              info && info.parejas && info.parejas.length > 0 &&
                React.createElement("div", { className: "sense-pair" },
                  info.parejas.map((p, j) => React.createElement("div", { key: p.id },
                    (p.tipo === "resultado" ? "→ " : "↔ ") + PAIR_TYPE_LABEL[p.tipo] + ": ",
                    React.createElement("a", {
                      href: "ficha.html?id=" + p.id,
                      onClick: (e) => azNavigate(e, "ficha.html?id=" + p.id)
                    }, p.entry.ru)
                  ))
                )
            );
          }),

          /* ── CLASIFICACIÓN PEDAGÓGICA (traducida y filtrada) ── */
          React.createElement("div", { className: "section-lbl" }, "Clasificación pedagógica"),
          React.createElement("div", { className: "meta-grid" },
            React.createElement("div", { className: "meta-item" },
              React.createElement("div", { className: "meta-k" }, "Estado de aprendizaje"),
              React.createElement("div", { className: "meta-v" + (learningStatusText ? "" : " empty") },
                learningStatusText || "Sin asignar")
            ),
            React.createElement("div", { className: "meta-item" },
              React.createElement("div", { className: "meta-k" }, "Se enseña en"),
              React.createElement("div", { className: "meta-v" + (unitTitles.length ? "" : " empty") },
                unitTitles.length ? unitTitles.join(", ") : "Sin asignar")
            ),
            isSustantivo && entry.gender && React.createElement("div", { className: "meta-item" },
              React.createElement("div", { className: "meta-k" }, "Género"),
              React.createElement("div", { className: "meta-v" }, GENDER_LABEL[entry.gender] || entry.gender)
            ),
            isSustantivo && entry.animate && React.createElement("div", { className: "meta-item" },
              React.createElement("div", { className: "meta-k" }, "Animado"),
              React.createElement("div", { className: "meta-v" }, ANIMATE_LABEL[entry.animate] || entry.animate)
            ),
            isSustantivo && (entry.pluralForm || entry.numberClass) && React.createElement("div", { className: "meta-item" },
              React.createElement("div", { className: "meta-k" }, "Forma plural"),
              entry.pluralForm
                ? React.createElement("a", {
                    className: "meta-v meta-link",
                    href: "casos.html?id=" + entry.id,
                    onClick: (e) => azNavigate(e, "casos.html?id=" + entry.id)
                  }, entry.pluralForm)
                : React.createElement("div", { className: "meta-v" },
                    entry.numberClass && NUMBER_CLASS_LABEL[entry.numberClass] &&
                      React.createElement("span", { className: "irregular-tag" }, NUMBER_CLASS_LABEL[entry.numberClass])
                  )
            )
          ),

          /* ── BOTONES: módulo correspondiente (si aplica) + audio ── */
          React.createElement("div", { className: "buttons" },
            isVerbo && React.createElement("a", {
              className: "btn pr", href: "verbos.html?id=" + entry.id,
              onClick: (e) => azNavigate(e, "verbos.html?id=" + entry.id)
            }, "🗣️ Ver en Verbos"),
            isDeclinable && React.createElement("a", {
              className: "btn pr", href: "casos.html?id=" + entry.id,
              onClick: (e) => azNavigate(e, "casos.html?id=" + entry.id)
            }, "📐 Ver en Casos"),
            React.createElement("button", {
              className: "btn", onClick: () => azSpeak(entry.ru)
            }, "▶ Pronunciación")
          )
        )
      )
    );
  }

  return React.createElement(AzShell, {
    darkMode, setDarkMode,
    moduleId: null,
    tabs: [],
  }, searchBar, React.createElement("div", { style: { paddingTop: searchH ? searchH + 14 + "px" : "18px" } }, entryContent));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
