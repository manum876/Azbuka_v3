<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Азбука">
<title>Азбука · Ruso</title>
<meta name="theme-color" content="#0F0F14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/core.css">
<style>
  /* Específico de esta página. Los colores fijos de ícono (rojo del logo,
     naranja, amarillo, verde, azul, violeta: el orden de la bandera)
     no cambian con el tema — ver ESTETICA_AZBUKA.md §2. */
  .page-gap{margin-top:16px;}

  /* Buscador general (va a la ficha de la palabra, como el del menú) */
  .srch{position:relative;margin-bottom:16px;}
  .srch input{width:100%;box-sizing:border-box;border-radius:12px;padding:13px 40px 13px 40px;font-size:16px;font-family:inherit;}
  .srch .lupa{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6;pointer-events:none;}
  .srch .limpiar{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .res{margin:-8px 0 16px;border-radius:12px;overflow:hidden;}
  .res a{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;text-decoration:none;}

  /* Seguir estudiando */
  .cont{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;text-decoration:none;margin-bottom:26px;}
  .cont-n{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;background:#B5605C;flex-shrink:0;}
  .cont-k{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;}
  .cont-t{font-size:16px;font-weight:700;margin-top:2px;}
  .cont-s{font-size:12px;margin-top:2px;}
  .pbar{height:5px;border-radius:3px;overflow:hidden;margin-top:8px;}

  /* Tarjeta Azbuka: mismo formato que las de módulos (ícono a la
     izquierda, título y texto a la derecha). 27/10/2026 (Manu): sin los chips
     de nivel; la tarjeta entera lleva al índice del curso. */
  .hero-card{display:block;width:100%;box-sizing:border-box;padding:18px 16px;border-radius:16px;margin-bottom:16px;text-decoration:none;transition:.18s;}
  a.hero-card:active{transform:scale(.98);}
  .hero-top{display:flex;align-items:flex-start;gap:14px;}
  .hero-icon{width:64px;height:64px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;background:#B5605C;letter-spacing:-1px;flex-shrink:0;}
  .hero-title{font-size:24px;font-weight:800;line-height:1.1;margin-bottom:6px;}
  .hero-desc{font-size:13.5px;line-height:1.55;}

  .section-lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 12px;}

  .mod-list{display:flex;flex-direction:column;gap:10px;}
  .mod-card{display:flex;align-items:center;gap:14px;text-decoration:none;padding:14px 16px;border-radius:16px;cursor:pointer;transition:.18s;box-sizing:border-box;}
  .mod-card:active{transform:scale(.98);}
  .mod-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;}
  /* 20/10/2026: el color de cada ícono sale de core.js (azModuloColor), igual que en el resto de la app */
  .mod-text{display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;}
  .mod-title{font-size:14.5px;font-weight:700;}
  .mod-desc{font-size:11.5px;line-height:1.35;}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/preact.js"></script>
<script src="data/data-catalogo.js"></script>
<script src="js/core.js"></script>
<script src="assets/supabase.js"></script>
<script src="js/cuenta.js"></script>
<script src="js/avisos.js"></script>
<script src="js/hoy.js"></script>
<script src="js/shell.js"></script>
<script>
const { useState, useEffect } = htmPreact;
/* ── Abecé (27/10/2026): el inicio con la marca de Abecé y sus textos en ruso
   (borrador para Iván). Mientras Abecé no tenga unidades, no se muestran
   «Seguir estudiando», «Hoy» ni «Repaso de hoy» (son de las unidades de Azbuka),
   y la tarjeta no lleva a ningún índice. ── */
const ABECE = typeof AZ_DIRECCION !== "undefined" && AZ_DIRECCION.id === "abece";
const SIN_UNIDADES = ABECE && !(AZ_CATALOGO.abece.unidades || []).length;
const TXI = ABECE ? {
  glyph: (AZ_DIRECCION.marca || {}).glyph || "Ab", titulo: (AZ_DIRECCION.marca || {}).nombre || "Abecé",
  desc: "Полный курс испанского с нуля для тех, кто говорит по-русски. Понятная теория, практические упражнения и живые примеры — чтобы ты уверенно шёл вперёд, от уровня A1 до B1.",
  buscar: "Поиск по-испански или по-русски…", buscarAria: "Найти слово", limpiar: "Очистить поиск", sinRes: "Ничего не найдено",
  lexico: "LEXICON_ES"
} : {
  glyph: "Аз", titulo: "Азбука",
  desc: "Un curso completo para aprender ruso desde cero, pensado para hispanohablantes. Combina teoría clara, ejercicios prácticos y ejemplos reales para que avances con confianza, del nivel A1 al B1.",
  buscar: "Buscar en ruso o en español…", buscarAria: "Buscar una palabra", limpiar: "Limpiar búsqueda", sinRes: "Sin resultados",
  lexico: "LEXICON_COMER"
};
const lexCargado = () => typeof window[TXI.lexico] !== "undefined" || (ABECE ? typeof LEXICON_ES !== "undefined" : typeof LEXICON_COMER !== "undefined");

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [q, setQ] = useState("");
  const [ultimo, setUltimo] = useState(null);
  /* Desafío del día (hoy.js): unidad del alumno, si ya lo hizo hoy y si está abierto */
  const [hoyUnidad, setHoyUnidad] = useState(null);
  const [hoyHecho, setHoyHecho] = useState(false);
  const [hoyAbierto, setHoyAbierto] = useState(false);
  /* Repaso de hoy (19/10/2026): cuántas cosas tocan hoy (az_progress.srs) */
  const [repasoN, setRepasoN] = useState(null);
  /* Léxico (27/10/2026): ya no se carga antes de mostrar la página (eran 8 MB
     que dejaban la pantalla negra unos segundos). Se pide apenas se dibuja el
     inicio; solo lo usan los buscadores, que se actualizan cuando llega. */
  const [, setLexListo] = useState(lexCargado());
  const leerHoy = async () => { const hs = await azGet("az_hoy", {}); setHoyHecho(hs.fecha === azHoyFecha() && !!hs.hecho); return hs; };

  useEffect(() => {
    /* El léxico de la dirección (27/10/2026: en Abecé, el español) */
    if (!lexCargado()) {
      const sc = document.createElement("script");
      sc.src = AZ_DIRECCION.lexico || "data/data-lexicon.js";
      sc.onload = () => setLexListo(true);
      document.body.appendChild(sc);
    }
  }, []);

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      setUltimo(await azLeerUltimo());
      { const pr = await azGet("az_progress", {}), srs = pr.srs || {}, hoy = new Date().toISOString().slice(0, 10);
        setRepasoN(Object.keys(srs).filter(k => srs[k].p && srs[k].p <= hoy && k.indexOf("ej:") === 0).length); }
      if (SIN_UNIDADES) return;   /* Abecé sin unidades: sin desafío del día */
      const u = await azHoyUnidad(); setHoyUnidad(u);
      const hs = await leerHoy();
      /* Una vez por día, al abrir el inicio, si ya empezó alguna unidad */
      if (u && hs.mostrado !== azHoyFecha()) {
        await azSet("az_hoy", Object.assign({}, hs, { mostrado: azHoyFecha() }));
        setTimeout(() => setHoyAbierto(true), 700);
      }
    })();
  }, []);

  const c = azColors(darkMode);
  const modules = typeof AZ_MODULES !== "undefined" ? AZ_MODULES : [];

  return React.createElement(AzShell, {
    darkMode, setDarkMode,
    moduleId: null,
    tabs: []
  },
    React.createElement("div", { className: "page-gap", style: { animation: "fadeIn 0.3s ease" } },

      /* ── HERO: la tarjeta del curso (ícono, título y descripción). 27/10/2026
         (Manu): sin los chips de nivel (A1 → B1, B1 → B2, B2 → C1); el nivel
         queda en la descripción y la tarjeta entera lleva al índice del curso.
         En Abecé, sin unidades, no es link. ── */
      React.createElement(SIN_UNIDADES ? "div" : "a", Object.assign({
        className: "hero-card",
        style: { background: c.card, border: `1px solid ${c.border}` }
      }, SIN_UNIDADES ? {} : { href: AZ_DIRECCION.indice || "azbuka-index-1.html", onClick: (e) => azNavigate(e, AZ_DIRECCION.indice || "azbuka-index-1.html") }),
        React.createElement("div", { className: "hero-top" },
          React.createElement("div", { className: "hero-icon" }, TXI.glyph),
          React.createElement("div", { style: { flex: 1, minWidth: 0 } },
            React.createElement("div", { className: "hero-title", style: { color: c.gold } }, TXI.titulo),
        React.createElement("div", { className: "hero-desc", style: { color: c.textMuted } },
          TXI.desc)
          ),
          !SIN_UNIDADES && React.createElement("span", { style: { color: c.gold, fontSize: 20, fontWeight: 700, alignSelf: "center", flexShrink: 0 } }, "›")
        )
      ),

      /* ── SEGUIR ESTUDIANDO (el último módulo abierto, az_ultimo) y, a la
         derecha, la tarjeta «Hoy» (desafío del día, hoy.js) ── */
      !SIN_UNIDADES && React.createElement("div", { style: { display: "flex", gap: 10, alignItems: "stretch", marginBottom: ultimo ? 10 : 26 } },
      (() => {
        const u = ultimo;
        const href = u ? u.href : "azbuka-1.html";
        const pct = u && u.total ? Math.round(u.n / u.total * 100) : 0;
        return React.createElement("a", {
          className: "cont", href, onClick: (e) => azNavigate(e, href),
          style: { background: c.card, border: `1px solid ${c.gold}66`, flex: 1, minWidth: 0, marginBottom: 0 }
        },
          React.createElement("div", { className: "cont-n" }, u ? u.unidad : "1"),
          React.createElement("div", { style: { flex: 1, minWidth: 0 } },
            React.createElement("div", { className: "cont-k", style: { color: c.gold } }, u ? "Seguir estudiando" : "Empezar"),
            React.createElement("div", { className: "cont-t", style: { color: c.text } }, u ? u.titulo : "Unidad 1 · Alfabeto y pronunciación"),
            u && React.createElement("div", { className: "cont-s", style: { color: c.textMuted } }, "Módulo " + u.n + " de " + u.total),
            u && React.createElement("div", { className: "pbar", style: { background: c.bg3 } },
              React.createElement("div", { style: { width: pct + "%", height: "100%", background: darkMode ? "#4CAF82" : "#2E7D55" } }))
          ),
          React.createElement("span", { style: { color: c.textMuted, fontSize: 20 } }, "›")
        );
      })(),
      hoyUnidad && React.createElement(AzHoyTarjeta, { c, hecho: hoyHecho, alto: 92, onAbrir: () => setHoyAbierto(true) })
      ),

      /* ── REPASO DE HOY (19/10/2026, repaso.html): solo si ya empezó alguna unidad ── */
      ultimo && !SIN_UNIDADES && React.createElement("a", {
        className: "cont", href: "repaso.html", onClick: (e) => azNavigate(e, "repaso.html"),
        style: { background: c.card, border: `1px solid ${repasoN ? c.gold + "66" : c.border}` }
      },
        React.createElement("div", { className: "cont-n", style: { background: repasoN ? c.gold : c.bg3, color: repasoN ? "#0F0F14" : c.textMuted } }, repasoN ? (repasoN > 99 ? "99+" : repasoN) : "✓"),
        React.createElement("div", { style: { flex: 1, minWidth: 0 } },
          React.createElement("div", { className: "cont-k", style: { color: c.gold } }, "Repaso de hoy"),
          React.createElement("div", { className: "cont-t", style: { color: c.text } }, repasoN ? "Lo que estás por olvidar" : "Estás al día"),
          React.createElement("div", { className: "cont-s", style: { color: c.textMuted } }, repasoN ? repasoN + " por repasar · sesiones de unos 10 minutos" : "Igual puedes practicar un poco de tu unidad")),
        React.createElement("span", { style: { color: c.textMuted, fontSize: 20 } }, "›")
      ),

      /* ── BUSCADOR GENERAL ── */
      React.createElement("div", { className: "srch" },
        React.createElement("span", { className: "lupa", style: { color: c.textMuted } }, "⌕"),
        React.createElement("input", {
          value: q, onInput: (e) => setQ(e.target.value),
          placeholder: TXI.buscar, "aria-label": TXI.buscarAria,
          style: { background: c.card, border: `1px solid ${c.gold}66`, color: c.text }
        }),
        q && React.createElement("button", { className: "limpiar", onClick: () => setQ(""), "aria-label": TXI.limpiar, style: { background: c.border, color: c.text } }, "✕")
      ),
      q.trim() && React.createElement("div", { className: "res", style: { background: c.card, border: `1px solid ${c.border}` } },
        (() => {
          const r = typeof azSearchLexicon === "function" ? azSearchLexicon(q.trim()) : [];
          if (!r.length) return React.createElement("div", { style: { padding: "12px 14px", fontSize: 13, color: c.textMuted } }, TXI.sinRes);
          return r.map((x, i) => React.createElement("a", {
            key: x.id, href: x.href, onClick: (e) => azNavigate(e, x.href),
            style: { borderTop: i ? `1px solid ${c.border}` : "none" }
          },
            React.createElement("span", { style: { color: c.text, fontWeight: 700, fontSize: 15 } }, x.ru),
            React.createElement("span", { style: { color: c.textMuted, fontSize: 13, textAlign: "right" } }, x.es)
          ));
        })()
      ),

      /* ── MÓDULOS DE APOYO (antes "Herramientas") — filas horizontales ── */
      React.createElement("div", { className: "section-lbl", style: { color: c.textMuted, marginTop: SIN_UNIDADES ? 26 : undefined } }, azTexto("modulos")),
      React.createElement("div", { className: "mod-list" },
        modules.map(m =>
          React.createElement("a", {
            key: m.id, className: "mod-card", href: m.href,
            onClick: (e) => azNavigate(e, m.href),
            style: { background: c.card, border: `1px solid ${c.border}` }
          },
            React.createElement("div", { className: "mod-icon", style: { background: azModuloColor(m).bg, color: azModuloColor(m).fg } }, m.glyph),
            React.createElement("div", { className: "mod-text" },
              React.createElement("div", { className: "mod-title", style: { color: c.text } }, m.title),
              React.createElement("div", { className: "mod-desc", style: { color: c.textMuted } }, m.desc)
            ),
            React.createElement("span", { style: { color: c.gold, fontSize: 18, flexShrink: 0, marginLeft: "auto", paddingLeft: 8 } }, "›")
          )
        )
      )
    ),

    /* Avisos de instalar y de copia de seguridad (avisos.js, §6.17).
       Fuera del bloque animado: su transform rompería el position:fixed. */
    React.createElement(AzAvisos, { c, pausado: hoyAbierto }),
    hoyAbierto && hoyUnidad && React.createElement(AzHoy, { c, unidad: hoyUnidad, onCerrar: () => { setHoyAbierto(false); leerHoy(); } })
  );
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
