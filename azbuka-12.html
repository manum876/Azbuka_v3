<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Азбука — Unidad 12: Gramática B1</title>
<meta name="apple-mobile-web-app-title" content="Азбука">
<meta name="theme-color" content="#0F0F14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/core.css">
</head>
<body>
<div id="root"></div>
<script src="assets/preact.js"></script>
<script src="data/data-lexicon.js"></script>
<script src="data/data-casos.js"></script>
<script src="data/data-verbos.js"></script>
<script src="data/data-frases.js"></script>
<script src="data/data-dialogos.js"></script>
<script src="data/data-unidad-12.js"></script>
<script src="js/core.js"></script>
<script src="js/progress.js"></script>
<script src="js/shell.js"></script>
<script src="js/corrector.js"></script>
<script src="js/burbuja.js"></script>
<script src="js/unidad-ui.js"></script>
<script src="js/unidad.js"></script>
<script>
/* ============================================================
   AZBUKA-12.HTML — Unidad 12: Gramática B1
   ------------------------------------------------------------
   05/10/2026. Piezas de unidad-ui.js y unidad.js. Propio de esta
   unidad: tablas de cada módulo con las formas de Casos (pronombres,
   posesivos y э́тот, plural, números) y de Verbos (aspecto, imperativo).
   URL: azbuka-12.html · azbuka-12.html?m=u12m2
   ============================================================ */
const { useState, useEffect } = htmPreact;
const h = React.createElement;
const U = UNIDAD_12;
const EJ_U12 = ejerciciosUnidad12();
const EJ_U12_BASE = EJ_U12.filter(e => !e.ampliacion);
const D12 = u12Datos();
const OBJETIVO_U12 = LEXICON_COMER.filter(e => (e.introducedIn || []).indexOf(12) >= 0 || (e.appearsIn || []).indexOf(12) >= 0).map(e => e.id);
const AVISO_ACENTOS = "En Azbuka, los acentos (´) son solo una ayuda para leer: en ruso no se escriben, así que no hace falta que los pongas. La е vale por ё.";
const CASO_FILAS = [["Nominativo", "кто? что?"], ["Genitivo", "кого́? чего́?"], ["Dativo", "кому́? чему́?"], ["Acusativo", "кого́? что?"], ["Instrumental", "кем? чем?"], ["Prepositivo", "о ком? о чём?"]];

/* Tabla de un adjetivo / posesivo: filas = casos, columnas = m, f, n, pl */
function tablaAdj(a, c) {
  const cel = (x, ac) => Array.isArray(x) ? { ru: x[0] + " / " + x[1], es: "cosa / persona" } : { id: a.id, ru: x, es: "" };
  return h(AzTablaGrupos, { encabezados: ["Caso", "masc.", "fem.", "neutro", "plural"], c,
    filas: CASO_FILAS.map((f, i) => [{ ru: f[1], es: f[0] }, cel(a.m[i]), cel(a.f[i]), cel(a.n[i]), cel(a.pl[i])]) });
}

function Lectura({ L, c }) {
  const [es, setEs] = useState(false);
  const idx = azIndiceFormas();
  const lexDe = ru => (ru.match(/[А-Яа-яЁё\u0301]+/g) || []).map(w => { const r = idx.get(azFormaClave(w)); return r && r[0] ? r[0][0] : null; });
  return h("div", { className: "u-card", style: { padding: "14px 16px", marginTop: 12 } },
    h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
      h("div", { lang: "ru", style: { flex: 1, fontSize: 18, fontWeight: 800, color: c.gold } }, L.titulo),
      h("button", { className: "play", onClick: () => azHablarSecuencia(L.lineas.map(l => ({ texto: l[0] }))), "aria-label": "Escuchar el texto" }, "▶"),
      h("button", { className: "play", onClick: azCallar, "aria-label": "Detener el audio" }, "■")),
    L.lineas.map((l, k) => h("div", { key: k, style: { marginTop: 8, fontSize: 16.5, lineHeight: 1.5 } },
      h(AzTexto, { ru: l[0], lex: lexDe(l[0]), objetivo: OBJETIVO_U12 }),
      es && h("div", { style: { fontSize: 13, color: c.textMuted } }, l[1]))),
    h("button", { className: "ubtn sec", style: { marginTop: 12 }, onClick: () => setEs(!es) }, es ? "Ocultar la traducción" : "Ver la traducción"));
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [modId, setModId] = useState(() => new URLSearchParams(location.search).get("m"));
  const [tarjetas, setTarjetas] = useState(null);
  const [practica, setPractica] = useState(null);
  const [visto, setVisto] = useState(1);
  const [examen, setExamen] = useState(null);
  const [, refrescar] = useState(0);

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      setVisto(await azGet('az_u12_visto', 1));
      await azLoadProgress();
      azSaveUnitProgress(12, {});
      refrescar(x => x + 1);
    })();
    const pop = () => { setModId(new URLSearchParams(location.search).get("m")); setTarjetas(null); setPractica(null); };
    window.addEventListener("popstate", pop);
    return () => window.removeEventListener("popstate", pop);
  }, []);
  useEffect(() => {
    const m = modId ? unidad12Modulo(modId) : null;
    window.azFuenteActual = () => m ? "Unidad 12 · " + m.titulo : "Unidad 12";
    if (m && m.n > visto) { setVisto(m.n); azSet('az_u12_visto', m.n); }
    if (m) azGuardarUltimo({ unidad: 12, n: m.n, total: U.modulos.length, titulo: "Unidad 12 · " + m.titulo, href: "azbuka-12.html?m=" + m.id });
  }, [modId]);
  useEffect(() => { if (!practica && AZ_PROGRESS.units) setExamen((AZ_PROGRESS.units["12"] || {}).examen || null); }, [practica]);

  const abrirModulo = id => { history.pushState(null, "", id ? "?m=" + id : location.pathname); setModId(id); window.scrollTo(0, 0); };
  const practicarUnidad = () => setPractica({ titulo: "Unidad 12", pool: EJ_U12_BASE.filter(e => e.modulo <= Math.max(visto, 1)) });
  const practicarModulo = m => setPractica({ titulo: m.titulo, n: m.nPractica, pool: EJ_U12_BASE.filter(e => e.modulo === m.n) });
    const rendirExamen = m => setPractica({ titulo: "Evaluación de la Unidad 12", pool: EJ_U12_BASE, examen: { intro: m.intro, partes: m.partes, aprobado: m.aprobado } });
  const reforzar = parte => setPractica({ titulo: "Reforzar: " + parte.nombre, pool: EJ_U12_BASE.filter(e => parte.tipos.indexOf(e.tipo) >= 0) });

  const c = azColors(darkMode);
  const green = darkMode ? "#4CAF82" : "#2E7D55";
  const mod = modId ? unidad12Modulo(modId) : null;
  const idx = mod ? U.modulos.indexOf(mod) : -1;
  const prev = mod && U.modulos[idx - 1], next = mod && U.modulos[idx + 1];
  const palabrasDom = OBJETIVO_U12.filter(id => azItem("lex:" + id).level === 2).length;
  const tabs = mod ? [
    { id: "u", icon: "⊞", aria: "Unidad", action: () => abrirModulo(null) },
    { id: "p", icon: "‹", aria: "Módulo anterior", disabled: !prev, action: () => prev && abrirModulo(prev.id) },
    { id: "m", texto: "Módulo " + mod.n },
    { id: "s", icon: "›", aria: "Módulo siguiente", disabled: !next, action: () => next && abrirModulo(next.id) }
  ] : azTabsUnidad(12);

  const portada = h(AzPortadaUnidad, { u: U, c, green, visto: Math.max(visto, 1), examen, onPracticar: practicarUnidad, onAbrir: abrirModulo,
    progreso: [{ label: "Palabras dominadas", valor: palabrasDom, total: OBJETIVO_U12.length }] });

  let vista = null;
  if (mod) {
    const S = l => l.map(ru => D12.sust(ru)).filter(Boolean);
    const P = U12_PRON.map(ru => D12.pron(ru));
    vista = h("div", { key: mod.id, style: { animation: "fadeIn 0.3s ease", paddingTop: 18 } },
      h("div", { className: "u-kicker" }, "Unidad 12 · Módulo " + mod.n),
      h("h1", { className: "u-title" }, mod.titulo),
      h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(mod.intro)),
      mod.tipo === "leccion" && h(React.Fragment, null,
        h(AzSecciones, { secciones: mod.secciones }),
        mod.n === 1 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Los pronombres en los casos"),
          h(AzTablaGrupos, { encabezados: ["", "Acus. / gen.", "Dativo", "Con…", "De…"], c,
            filas: P.map((p, i) => [{ ru: p.ac, es: U12_PRON_ES[i] }, { id: p.id, ru: p.f[3], es: "" }, { id: p.id, ru: p.f[2], es: "" }, { id: p.id, ru: u12PronForma(p, 4, "с"), es: "" }, { id: p.id, ru: u12PronForma(p, 5, "о"), es: "" }]) }),
          h("div", { className: "tnote u-text", style: { fontSize: 13, marginTop: 8 } }, "Con preposición, он, она́ y они́ llevan н-: у него́, у неё, у них.")),
        mod.n === 2 && h(React.Fragment, null, h("div", { className: "u-sec" }, "мой en los seis casos"), tablaAdj(D12.adj("мой"), c),
          h("div", { className: "u-sec" }, "наш en los seis casos"), tablaAdj(D12.adj("наш"), c),
          h("div", { className: "u-sec" }, "э́тот en los seis casos"), tablaAdj(D12.adj("э́тот"), c)),
        mod.n === 3 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Plural y genitivo plural"),
          h(AzTablaGrupos, { encabezados: ["Singular", "Plural", "мно́го…"], c,
            filas: S(["студе́нт", "биле́т", "музе́й", "учи́тель", "врач", "кни́га", "маши́на", "сло́во", "ру́чка", "письмо́", "друг", "брат", "ребёнок", "челове́к"]).map(s => [{ id: s.id, ru: s.sg[0], es: "" }, { id: s.id, ru: s.pl[0], es: "" }, { id: s.id, ru: "мно́го " + s.pl[1], es: "" }]) }),
          h("div", { className: "u-sec" }, "Con números"),
          h(AzTablaGrupos, { encabezados: ["1", "2, 3, 4", "5 o más"], c,
            filas: S(["брат", "кни́га", "биле́т", "час", "рубль", "год"]).map(s => { const f = s.g === "f", n = s.g === "n";
              return [{ id: s.id, ru: (f ? "одна́ " : n ? "одно́ " : "оди́н ") + s.sg[0], es: "" }, { id: s.id, ru: (f ? "две " : "два ") + (s.conteo || s.sg[1]), es: "" }, { id: s.id, ru: "пять " + s.pl[1], es: "" }]; }) })),
        mod.n === 4 && h(React.Fragment, null, h("div", { className: "u-sec" }, "El plural en los seis casos"),
          h(AzTablaGrupos, { encabezados: ["Caso", "студе́нты", "кни́ги", "друзья́"], c,
            filas: CASO_FILAS.map((f, i) => [{ ru: f[1], es: f[0] }].concat(S(["студе́нт", "кни́га", "друг"]).map(s => ({ id: s.id, ru: s.pl[i], es: "" })))) }),
          h("div", { className: "u-sec" }, "Adjetivos y posesivos en plural"),
          h(AzTablaGrupos, { encabezados: ["Caso", "но́вые", "хоро́шие", "мои́"], c,
            filas: CASO_FILAS.map((f, i) => [{ ru: f[1], es: f[0] }].concat(["но́вый", "хоро́ший", "мой"].map(r => { const a = D12.adj(r), x = a.pl[i]; return { id: a.id, ru: Array.isArray(x) ? x[0] + " / " + x[1] : x, es: "" }; }))) })),
        mod.n === 5 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Las parejas"),
          h(AzTablaGrupos, { encabezados: ["Imperfectivo", "Perfectivo"], c,
            filas: U12_PARES.map(([i, p, es]) => { const a = D12.verbo(i), b = D12.verbo(p); return a && b && [{ id: a.id, ru: a.ac, es }, { id: b.id, ru: b.ac, es: "" }]; }).filter(Boolean) })),
        mod.n === 6 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Futuro perfectivo"),
          h(AzTablaGrupos, { encabezados: ["", "прочита́ть", "позвони́ть", "купи́ть"], c,
            filas: ["я", "ты", "он / она́", "мы", "вы", "они́"].map((pr, i) => [{ ru: pr, es: "" }].concat(["прочита́ть", "позвони́ть", "купи́ть"].map(r => { const v = D12.verbo(r); return { id: v.id, ru: v.futuro[i], es: "" }; }))) }),
          h("div", { className: "u-sec" }, "Los dos futuros"),
          h(AzTablaGrupos, { encabezados: ["Proceso", "Resultado"], c,
            filas: [["чита́ть", "прочита́ть"], ["писа́ть", "написа́ть"], ["де́лать", "сде́лать"], ["гото́вить", "пригото́вить"]].map(([i, p]) => { const a = D12.verbo(i), b = D12.verbo(p); return [{ id: a.id, ru: "я бу́ду " + a.ac, es: "" }, { id: b.id, ru: "я " + b.futuro[0], es: "" }]; }) })),
        mod.n === 7 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Qué aspecto piden"),
          h(AzTablaGrupos, { encabezados: ["Imperfectivo", "Perfectivo"], c,
            filas: [["ка́ждый день", "todos los días", "уже́", "ya"], ["ча́сто", "seguido", "наконе́ц", "por fin"], ["всегда́", "siempre", null, null], ["обы́чно", "normalmente", null, null], ["иногда́", "a veces", null, null], ["до́лго", "mucho tiempo", null, null]]
              .map(([a, ae, b, be]) => [{ ru: a, es: ae }, b ? { ru: b, es: be } : null]) })),
        mod.n === 8 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Imperativo"),
          h(AzTablaGrupos, { encabezados: ["Verbo", "ты", "вы"], c,
            filas: ["чита́ть", "сде́лать", "позвони́ть", "написа́ть", "пригото́вить", "отве́тить", "закры́ть", "помо́чь", "дать", "взять", "пить", "есть"].map(r => { const v = D12.verbo(r);
              return [{ id: v.id, ru: v.ac, es: "" }, { id: v.id, ru: v.imperativo.ty, es: "" }, { id: v.id, ru: v.imperativo.vy, es: "" }]; }) })),
        mod.n === 9 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Comparativos"),
          h(AzTablaGrupos, { encabezados: ["Adjetivo", "Más …"], c,
            filas: ["интере́сный", "краси́вый", "удо́бный", "бы́стрый", "тёплый", "холо́дный", "большо́й", "ма́ленький", "хоро́ший", "плохо́й", "дорого́й", "дешёвый"].map(r => { const a = D12.adj(r);
              return [{ id: a.id, ru: a.ac, es: "" }, { id: a.id, ru: a.comp, es: "" }]; }) }),
          h("div", { className: "u-sec" }, "са́мый"), tablaAdj(D12.adj("са́мый"), c)),
        h("button", { className: "ubtn", style: { marginTop: 22 }, onClick: () => practicarModulo(mod) }, "Practicar este módulo"),
        ),
      mod.tipo === "lectura" && h(React.Fragment, null,
        (typeof U12_LECTURAS !== "undefined" ? U12_LECTURAS : []).map(L => h(Lectura, { key: L.id, L, c })),
        h("button", { className: "ubtn", style: { marginTop: 18 }, onClick: () => practicarModulo(mod) }, "Practicar «Todo junto»")),
      mod.tipo === "proyecto" && h(AzProyecto, { mod, c, green, clave: "az_u12_proyecto", fuente: { titulo: "Unidad 12 · Proyecto", href: "azbuka-12.html?m=u12m11" }, aviso: AVISO_ACENTOS }),
      mod.tipo === "examen" && h(React.Fragment, null,
        h("div", { className: "u-card", style: { padding: "6px 16px", marginTop: 16 } }, mod.partes.map((p, k) =>
          h("div", { key: p.nombre, style: { display: "flex", justifyContent: "space-between", padding: "10px 0", borderTop: k ? `1px solid ${c.border}` : "none", fontSize: 14.5 } },
            h("span", { style: { fontWeight: 600 } }, p.nombre), h("span", { style: { color: c.textMuted } }, p.n + " ejercicios")))),
        examen && h("div", { style: { marginTop: 14, fontSize: 14, color: examen.aprobado ? green : "#E2884A", fontWeight: 700 } },
          "Última vez: " + examen.pct + " % (" + examen.fecha.split("-").reverse().join("/") + ")" + (examen.aprobado ? " · aprobada" : "")),
        h("button", { className: "ubtn", onClick: () => rendirExamen(mod) }, examen ? "Rendir de nuevo" : "Empezar la evaluación")),
      next && h("button", { className: "ubtn sec", style: { marginTop: 22 }, onClick: () => abrirModulo(next.id) }, "Siguiente: " + next.titulo));
  }

  return h(React.Fragment, null,
    h(AzEstilosUnidad, { c, green }),
    h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs }, mod ? vista : portada),
    practica && h(AzPractica, { key: practica.titulo + (practica.pool[0] || {}).id, unidad: 12, titulo: practica.titulo, pool: practica.pool, mezcla: U12_MEZCLA,
      n: azNPractica(practica.pool, practica.n), dark: darkMode, aviso: AVISO_ACENTOS, examen: practica.examen, onReforzar: reforzar, objetivo: OBJETIVO_U12,
      onSalir: () => { setPractica(null); refrescar(x => x + 1); } }),
    h(AzBurbujaHost, { dark: darkMode }));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
