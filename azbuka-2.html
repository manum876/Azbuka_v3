<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Азбука — Unidad 2: Presentaciones y conversaciones básicas</title>
<meta name="apple-mobile-web-app-title" content="Азбука">
<meta name="theme-color" content="#0F0F14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="core.css">
</head>
<body>
<div id="root"></div>
<script src="preact.js"></script>
<script src="data-lexicon.js"></script>
<script src="data-casos.js"></script>
<script src="data-verbos.js"></script>
<script src="data-frases.js"></script>
<script src="data-dialogos.js"></script>
<script src="data-mapa.js"></script>
<script src="data-unidad-2.js"></script>
<script src="core.js"></script>
<script src="progress.js"></script>
<script src="shell.js"></script>
<script src="corrector.js"></script>
<script src="burbuja.js"></script>
<script src="unidad-ui.js"></script>
<script src="unidad.js"></script>
<script>
/* ============================================================
   AZBUKA-2.HTML — Unidad 2: Presentaciones y conversaciones básicas
   ------------------------------------------------------------
   26/09/2026. Las piezas de pantalla vienen de unidad-ui.js y la
   práctica y la evaluación de unidad.js: esta página es casi solo
   la lógica de navegación de la unidad. Módulos de tipo «leccion»
   (teoría, vocabulario, frases, diálogos, tarjetas), «conversaciones»
   (diálogos para grabarse y chats), «proyecto» (escribir una
   conversación) y «examen». Un módulo puede tener «ampliacion»
   (01/10/2026): vocabulario opcional en una tarjeta aparte, con su
   práctica; no cuenta para el objetivo, la práctica general ni la
   evaluación.
   URL: azbuka-2.html · azbuka-2.html?m=u2m4
   ============================================================ */
const { useState, useEffect, useRef } = htmPreact;
const h = React.createElement;
const U = UNIDAD_2;
const EJ_U2 = ejerciciosUnidad2();
/* La ampliación (U2_AMPLIACION) es opcional: no cuenta para el objetivo, la práctica general ni la evaluación. */
const AMP_U2 = new Set([].concat(...Object.values(typeof U2_AMPLIACION !== "undefined" ? U2_AMPLIACION : {})));
const OBJETIVO_U2 = LEXICON_COMER.filter(e => ((e.introducedIn || []).indexOf(2) >= 0 || (e.appearsIn || []).indexOf(2) >= 0) && !AMP_U2.has(e.id)).map(e => e.id);
const EJ_U2_BASE = EJ_U2.filter(e => !e.ampliacion);
const AVISO_ACENTOS = "En Azbuka, los acentos (´) son solo una ayuda para leer: en ruso no se escriben, así que no hace falta que los pongas.";
const personaje = p => (DLG_PERSONAJES[p] || { ru: p });   /* para los chats */
const PORAC = {}; LEXICON_COMER.forEach(e => { PORAC[e.acento || e.ru] = e.id; });
/* Tablas de los módulos 4 y 5: palabras relacionadas una al lado de la otra.
   Cada celda: { id (si está en el léxico), ru, es } */
const celda = (ru, es) => ({ id: PORAC[ru] || null, ru, es });
const TABLAS = {
  naciones: U2_NACIONES.map(([p, m, f, em, ef]) => { const ep = lexComerById(PORAC[p]); return [celda(p, ep ? ep.senses[0].es : ""), celda(m, em), celda(f, ef)]; }),
  nacionesAmp: (typeof U2_NACIONES_AMP !== "undefined" ? U2_NACIONES_AMP : []).map(([p, m, f, em, ef]) => { const ep = lexComerById(PORAC[p]); return [celda(p, ep ? ep.senses[0].es : ""), celda(m, em), celda(f, ef)]; }),
  idiomas: U2_IDIOMAS.map(([a, b, es]) => [celda(a, es), celda(b, "en " + es)])
};

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [modId, setModId] = useState(() => new URLSearchParams(location.search).get("m"));
  const [dialogo, setDialogo] = useState(null);
  const [tarjetas, setTarjetas] = useState(null);
  const [practica, setPractica] = useState(null);
  const [visto, setVisto] = useState(1);
  const [examenU2, setExamenU2] = useState(null);
  const [, refrescar] = useState(0);

  useEffect(() => {
    (async () => {
      setDarkMode((await azGet('az_theme', 'dark')) !== 'light');
      setVisto(await azGet('az_u2_visto', 1));
      await azLoadProgress();
      azSaveUnitProgress(2, {});
      refrescar(x => x + 1);
    })();
    const pop = () => { setModId(new URLSearchParams(location.search).get("m")); setDialogo(null); setTarjetas(null); setPractica(null); };
    window.addEventListener("popstate", pop);
    return () => window.removeEventListener("popstate", pop);
  }, []);
  useEffect(() => {
    const m = modId ? unidad2Modulo(modId) : null;
    window.azFuenteActual = () => m ? "Unidad 2 · " + m.titulo : "Unidad 2";
    if (m && m.n > visto) { setVisto(m.n); azSet('az_u2_visto', m.n); }
    if (m) azGuardarUltimo({ unidad: 2, n: m.n, total: U.modulos.length, titulo: "Unidad 2 · " + m.titulo, href: "azbuka-2.html?m=" + m.id });
  }, [modId]);
  useEffect(() => { if (!practica && AZ_PROGRESS.units) setExamenU2((AZ_PROGRESS.units["2"] || {}).examen || null); }, [practica]);

  const abrirModulo = id => { history.pushState(null, "", id ? "?m=" + id : location.pathname); setModId(id); window.scrollTo(0, 0); };
  const practicarUnidad = () => setPractica({ titulo: "Unidad 2", pool: EJ_U2_BASE.filter(e => e.modulo <= Math.max(visto, 1)) });
  const practicarModulo = m => setPractica({ titulo: m.titulo, pool: EJ_U2_BASE.filter(e => e.modulo === m.n) });
  const practicarAmpliacion = m => setPractica({ titulo: m.ampliacion.titulo, pool: EJ_U2.filter(e => e.ampliacion && e.modulo === m.n) });
  const rendirExamen = m => setPractica({ titulo: "Evaluación de la Unidad 2", pool: EJ_U2_BASE, examen: { intro: m.intro, partes: m.partes, aprobado: m.aprobado } });
  const reforzar = parte => setPractica({ titulo: "Reforzar: " + parte.nombre, pool: EJ_U2_BASE.filter(e => parte.tipos.indexOf(e.tipo) >= 0) });
  const chat = id => setPractica({ titulo: "Chat", pool: EJ_U2.filter(e => e.id === "U2-chat-" + id), n: 1 });

  const c = azColors(darkMode);
  const green = darkMode ? "#4CAF82" : "#2E7D55";
  const mod = modId ? unidad2Modulo(modId) : null;
  const idx = mod ? U.modulos.indexOf(mod) : -1;
  const prev = mod && U.modulos[idx - 1], next = mod && U.modulos[idx + 1];
  const palabrasDom = OBJETIVO_U2.filter(id => azItem("lex:" + id).level === 2).length;
  const tabs = mod ? [
    { id: "u", icon: "⊞", aria: "Unidad", action: () => abrirModulo(null) },
    { id: "p", icon: "‹", aria: "Módulo anterior", disabled: !prev, action: () => prev && abrirModulo(prev.id) },
    { id: "m", texto: "Módulo " + mod.n },
    { id: "s", icon: "›", aria: "Módulo siguiente", disabled: !next, action: () => next && abrirModulo(next.id) }
  ] : azTabsUnidad(2);

  const portada = h(AzPortadaUnidad, { u: U, c, green, visto: Math.max(visto, 1), examen: examenU2, onPracticar: practicarUnidad, onAbrir: abrirModulo,
    progreso: [{ label: "Palabras dominadas", valor: palabrasDom, total: OBJETIVO_U2.length }] });

  let vista = null;
  if (mod) {
    const secciones = h(AzSecciones, { secciones: mod.secciones });
    vista = h("div", { key: mod.id, style: { animation: "fadeIn 0.3s ease", paddingTop: 18 } },
      h("div", { className: "u-kicker" }, "Unidad 2 · Módulo " + mod.n),
      h("h1", { className: "u-title" }, mod.titulo),
      h("p", { className: "u-text", style: { marginTop: 12 } }, azFmt(mod.intro)),
      mod.tipo === "leccion" && h(React.Fragment, null,
        mod.pronombres && h("table", { className: "ptabla" }, h("tbody", null, mod.pronombres.map(p => h("tr", { key: p[0] },
          h("td", { lang: "ru", style: { fontWeight: 800, color: c.gold, width: "40%" } }, p[0]), h("td", null, p[1]),
          h("td", { style: { width: 40 } }, h("button", { className: "play", onClick: () => azHablarRu(p[0]), "aria-label": "Escuchar" }, "▶")))))),
        secciones,
        mod.mapa && h(React.Fragment, null, h("div", { className: "u-sec" }, "Mapa"), h(AzMapaExplorar, { c })),
        mod.frases && mod.frases.length > 0 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Frases"), h(AzFrasesLista, { ids: mod.frases, c })),
        mod.tabla && h(React.Fragment, null, h("div", { className: "u-sec" }, mod.tabla.titulo),
          h(AzTablaGrupos, { encabezados: mod.tabla.encabezados, filas: TABLAS[mod.tabla.filas], c })),
        mod.vocab && mod.vocab.length > 0 && (() => {
          const enTabla = mod.tabla ? new Set([].concat(...TABLAS[mod.tabla.filas]).map(x => x.id)) : new Set();
          const resto = mod.vocab.filter(id => !enTabla.has(id));
          return resto.length > 0 && h(React.Fragment, null, h("div", { className: "u-sec" }, (mod.tabla ? "Más vocabulario (" : "Vocabulario (") + resto.length + ")"), h(AzVocabulario, { ids: resto, c }));
        })(),
        mod.dialogos && mod.dialogos.length > 0 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Diálogos"),
          h(AzListaDialogos, { ids: mod.dialogos, onAbrir: id => setDialogo({ id }) })),
        mod.vocab && mod.vocab.length > 0 && h("button", { className: "ubtn", onClick: () => setTarjetas({ ids: mod.vocab, titulo: mod.titulo }) }, "Tarjetas (" + mod.vocab.length + ")"),
        h("button", { className: "ubtn", style: { marginTop: 10 }, onClick: () => practicarModulo(mod) }, "Practicar este módulo"),
        mod.ampliacion && h("div", { style: { marginTop: 28, paddingTop: 6, borderTop: `1px solid ${c.border}` } },
          h("div", { className: "u-sec" }, mod.ampliacion.titulo + " · opcional"),
          h("p", { className: "u-text", style: { fontSize: 14.5 } }, azFmt(mod.ampliacion.intro)),
          mod.ampliacion.tabla && h(AzTablaGrupos, { encabezados: mod.ampliacion.tabla.encabezados, filas: TABLAS[mod.ampliacion.tabla.filas], c }),
          (() => {
            const enTabla = mod.ampliacion.tabla ? new Set([].concat(...TABLAS[mod.ampliacion.tabla.filas]).map(x => x.id)) : new Set();
            const resto = mod.ampliacion.vocab.filter(id => !enTabla.has(id));
            return resto.length > 0 && h(React.Fragment, null, h("div", { className: "u-sec" }, "Más vocabulario (" + resto.length + ")"), h(AzVocabulario, { ids: resto, c }));
          })(),
          h("button", { className: "ubtn", onClick: () => setTarjetas({ ids: mod.ampliacion.vocab, titulo: mod.ampliacion.titulo }) }, "Tarjetas (" + mod.ampliacion.vocab.length + ")"),
          h("button", { className: "ubtn sec", style: { marginTop: 10 }, onClick: () => practicarAmpliacion(mod) }, "Practicar la ampliación"))),
      mod.tipo === "conversaciones" && h(React.Fragment, null,
        h("div", { className: "u-sec" }, "Diálogos para escuchar y grabarte"),
        h(AzListaDialogos, { ids: mod.dialogos, onAbrir: id => setDialogo({ id, grabar: true }) }),
        h("div", { className: "u-sec" }, "Chats"),
        h("div", { className: "u-text", style: { fontSize: 14 } }, "Un personaje te escribe y vos contestás en ruso. Hay varias respuestas válidas: contestá como quieras, con tu nombre y tu país."),
        U2_CHATS.map(ch => h("div", { key: ch.id, className: "u-card mod", role: "button", tabIndex: 0, onClick: () => chat(ch.id) },
          h("div", { style: { flex: 1, minWidth: 0 } }, h("div", { className: "mod-t" }, ch.titulo), h("div", { className: "mod-d", lang: "ru" }, personaje(ch.p).ru + ": " + ch.pasos[0].bot)))),
        h("button", { className: "ubtn", style: { marginTop: 18 }, onClick: () => practicarModulo(mod) }, "Practicar conversaciones")),
      mod.tipo === "proyecto" && h(AzProyecto, { mod, c, green, clave: "az_u2_proyecto", fuente: { titulo: "Unidad 2 · Proyecto final", href: "azbuka-2.html?m=u2m10" }, aviso: AVISO_ACENTOS }),
      mod.tipo === "examen" && h(React.Fragment, null,
        h("div", { className: "u-card", style: { padding: "6px 16px", marginTop: 16 } }, mod.partes.map((p, k) =>
          h("div", { key: p.nombre, style: { display: "flex", justifyContent: "space-between", padding: "10px 0", borderTop: k ? `1px solid ${c.border}` : "none", fontSize: 14.5 } },
            h("span", { style: { fontWeight: 600 } }, p.nombre), h("span", { style: { color: c.textMuted } }, p.n + (p.n === 1 ? " ejercicio" : " ejercicios"))))),
        examenU2 && h("div", { style: { marginTop: 14, fontSize: 14, color: examenU2.aprobado ? green : "#E2884A", fontWeight: 700 } },
          "Última vez: " + examenU2.pct + " % (" + examenU2.fecha.split("-").reverse().join("/") + ")" + (examenU2.aprobado ? " · aprobada" : "")),
        h("button", { className: "ubtn", onClick: () => rendirExamen(mod) }, examenU2 ? "Rendir de nuevo" : "Empezar la evaluación")),
      next && h("button", { className: "ubtn sec", style: { marginTop: 22 }, onClick: () => abrirModulo(next.id) }, "Siguiente: " + next.titulo));
  }

  return h(React.Fragment, null,
    h(AzEstilosUnidad, { c, green }),
    h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs }, mod ? vista : portada),
    practica && h(AzPractica, { key: practica.titulo + (practica.pool[0] || {}).id, unidad: 2, titulo: practica.titulo, pool: practica.pool, mezcla: U2_MEZCLA,
      n: azNPractica(practica.pool, practica.n), dark: darkMode, aviso: AVISO_ACENTOS, examen: practica.examen, onReforzar: reforzar,
      onSalir: () => { setPractica(null); refrescar(x => x + 1); } }),
    dialogo && h(AzHojaDialogo, { d: dialogoById(dialogo.id), c, grabar: dialogo.grabar, objetivo: OBJETIVO_U2, onClose: () => setDialogo(null) }),
    tarjetas && h(AzTarjetasPalabras, { ids: tarjetas.ids, titulo: tarjetas.titulo, c, green, onClose: () => { setTarjetas(null); refrescar(x => x + 1); } }),
    h(AzBurbujaHost, { dark: darkMode }));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById('root'));
</script>
</body>
</html>
