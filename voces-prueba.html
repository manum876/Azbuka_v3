<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Азбука — Prueba de voces</title>
<meta name="apple-mobile-web-app-title" content="Азбука">
<meta name="theme-color" content="#0F0F14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/core.css">
</head>
<body>
<div id="root"></div>
<script src="assets/preact.js"></script>
<script src="data/data-dialogos.js"></script>
<script src="js/core.js"></script>
<script src="assets/supabase.js"></script>
<script src="js/cuenta.js"></script>
<script src="js/shell.js"></script>
<script src="js/unidad-ui.js"></script>
<script>
/* ============================================================
   VOCES-PRUEBA.HTML — Prueba de voces generadas (15/10/2026)
   Maqueta para elegir las voces de Silero antes de sumarlas a la app (v2, 15/10/2026: audios a 96 kbps, precarga y sin cortar la voz del teléfono).
   No está en el menú ni en AZ_PRECACHE: se abre con el enlace.
   · Teoría y palabras de una unidad → la voz de narración elegida
     (audio/prueba/<voz>/<id>.mp3, generado por GitHub Actions).
   · Dos diálogos → una voz por personaje.
   · Consultas (Diccionario, Casos, Verbos) → la voz del teléfono.
   Lo que se elige se guarda en az_voces_prueba y se resume al final
   para pasárselo a Claude.
   ============================================================ */
const { useState, useEffect } = htmPreact;
const h = React.createElement;
let P = null;
const VOZ_ES = { aidar: "Aidar · hombre", eugene: "Eugene · hombre", baya: "Baya · mujer", kseniya: "Kseniya · mujer", xenia: "Xenia · mujer" };
const ROLES = [["narra", "Unidades (narración)", null], ["masha", "Masha", "f"], ["olga", "Olga Petrovna", "f"], ["lucas", "Lucas", "m"], ["dima", "Dima", "m"]];
const DEF = { narra: "baya", masha: "baya", olga: "kseniya", lucas: "eugene", dima: "aidar", modelo: "v5_5_ru" };
const MODELOS = [["", "Modelo v4"], ["v5_5_ru", "Modelo v5.5 (nuevo)"]];
function leerEleccion() { try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem("az_voces_prueba") || "{}")); } catch (e) { return Object.assign({}, DEF); } }

/* Reproductor (15/10/2026, v2):
   · Todos los audios de la página se bajan al abrirla y quedan en memoria (blob), así ▶ suena al instante.
   · Un solo elemento <audio> reutilizado: el iPhone tarda menos y no pelea con la voz del teléfono.
   · parar() corta solo el audio; la voz del teléfono se corta aparte (callarTelefono), y nunca justo antes
     de hablar, porque azCallar deja programado un cancel que cortaba la palabra al empezar. */
const VER = "3";
let MOD = "v5_5_ru";
const blobs = {};
const reproductor = new Audio();
reproductor.preload = "auto";
let secuencia = 0, alTerminar = null;
reproductor.onended = () => { const f = alTerminar; alTerminar = null; f && f(true); };
function url(id, voz) { return "audio/prueba/" + (MOD ? MOD + "/" : "") + voz + "/" + id + ".mp3?v=" + VER; }
function precargar(lista) {
  lista.forEach(([id, voz]) => {
    const k = MOD + "/" + voz + "/" + id;
    if (blobs[k]) return;
    blobs[k] = fetch(url(id, voz)).then(r => r.ok ? r.blob() : null).then(b => b ? URL.createObjectURL(b) : null).catch(() => null);
  });
}
function parar() { try { reproductor.pause(); } catch (e) {} const f = alTerminar; alTerminar = null; f && f(false); }
function callarTelefono() { try { window.speechSynthesis.cancel(); } catch (e) {} }
function tocarAudio(id, voz, ru, vel, alFaltar) {
  parar(); callarTelefono();
  return new Promise(async res => {
    const k = MOD + "/" + voz + "/" + id;
    if (!blobs[k]) precargar([[id, voz]]);
    const src = await blobs[k];
    if (!src) { alFaltar && alFaltar(); azHablarRu(ru); setTimeout(() => res(false), 1500); return; }
    alTerminar = res;
    reproductor.src = src; reproductor.playbackRate = vel; reproductor.preservesPitch = true; reproductor.webkitPreservesPitch = true;
    reproductor.play().catch(() => { alTerminar = null; alFaltar && alFaltar(); azHablarRu(ru); res(false); });
  });
}

function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [datos, setDatos] = useState(null);
  const [voz, setVoz] = useState(leerEleccion());
  MOD = voz.modelo == null ? "v5_5_ru" : voz.modelo;
  const [vel, setVel] = useState(1);
  const [falta, setFalta] = useState(false);
  const [sonando, setSonando] = useState(null);
  const [copiado, setCopiado] = useState(false);
  useEffect(() => { (async () => setDarkMode((await azGet("az_theme", "dark")) !== "light"))(); }, []);
  useEffect(() => { fetch("herramientas/voces/prueba.json").then(r => r.json()).then(d => { P = d; setDatos(d); }).catch(() => setDatos({ error: true })); }, []);
  useEffect(() => { if (!datos || datos.error) return;
    const l = datos.teoria.map(t => [t.id, voz.narra]);
    datos.dialogos.forEach(d => d.lineas.forEach(x => l.push([x.id, voz[x.p]])));
    precargar(l); }, [datos, voz]);
  const c = azColors(darkMode);
  const elegir = (rol, v) => { const n = Object.assign({}, voz, { [rol]: v }); setVoz(n); try { localStorage.setItem("az_voces_prueba", JSON.stringify(n)); } catch (e) {} };
  const chip = (on, txt, fn, key) => h("button", { key, className: "btn", onClick: fn, style: Object.assign({ padding: "7px 11px", borderRadius: 10, fontSize: 12.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" },
    on ? { background: c.gold + "22", border: `1px solid ${c.gold}`, color: c.gold } : { background: c.bg2, border: `1px solid ${c.border}`, color: c.textMuted }) }, txt);
  const lbl = t => h("div", { className: "u-sec" }, t);
  const play = (id, v, ru) => { setSonando(id); tocarAudio(id, v, ru, vel, () => setFalta(true)).then(() => setSonando(s => s === id ? null : s)); };
  const btnPlay = (id, v, ru) => h("button", { className: "play", onClick: () => play(id, v, ru), "aria-label": "Escuchar", style: sonando === id ? { borderColor: c.gold, color: c.gold } : null }, "▶");
  const tel = ru => h("button", { className: "play", onClick: () => { parar(); azHablarRu(ru); }, "aria-label": "Escuchar con la voz del teléfono" }, "▶");

  if (!datos) return h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs: [] }, h("div", { className: "u-text", style: { paddingTop: 18 } }, "Cargando…"));
  if (datos.error) return h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs: [] }, h("div", { className: "u-text", style: { paddingTop: 18 } }, "No se pudo cargar la lista de la prueba."));
  const T = id => datos.teoria.find(x => x.id === id);
  const palabra = id => { const x = T(id);
    return h("button", { key: id, onClick: () => play(id, voz.narra, x.ru), lang: "ru",
      style: { background: "none", border: "none", padding: 0, font: "inherit", color: c.text, fontWeight: 700, borderBottom: `2px dotted ${c.gold}`, cursor: "pointer" } }, x.ru); };
  const resumen = (MOD ? "Modelo v5.5" : "Modelo v4") + " · " + ROLES.map(([k, n]) => n + ": " + voz[k]).join(" · ") + (vel !== 1 ? " · velocidad " + vel : "");

  return h(AzShell, { darkMode, setDarkMode, moduleId: null, tabs: [] },
    h(AzEstilosUnidad, { c }),
    h("div", { style: { animation: "fadeIn 0.3s ease", paddingTop: 18, paddingBottom: 24 } },
      h("div", { className: "u-kicker" }, "Maqueta"),
      h("h1", { className: "u-title" }, "Prueba de voces"),
      h("div", { className: "u-text", style: { marginTop: 8 } }, "Las palabras y los diálogos suenan con voces generadas (Silero). Lo que se consulta en el Diccionario, Casos y Verbos suena con la voz del teléfono. Elige una voz para cada uno y escucha."),
      falta && h("div", { className: "u-card", style: { padding: "12px 16px", marginTop: 12, fontSize: 13.5, lineHeight: 1.5, color: c.textSub, borderColor: c.gold } },
        "Todavía no están los audios generados, así que sonó la voz del teléfono. En GitHub: Actions → «Voces de prueba» → Run workflow, y espera unos minutos."),

      lbl("Modelo de voz"),
      h("div", { style: { display: "flex", gap: 8, flexWrap: "wrap" } }, MODELOS.map(([m, t]) => chip(MOD === m, t, () => { parar(); elegir("modelo", m); }, m || "v4"))),
      h("div", { className: "u-text", style: { fontSize: 13.5, marginTop: 8 } }, "Las mismas cinco voces, generadas con el modelo anterior y con el nuevo. Cambia y escucha la misma frase."),
      lbl("Velocidad"),
      h("div", { style: { display: "flex", gap: 8, flexWrap: "wrap" } }, [[1, "Normal"], [0.85, "Un poco más lenta"], [0.7, "Lenta"]].map(([v, t]) => chip(vel === v, t, () => setVel(v), v))),

      /* ── 1. Teoría con palabras marcadas: voz de narración ── */
      lbl("1 · Teoría (voz de las unidades)"),
      h("div", { style: { display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 } }, Object.keys(VOZ_ES).map(v => chip(voz.narra === v, VOZ_ES[v], () => elegir("narra", v), v))),
      h("div", { className: "u-card", style: { padding: "14px 16px" } },
        h("div", { className: "u-text" }, "En ruso no hay artículos: ", palabra("t-dom"), " es «casa», «una casa» o «la casa». Lo mismo con ", palabra("t-kniga"), ", ", palabra("t-okno"), " y ", palabra("t-mama"), ". Toca cada palabra para oírla."),
        h("div", { className: "u-text", style: { marginTop: 10 } }, "El acento cambia el significado: ", palabra("t-zamok1"), " («castillo») y ", palabra("t-zamok2"), " («cerradura»). Fíjate si la voz los distingue.")),
      ["t-f1", "t-f2", "t-f3", "t-f4"].map(id => { const x = T(id);
        return h("div", { key: id, className: "u-card", style: { padding: "12px 16px", marginTop: 8, display: "flex", alignItems: "center", gap: 12 } },
          h("div", { style: { flex: 1 } }, h("div", { lang: "ru", style: { fontSize: 17, fontWeight: 700, color: c.text } }, x.ru), h("div", { style: { fontSize: 13.5, color: c.textMuted, marginTop: 2 } }, x.es)),
          btnPlay(id, voz.narra, x.ru)); }),

      /* ── 2. Diálogos: una voz por personaje ── */
      lbl("2 · Diálogos (una voz por personaje)"),
      ROLES.slice(1).map(([k, n, g]) => h("div", { key: k, style: { marginBottom: 10 } },
        h("div", { style: { fontSize: 13, fontWeight: 700, color: c.text, marginBottom: 6 } }, n),
        h("div", { style: { display: "flex", gap: 8, flexWrap: "wrap" } }, Object.keys(VOZ_ES).filter(v => datos.voces[v] === g).map(v => chip(voz[k] === v, VOZ_ES[v], () => elegir(k, v), v))))),
      datos.dialogos.map(d => h("div", { key: d.id, className: "u-card", style: { padding: "14px 16px", marginTop: 12 } },
        h("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 8 } },
          h("div", { style: { flex: 1, fontSize: 16, fontWeight: 800, color: c.text } }, d.titulo),
          h("button", { className: "play", "aria-label": "Escuchar el diálogo", onClick: async () => { const yo = ++secuencia; for (const l of d.lineas) { if (yo !== secuencia) break; setSonando(l.id); await tocarAudio(l.id, voz[l.p], l.ru, vel, () => setFalta(true)); if (yo !== secuencia) break; await new Promise(r => setTimeout(r, 300)); } if (yo === secuencia) setSonando(null); } }, "▶"),
          h("button", { className: "play", "aria-label": "Detener", onClick: () => { secuencia++; parar(); setSonando(null); } }, "■")),
        d.lineas.map(l => h("div", { key: l.id, style: { display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderTop: `1px solid ${c.border}` } },
          h("div", { style: { flex: 1, minWidth: 0 } },
            h("div", { style: { fontSize: 10.5, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", color: c.gold } }, DLG_PERSONAJES[l.p].es),
            h("div", { lang: "ru", style: { fontSize: 16, fontWeight: 700, color: sonando === l.id ? c.gold : c.text, marginTop: 2 } }, l.ru),
            h("div", { style: { fontSize: 13, color: c.textMuted, marginTop: 2 } }, l.es)),
          btnPlay(l.id, voz[l.p], l.ru))))),

      /* ── 3. Consultas: voz del teléfono ── */
      lbl("3 · Consultas (voz del teléfono)"),
      h("div", { className: "u-text", style: { marginBottom: 10 } }, "Así sonarían el Diccionario, Casos y Verbos: con la voz del teléfono, como hoy."),
      h("div", { className: "u-card", style: { padding: "12px 16px", display: "flex", alignItems: "center", gap: 12 } },
        h("div", { style: { flex: 1 } }, h("div", { style: { fontSize: 10.5, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", color: c.gold } }, "Diccionario"),
          h("div", { lang: "ru", style: { fontSize: 20, fontWeight: 800, color: c.text, marginTop: 2 } }, "кни́га"), h("div", { style: { fontSize: 13.5, color: c.textMuted } }, "libro · sustantivo femenino")),
        tel("кни́га")),
      h("div", { className: "u-card", style: { padding: "12px 16px", marginTop: 8 } },
        h("div", { style: { fontSize: 10.5, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", color: c.gold, marginBottom: 6 } }, "Casos · кни́га, singular"),
        [["Nominativo", "кни́га"], ["Genitivo", "кни́ги"], ["Dativo", "кни́ге"], ["Acusativo", "кни́гу"], ["Instrumental", "кни́гой"], ["Prepositivo", "о кни́ге"]].map(([cs, f]) =>
          h("div", { key: cs, style: { display: "flex", alignItems: "center", gap: 10, padding: "5px 0" } },
            h("div", { style: { width: 104, fontSize: 13, color: c.textMuted } }, cs), h("div", { lang: "ru", style: { flex: 1, fontSize: 16, color: c.text } }, f), tel(f)))),
      h("div", { className: "u-card", style: { padding: "12px 16px", marginTop: 8 } },
        h("div", { style: { fontSize: 10.5, fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", color: c.gold, marginBottom: 6 } }, "Verbos · чита́ть, presente"),
        [["я", "чита́ю"], ["ты", "чита́ешь"], ["он / она́", "чита́ет"], ["мы", "чита́ем"], ["вы", "чита́ете"], ["они́", "чита́ют"]].map(([p, f]) =>
          h("div", { key: p, style: { display: "flex", alignItems: "center", gap: 10, padding: "5px 0" } },
            h("div", { lang: "ru", style: { width: 104, fontSize: 13, color: c.textMuted } }, p), h("div", { lang: "ru", style: { flex: 1, fontSize: 16, color: c.text } }, f), tel(p.split(" ")[0] + " " + f)))),
      h("div", { style: { display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10 } },
        h("a", { href: "ficha.html?id=CMR-00230", onClick: e => azNavigate(e, "ficha.html?id=CMR-00230"), className: "btn", style: { padding: "7px 11px", borderRadius: 10, fontSize: 12.5, fontWeight: 600, background: c.bg2, border: `1px solid ${c.border}`, color: c.textMuted, textDecoration: "none" } }, "Abrir en el Diccionario"),
        h("a", { href: "casos.html?id=CMR-00230", onClick: e => azNavigate(e, "casos.html?id=CMR-00230"), className: "btn", style: { padding: "7px 11px", borderRadius: 10, fontSize: 12.5, fontWeight: 600, background: c.bg2, border: `1px solid ${c.border}`, color: c.textMuted, textDecoration: "none" } }, "Abrir en Casos"),
        h("a", { href: "verbos.html?id=CMR-00332", onClick: e => azNavigate(e, "verbos.html?id=CMR-00332"), className: "btn", style: { padding: "7px 11px", borderRadius: 10, fontSize: 12.5, fontWeight: 600, background: c.bg2, border: `1px solid ${c.border}`, color: c.textMuted, textDecoration: "none" } }, "Abrir en Verbos")),

      /* ── Resumen para pasarle a Claude ── */
      lbl("Tu elección"),
      h("div", { className: "u-card", style: { padding: "12px 16px" } },
        h("div", { style: { fontSize: 14, lineHeight: 1.6, color: c.text } }, resumen),
        h("button", { className: "ubtn sec", style: { marginTop: 12 }, onClick: () => { try { navigator.clipboard.writeText(resumen); setCopiado(true); setTimeout(() => setCopiado(false), 2000); } catch (e) {} } }, copiado ? "✓ Copiado" : "Copiar para pasárselo a Claude")),
      h("div", { style: { fontSize: 12, color: c.textMuted, marginTop: 14, lineHeight: 1.5 } }, "Voces: Silero TTS (silero-models, CC BY-NC 4.0), uso no comercial.")));
}
htmPreact.render(htmPreact.h(App, null), document.getElementById("root"));
</script>
</body>
</html>
